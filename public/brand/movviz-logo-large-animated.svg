<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" role="img" aria-label="Movviz — Vos univers en un seul endroit">
  <title>Movviz — Vos univers en un seul endroit</title>
  <defs>
  <linearGradient id="l-word" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="724" y2="0">
    <stop offset="0" stop-color="#f4f6ff"/><stop offset=".5" stop-color="#d9deef"/>
    <stop offset=".64" stop-color="#f3e3c4"/><stop offset=".8" stop-color="#ffc25c"/><stop offset="1" stop-color="#f58a14"/>
  </linearGradient>
  <linearGradient id="l-shade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".30"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/>
    <stop offset="1" stop-color="#1a1f3a" stop-opacity=".22"/>
  </linearGradient>
  <linearGradient id="l-ring" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffd98a"/><stop offset=".55" stop-color="#ffb33d"/><stop offset="1" stop-color="#f58a14"/>
  </linearGradient>
  <linearGradient id="l-play" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffc766"/><stop offset="1" stop-color="#f58a14"/>
  </linearGradient>
  <linearGradient id="l-band" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff6e1" stop-opacity="0"/><stop offset=".5" stop-color="#fff6e1" stop-opacity=".95"/><stop offset="1" stop-color="#fff6e1" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="l-spark"><stop offset="0" stop-color="#fff0c8" stop-opacity=".95"/><stop offset=".35" stop-color="#ffaf3c" stop-opacity=".45"/><stop offset="1" stop-color="#ff8c1e" stop-opacity="0"/></radialGradient><style>
  .sweep{animation:sweep 4.4s cubic-bezier(.65,0,.35,1) infinite}
  .flash{opacity:0;animation:flash 4.4s ease-out infinite}
  .ember{opacity:0;animation:ember 5.2s ease-in infinite}
  @keyframes sweep{0%{transform:translateX(0)}42%{transform:translateX(var(--run))}100%{transform:translateX(var(--run))}}
  @keyframes flash{0%,56%{opacity:0}64%{opacity:.55}100%{opacity:0}}
  @keyframes ember{0%{opacity:0;transform:translateY(0)}12%{opacity:.9}100%{opacity:0;transform:translateY(-58px)}}
  
  @media (prefers-reduced-motion:reduce){.sweep,.flash,.ember{animation:none}.flash,.ember{opacity:0}}
</style>
    <linearGradient id="l-tag" gradientUnits="userSpaceOnUse" x1="118" y1="0" x2="842" y2="0">
      <stop offset="0" stop-color="#aab4d6"/><stop offset=".62" stop-color="#aab4d6"/><stop offset=".78" stop-color="#ffb33d"/><stop offset="1" stop-color="#f58a14"/>
    </linearGradient>
    <linearGradient id="l-rule" gradientUnits="userSpaceOnUse" x1="118" y1="0" x2="842" y2="0">
      <stop offset="0" stop-color="#ffb33d" stop-opacity="0"/><stop offset=".5" stop-color="#ffb33d" stop-opacity=".9"/><stop offset="1" stop-color="#ffb33d" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g transform="translate(118 40)">
  <g fill="url(#l-word)"><path d="M0 110V0H30L75 62L120 0H150V110H122V48L75 112L28 48V110ZM292 0H322L354 74L386 0H416L369 110H339ZM422 0H452L484 74L516 0H546L499 110H469ZM560 0H588V110H560ZM612 0H724V24L652 86H724V110H612V86L684 24H612Z"/></g>
  <g fill="url(#l-shade)"><path d="M0 110V0H30L75 62L120 0H150V110H122V48L75 112L28 48V110ZM292 0H322L354 74L386 0H416L369 110H339ZM422 0H452L484 74L516 0H546L499 110H469ZM560 0H588V110H560ZM612 0H724V24L652 86H724V110H612V86L684 24H612Z"/></g>
  
  <circle cx="231" cy="55" r="56" fill="none" stroke="url(#l-ring)" stroke-width="4.2"/>
  <path fill="url(#l-play)" d="M219.8 25.88L262.36 55L219.8 84.12Z" stroke="url(#l-play)" stroke-width="5.04" stroke-linejoin="round"/>
  <clipPath id="l-shape"><path d="M0 110V0H30L75 62L120 0H150V110H122V48L75 112L28 48V110ZM292 0H322L354 74L386 0H416L369 110H339ZM422 0H452L484 74L516 0H546L499 110H469ZM560 0H588V110H560ZM612 0H724V24L652 86H724V110H612V86L684 24H612Z"/><path clip-rule="evenodd" d="M172.9 55a58.1 58.1 0 1 0 116.2 0a58.1 58.1 0 1 0 -116.2 0ZM177.1 55a53.9 53.9 0 1 1 107.8 0a53.9 53.9 0 1 1 -107.8 0Z"/><path d="M219.8 25.88L262.36 55L219.8 84.12Z"/></clipPath>
  <g clip-path="url(#l-shape)">
    <g transform="skewX(-18)"><rect class="sweep" style="--run:980px" x="-190" y="-20" width="150" height="150" fill="url(#l-band)"/></g>
    <rect class="flash" x="-20" y="-20" width="764" height="150" fill="#ffe0a0"/>
  </g></g>
  <g transform="translate(118 40)"><circle class="ember" style="animation-delay:0s" cx="96" cy="150" r="7" fill="url(#l-spark)"/><circle class="ember" style="animation-delay:1.1s" cx="206" cy="160" r="5" fill="url(#l-spark)"/><circle class="ember" style="animation-delay:2.3s" cx="352" cy="142" r="8" fill="url(#l-spark)"/><circle class="ember" style="animation-delay:0.6s" cx="488" cy="158" r="6" fill="url(#l-spark)"/><circle class="ember" style="animation-delay:3.1s" cx="612" cy="148" r="7" fill="url(#l-spark)"/><circle class="ember" style="animation-delay:1.8s" cx="724" cy="160" r="5" fill="url(#l-spark)"/><circle class="ember" style="animation-delay:3.8s" cx="270" cy="168" r="4" fill="url(#l-spark)"/><circle class="ember" style="animation-delay:2.7s" cx="560" cy="170" r="5" fill="url(#l-spark)"/></g>
  <rect x="238" y="186" width="484" height="1.6" fill="url(#l-rule)"/>
  <text x="480" y="222" text-anchor="middle" font-family="Montserrat, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="17" font-weight="500" letter-spacing="7.5" fill="url(#l-tag)">VOS UNIVERS EN UN SEUL ENDROIT</text>
</svg>
