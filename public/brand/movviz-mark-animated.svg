<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Movviz">
  <title>Movviz — symbole animé</title>
  <defs>
  <linearGradient id="m-word" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="undefined" y2="0">
    <stop offset="0" stop-color="#f4f6ff"/><stop offset=".5" stop-color="#d9deef"/>
    <stop offset=".64" stop-color="#e6dcff"/><stop offset=".8" stop-color="#b78bff"/><stop offset="1" stop-color="#7c3aed"/>
  </linearGradient>
  <linearGradient id="m-shade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".30"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/>
    <stop offset="1" stop-color="#1a1f3a" stop-opacity=".22"/>
  </linearGradient>
  <linearGradient id="m-ring" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#d9c6ff"/><stop offset=".55" stop-color="#a984ff"/><stop offset="1" stop-color="#7c3aed"/>
  </linearGradient>
  <linearGradient id="m-play" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#c9a8ff"/><stop offset="1" stop-color="#7c3aed"/>
  </linearGradient>
  <linearGradient id="m-band" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ece2ff" stop-opacity="0"/><stop offset=".5" stop-color="#ece2ff" stop-opacity=".95"/><stop offset="1" stop-color="#ece2ff" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="m-spark"><stop offset="0" stop-color="#efe4ff" stop-opacity=".95"/><stop offset=".35" stop-color="#a67bff" stop-opacity=".45"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient><style>
  .sweep{animation:sweep 4.4s cubic-bezier(.65,0,.35,1) infinite}
  .flash{opacity:0;animation:flash 4.4s ease-out infinite}
  .ember{opacity:0;animation:ember 5.2s ease-in infinite}
  @keyframes sweep{0%{transform:translateX(0)}42%{transform:translateX(var(--run))}100%{transform:translateX(var(--run))}}
  @keyframes flash{0%,56%{opacity:0}64%{opacity:.55}100%{opacity:0}}
  @keyframes ember{0%{opacity:0;transform:translateY(0)}12%{opacity:.9}100%{opacity:0;transform:translateY(-58px)}}
  
  @media (prefers-reduced-motion:reduce){.sweep,.flash,.ember{animation:none}.flash,.ember{opacity:0}}
</style></defs>
  
  <circle cx="128" cy="128" r="112" fill="none" stroke="url(#m-ring)" stroke-width="9"/>
  <path fill="url(#m-play)" d="M105.6 69.75999999999999L190.72 128L105.6 186.24Z" stroke="url(#m-play)" stroke-width="10.08" stroke-linejoin="round"/>
  
  <clipPath id="m-shape"><path clip-rule="evenodd" d="M11.5 128a116.5 116.5 0 1 0 233 0a116.5 116.5 0 1 0 -233 0ZM20.5 128a107.5 107.5 0 1 1 215 0a107.5 107.5 0 1 1 -215 0Z"/><path d="M105.6 69.75999999999999L190.72 128L105.6 186.24Z"/></clipPath>
  <g clip-path="url(#m-shape)">
    <g transform="skewX(-18)"><rect class="sweep" style="--run:380px" x="-170" y="-20" width="150" height="296" fill="url(#m-band)"/></g>
    <rect class="flash" x="-20" y="-20" width="296" height="296" fill="#d6c4ff"/>
  </g>
</svg>
