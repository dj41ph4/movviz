  <circle cx="231" cy="55" r="56" fill="none" stroke="url(#c-ring)" stroke-width="4.2"/>
  <path fill="url(#c-play)" d="M219.8 25.88L262.36 55L219.8 84.12Z" stroke="url(#c-play)" stroke-width="5.04" stroke-linejoin="round"/>
  
  <clipPath id="c-shape"><path d="M0 110V0H30L75 62L120 0H150V110H122V48L75 112L28 48V110ZM292 0H322L354 74L386 0H416L369 110H339ZM422 0H452L484 74L516 0H546L499 110H469ZM560 0H588V110H560ZM612 0H724V24L652 86H724V110H612V86L684 24H612Z"/><path clip-rule="evenodd" d="M172.9 55a58.1 58.1 0 1 0 116.2 0a58.1 58.1 0 1 0 -116.2 0ZM177.1 55a53.9 53.9 0 1 1 107.8 0a53.9 53.9 0 1 1 -107.8 0Z"/><path d="M219.8 25.88L262.36 55L219.8 84.12Z"/></clipPath>
