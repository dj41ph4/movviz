name: Release v1.25.16 one-shot

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v1.25.16-once.yml

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Finalize v1.25.16 sources
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          home = Path('android-tv-nx/app/src/main/kotlin/com/movviz/tv/ui/home/HomeScreen.kt')
          text = home.read_text(encoding='utf-8')
          old = "\n".join([
              "            .focusGroup()",
              "            .focusProperties {",
              "                exit = { focusDirection ->",
              "                    if (focusDirection == androidx.compose.ui.focus.FocusDirection.Left) navRailFocusRequester ?: androidx.compose.ui.focus.FocusRequester.Default else androidx.compose.ui.focus.FocusRequester.Default",
              "                }",
              "            }",
          ])
          new = "\n".join([
              "            .focusProperties {",
              "                exit = { focusDirection ->",
              "                    if (focusDirection == androidx.compose.ui.focus.FocusDirection.Left) navRailFocusRequester ?: androidx.compose.ui.focus.FocusRequester.Default else androidx.compose.ui.focus.FocusRequester.Default",
              "                }",
              "            }",
              "            .focusGroup()",
          ])
          if old not in text:
              raise SystemExit('HomeScreen focus modifier pattern not found')
          home.write_text(text.replace(old, new, 1), encoding='utf-8')

          lock = Path('package-lock.json')
          text = lock.read_text(encoding='utf-8')
          if text.count('"version": "1.25.15"') < 2:
              raise SystemExit('package-lock version pattern not found')
          lock.write_text(text.replace('"version": "1.25.15"', '"version": "1.25.16"', 2), encoding='utf-8')

          pkg = Path('package.json')
          text = pkg.read_text(encoding='utf-8')
          if '"version": "1.25.16"' not in text:
              if '"version": "1.25.15"' not in text:
                  raise SystemExit('package.json version is unexpected')
              pkg.write_text(text.replace('"version": "1.25.15"', '"version": "1.25.16"', 1), encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace('version-1.25.15-a855f7', 'version-1.25.16-a855f7', 1)
          text = text.replace('Version 1.25.15', 'Version 1.25.16', 1)
          readme.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          if '## v1.25.16' not in text:
              section = "\n".join([
                  "## v1.25.16 — September 2026",
                  "",
                  "### Android TV NX : focus D-pad sidebar/content fiabilisé",
                  "",
                  "- Sidebar : suppression de l'interception globale de `DPAD_RIGHT`; la sortie vers le contenu repose désormais sur `focusProperties.exit`, prévue nativement par Compose.",
                  "- Ordre des modifiers corrigé : `focusProperties` enveloppe `focusGroup` dans la NavRail et sur l'accueil, afin que les règles de sortie s'appliquent au bon focus target.",
                  "- Suppression du fallback de focus non câblé dans la NavRail, qui compliquait le parcours sans jamais être utilisé.",
                  "",
                  "",
              ])
              marker = '# Changelog\n\n'
              if marker not in text:
                  raise SystemExit('CHANGELOG header not found')
              changelog.write_text(text.replace(marker, marker + section, 1), encoding='utf-8')
          PY

          git rm .github/workflows/release-v1.25.16-once.yml
          git config user.name "dj41ph4"
          git config user.email "dj41ph4@gmail.com"
          git add android-tv-nx/app/src/main/kotlin/com/movviz/tv/ui/home/HomeScreen.kt package.json package-lock.json README.md CHANGELOG.md
          git commit -m "release: v1.25.16 — finalise le routage D-pad Compose"
          git push origin HEAD:main

      - name: Create and push v1.25.16 tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --tags
          test ! -e .git/refs/tags/v1.25.16 || { echo "v1.25.16 already exists"; exit 1; }
          git tag v1.25.16 HEAD
          git push origin v1.25.16

      - name: Dispatch release workflows
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run android-tv-build.yml --ref v1.25.16
          gh workflow run android-mobile-build.yml --ref v1.25.16
          gh workflow run linux-release-build.yml --ref v1.25.16
          gh workflow run build-installer.yml --ref v1.25.16
          gh workflow run docker-publish.yml --ref main
