name: Release v1.25.16 one-shot

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v1.25.16-once.yml

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release permissions
        run: echo "release permissions ready"
