name: v1.24.02 full release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v12402-main-release.yml'

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Align v1.24.02 version metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          old = '1.24.01'
          new = '1.24.02'
          old_code = '12401'
          new_code = '12402'

          pkg = Path('package.json')
          data = json.loads(pkg.read_text(encoding='utf-8'))
          assert data.get('version') == old, f"package.json version={data.get('version')}, expected {old}"
          data['version'] = new
          pkg.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          lock = Path('package-lock.json')
          data = json.loads(lock.read_text(encoding='utf-8'))
          assert data.get('version') == old, f"package-lock version={data.get('version')}, expected {old}"
          assert data.get('packages', {}).get('', {}).get('version') == old, 'package-lock packages[""] mismatch'
          data['version'] = new
          data['packages']['']['version'] = new
          lock.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          for fn in ['android-tv/app/build.gradle.kts', 'android-mobile/app/build.gradle.kts']:
              p = Path(fn)
              s = p.read_text(encoding='utf-8')
              assert old_code in s and f'"{old}"' in s, f'{fn}: v1.24.01 fallback metadata missing'
              s2 = re.sub(r'(versionCode\s*=.*\?:\s*)12401\b', r'\g<1>12402', s, count=1)
              s2 = re.sub(r'(versionName\s*=.*\?:\s*)"1\.24\.01"', r'\g<1>"1.24.02"', s2, count=1)
              assert s2 != s, f'{fn}: version replacement failed'
              p.write_text(s2, encoding='utf-8')

          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          assert 'Movviz-1.24.01' in s, 'README release badge is not on 1.24.01'
          p.write_text(s.replace('Movviz-1.24.01', 'Movviz-1.24.02', 1), encoding='utf-8')

          p = Path('CHANGELOG.md')
          s = p.read_text(encoding='utf-8')
          assert s.startswith('# Changelog\n'), 'unexpected CHANGELOG header'
          entry = '''# Changelog\n\n## v1.24.02 — August 2026\n\n### Assistant de configuration — création de compte restaurée\n\nSur une toute première installation, l'assistant de configuration ne proposait plus de créer le compte administrateur ni de lier un compte Plex : l'étape Assistant IA restait bloquée sur son chargement, le moteur de téléchargement affichait « aucun client configuré » et l'étape Plex restait vide. Terminer l'assistant renvoyait alors en boucle vers cette même page, car aucun compte n'avait jamais été créé. La création du compte administrateur est désormais la toute première étape de l'assistant, avant tout le reste.\n\n### Import Netflix et synchronisation Plex — dates de visionnage\n\nL'import d'un historique Netflix enregistrait chaque titre comme « vu à l'instant » au lieu de conserver sa vraie date de visionnage. Cette date réelle est maintenant préservée. La synchronisation Plex en temps réel met également à jour le contexte de l'IA immédiatement au lieu d'attendre jusqu'à plusieurs minutes.\n\n### Écran de démarrage et fenêtre « Nouveautés »\n\nLa fenêtre présentant les nouveautés d'une mise à jour pouvait s'afficher par-dessus l'écran de démarrage animé au lieu d'attendre sa disparition. Elle n'apparaît désormais qu'une fois l'écran de démarrage terminé.\n\n'''
          p.write_text(entry + s[len('# Changelog\n\n'):], encoding='utf-8')
          PY

      - name: Verify release metadata
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'),l=require('./package-lock.json'); if(p.version!=='1.24.02'||l.version!=='1.24.02'||l.packages[''].version!=='1.24.02') process.exit(1)"
          node -e "const s=require('node:sqlite'); if(typeof s.DatabaseSync!=='function') process.exit(1)"
          grep -q 'versionCode = .*12402' android-tv/app/build.gradle.kts
          grep -q 'versionName = .*"1.24.02"' android-tv/app/build.gradle.kts
          grep -q 'versionCode = .*12402' android-mobile/app/build.gradle.kts
          grep -q 'versionName = .*"1.24.02"' android-mobile/app/build.gradle.kts
          grep -q 'Movviz-1.24.02' README.md
          grep -q '## v1.24.02' CHANGELOG.md

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Portable tests
        shell: bash
        run: |
          set -euo pipefail
          FILES=$(find scripts -maxdepth 1 -name '*.test.ts' ! -name 'server-capabilities.test.ts' -print | tr '\n' ' ')
          node --experimental-transform-types --no-warnings --import ./scripts/movviz-test-loader.mjs --test $FILES

      - name: Production build
        run: npm run build

      - name: Commit and tag v1.24.02
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json android-tv/app/build.gradle.kts android-mobile/app/build.gradle.kts README.md CHANGELOG.md
          git commit -m 'v1.24.02 — assistant de configuration, imports et écran de démarrage'
          git push origin HEAD:main
          git tag -a v1.24.02 -m 'v1.24.02 — assistant de configuration, imports et écran de démarrage'
          git push origin v1.24.02

      - name: Dispatch all release builders
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api -X POST "repos/$REPO/actions/workflows/build-installer.yml/dispatches" -f ref=v1.24.02
          gh api -X POST "repos/$REPO/actions/workflows/linux-release-build.yml/dispatches" -f ref=v1.24.02
          gh api -X POST "repos/$REPO/actions/workflows/android-tv-build.yml/dispatches" -f ref=v1.24.02
          gh api -X POST "repos/$REPO/actions/workflows/android-mobile-build.yml/dispatches" -f ref=v1.24.02
          gh api -X POST "repos/$REPO/actions/workflows/docker-publish.yml/dispatches" -f ref=main
