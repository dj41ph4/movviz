name: Fix TV polish v1.24.42 workflow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_fix_tv_polish_v1.24.42.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix missing Compose imports in one-shot patch
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/_ship_tv_polish_v1.24.42.yml')
          text = workflow.read_text(encoding='utf-8')

          old = "import androidx.compose.animation.core.infiniteRepeatable\\nimport androidx.compose.animation.core.RepeatMode\\nimport androidx.compose.animation.core.tween\\nimport androidx.compose.ui.graphics.graphicsLayer\\n"
          new = "import androidx.compose.animation.core.infiniteRepeatable\\nimport androidx.compose.animation.core.rememberInfiniteTransition\\nimport androidx.compose.animation.core.RepeatMode\\nimport androidx.compose.animation.core.tween\\nimport androidx.compose.ui.graphics.graphicsLayer\\n"
          if old not in text:
              raise SystemExit('animation import anchor not found')
          text = text.replace(old, new, 1)

          old2 = "          t = read(p)\n          t = replace_once(t, 'import com.movviz.tv.ui.theme.MovvizIconDotCircle\\n'"
          new2 = "          t = read(p)\n          t = replace_once(t, 'import androidx.compose.foundation.layout.*\\n', 'import androidx.compose.foundation.layout.*\\nimport androidx.compose.foundation.shape.RoundedCornerShape\\n', 'NavRail shape import')\n          t = replace_once(t, 'import com.movviz.tv.ui.theme.MovvizIconDotCircle\\n'"
          if old2 not in text:
              raise SystemExit('NavRail patch insertion anchor not found')
          text = text.replace(old2, new2, 1)
          workflow.write_text(text, encoding='utf-8')

          Path('.github/workflows/_fix_tv_polish_v1.24.42.yml').unlink()
          PY

      - name: Commit workflow correction
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(tv): repair v1.24.42 validation workflow'
          git push origin HEAD:main
