name: v1.24.04 finalize playback release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v12404-finalize-release.yml'

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply v1.24.04 playback finalization
        shell: bash
        run: |
          set -euo pipefail
          node scripts/v12404-finalize.mjs
          sed -i 's/DIRECT_PLAY et PLEX_FALLBACK\/UNSUPPORTED/DIRECT_PLAY et UNSUPPORTED/' src/components/player/VideoPlayer.tsx

      - name: Verify scaffolding cleanup
        shell: bash
        run: |
          set -euo pipefail
          test ! -e scripts/v12404-finalize.mjs
          test ! -e .github/workflows/v12404-finalize-release.yml
          test ! -e .github/workflows/apply-playback-v3.yml
          test ! -e scripts/refactor-playback-v3.mjs
          test ! -e scripts/refactor-playback-v3-fixed.mjs
          ! find scripts -maxdepth 1 \( -name '*.tmp' -o -name '*playback-v3*' \) -print -quit | grep -q .

      - name: Verify Plex transcoder residue cleanup
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R --exclude-dir=node_modules --exclude='CHANGELOG*.md' -n 'PLEX_FALLBACK' src scripts

      - name: Verify version metadata
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'),l=require('./package-lock.json'); if(p.version!=='1.24.04'||l.version!=='1.24.04'||l.packages[''].version!=='1.24.04') process.exit(1)"

      - name: Verify Android metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = .*12404' android-tv/app/build.gradle.kts
          grep -q 'versionName = .*"1.24.04"' android-tv/app/build.gradle.kts
          grep -q 'versionCode = .*12404' android-mobile/app/build.gradle.kts
          grep -q 'versionName = .*"1.24.04"' android-mobile/app/build.gradle.kts

      - name: Verify release docs
        shell: bash
        run: |
          set -euo pipefail
          grep -q '## v1.24.04' CHANGELOG.md
          grep -q 'Movviz-1.24.04' README.md

      - name: Verify Windows media runtime
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'MOVVIZ_FFMPEG_PATH' packaging/windows/installer/movviz-service.xml
          grep -q 'MOVVIZ_FFPROBE_PATH' packaging/windows/installer/movviz-service.xml
          grep -q 'ffmpeg.exe' packaging/windows/installer/build.ps1
          grep -q 'ffprobe.exe' packaging/windows/installer/build.ps1

      - name: Verify Docker ARM media runtime
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ffprobe -version' packaging/docker/Dockerfile

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Portable tests
        shell: bash
        run: |
          set -euo pipefail
          FILES=$(find scripts -maxdepth 1 -name '*.test.ts' ! -name 'server-capabilities.test.ts' -print | tr '\n' ' ')
          node --experimental-transform-types --no-warnings --import ./scripts/movviz-test-loader.mjs --test $FILES

      - name: Production build
        run: npm run build

      - name: Commit and tag v1.24.04
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'v1.24.04 — lecteur Movviz unifié'
          git push origin HEAD:main
          git tag -a v1.24.04 -m 'v1.24.04 — lecteur Movviz unifié'
          git push origin v1.24.04

      - name: Dispatch all release builders
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api -X POST "repos/$REPO/actions/workflows/build-installer.yml/dispatches" -f ref=v1.24.04
          gh api -X POST "repos/$REPO/actions/workflows/linux-release-build.yml/dispatches" -f ref=v1.24.04
          gh api -X POST "repos/$REPO/actions/workflows/android-tv-build.yml/dispatches" -f ref=v1.24.04
          gh api -X POST "repos/$REPO/actions/workflows/android-mobile-build.yml/dispatches" -f ref=v1.24.04
          gh api -X POST "repos/$REPO/actions/workflows/docker-publish.yml/dispatches" -f ref=main

