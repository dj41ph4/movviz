name: Dispatch Android TV v1.25.53 once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dispatch-tv-v1.25.53-once.yml"

permissions:
  actions: write
  contents: write

jobs:
  dispatch-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dispatch tagged TV build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android-tv-build.yml --ref v1.25.53
      - name: Remove one-shot dispatcher
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dispatch-tv-v1.25.53-once.yml
          git commit -m "chore: remove v1.25.53 TV build dispatcher"
          git push origin HEAD:main
