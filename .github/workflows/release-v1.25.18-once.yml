name: Release v1.25.18 once

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  release:
    if: github.event.head_commit.message == 'chore: prepare v1.25.18 TV premium/avatar fix'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply v1.25.18 fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'Expected block not found in {path}: {old[:120]!r}')
              p.write_text(s.replace(old, new, count))

          nav = 'android-tv-nx/app/src/main/kotlin/com/movviz/tv/ui/home/NavRail.kt'
          replace(nav,
              'private val NAV_RAIL_EXPANDED_WIDTH = 195.dp',
              'private val NAV_RAIL_EXPANDED_WIDTH = 156.dp')
          replace(nav,
              'val expandedShape = RoundedCornerShape(8.dp)',
              'val expandedShape = RoundedCornerShape(10.dp)')
          replace(nav,
              '''            focusedContainerColor = Color.White.copy(alpha = 0.09f),
            pressedContainerColor = Color.White.copy(alpha = 0.14f),
            contentColor = if (active) MovvizInk else MovvizInkDim,
            focusedContentColor = MovvizInk,
        ),
        border = ClickableSurfaceDefaults.border(
            focusedBorder = Border(border = androidx.compose.foundation.BorderStroke(2.dp, Color.White.copy(alpha = 0.6f)), shape = shape),
        ),''',
              '''            focusedContainerColor = Color.White.copy(alpha = 0.055f),
            pressedContainerColor = Color.White.copy(alpha = 0.08f),
            contentColor = if (active) MovvizInk else MovvizInkDim,
            focusedContentColor = MovvizInk,
        ),
        border = ClickableSurfaceDefaults.border(
            focusedBorder = Border(border = androidx.compose.foundation.BorderStroke(1.dp, MovvizBrand2.copy(alpha = 0.52f)), shape = shape),
        ),''')
          replace(nav,
              '''                .let { if (active) it.background(Brush.linearGradient(listOf(MovvizBrand3, MovvizBrand, MovvizBrand2)), shape) else it }
                .let { if (!expanded) it.fillMaxSize() else it },''',
              '''                .let { if (active) it.background(MovvizBrand.copy(alpha = if (focused) 0.14f else 0.085f), shape) else it }
                .let { if (expanded) it.fillMaxWidth() else it.fillMaxSize() },''')
          replace(nav,
              'modifier = Modifier.padding(horizontal = 12.dp, vertical = 9.dp),',
              'modifier = Modifier.padding(horizontal = 11.dp, vertical = 7.dp),')
          replace(nav,
              'BookmarkIcon(color = if (active) Color.White else MovvizInkDim, modifier = Modifier.size(15.dp))',
              'BookmarkIcon(color = if (active) MovvizInk else MovvizInkDim, modifier = Modifier.size(15.dp))')
          replace(nav,
              'tint = if (active) Color.White else MovvizInkDim,',
              'tint = if (active) MovvizInk else MovvizInkDim,',
              2)
          replace(nav,
              'style = TextStyle(fontSize = 11.sp, fontWeight = FontWeight.Bold, color = if (active) Color.White else MovvizInkDim),',
              'style = TextStyle(fontSize = 10.5.sp, fontWeight = if (active) FontWeight.SemiBold else FontWeight.Medium, color = if (active) MovvizInk else MovvizInkDim),')
          replace(nav,
              'focusedBorder = Border(border = androidx.compose.foundation.BorderStroke(2.dp, MovvizBrand2), shape = avatarShape),',
              'focusedBorder = Border(border = androidx.compose.foundation.BorderStroke(1.dp, MovvizBrand2.copy(alpha = 0.55f)), shape = avatarShape),')
          replace(nav,
              'modifier = Modifier.width(240.dp),',
              'modifier = Modifier.width(215.dp),')
          replace(nav,
              'focusedBorder = Border(border = androidx.compose.foundation.BorderStroke(2.dp, MovvizBrand2.copy(alpha = 0.9f)), shape = shape),',
              'focusedBorder = Border(border = androidx.compose.foundation.BorderStroke(1.dp, MovvizBrand2.copy(alpha = 0.50f)), shape = shape),')
          replace(nav,
              'Row(verticalAlignment = Alignment.CenterVertically, modifier = Modifier.padding(horizontal = 9.dp, vertical = 8.dp)) {',
              'Row(verticalAlignment = Alignment.CenterVertically, modifier = Modifier.padding(horizontal = 9.dp, vertical = 6.dp)) {')
          replace(nav,
              'focusedBorder = Border(border = androidx.compose.foundation.BorderStroke(2.dp, if (updateAvailable) MovvizBrand2 else MovvizOk), shape = shape),',
              'focusedBorder = Border(border = androidx.compose.foundation.BorderStroke(1.dp, if (updateAvailable) MovvizBrand2.copy(alpha = 0.65f) else MovvizOk.copy(alpha = 0.65f)), shape = shape),')

          tv_vm = 'android-tv-nx/app/src/main/kotlin/com/movviz/tv/AppViewModel.kt'
          replace(tv_vm,
              '''        if (user != null && _activeProfile.value == null) {
            _activeProfile.value = TvProfile(''',
              '''        if (user != null && (_activeProfile.value == null || _activeProfile.value?.id == user.id)) {
            _activeProfile.value = TvProfile(''')
          replace(tv_vm,
              '''    /** Liste des profils connus par cette installation. Le nom historique de
     *  la méthode est conservé pour ne pas casser les appels existants, mais
     *  aucun profil n'est désormais téléchargé depuis un autre appareil. */
    suspend fun loadProfilesFromServer(): List<TvProfile> {
        val url = _serverUrl.value ?: return emptyList()
        val me = _currentUser.value
        if (me != null && profilePrefs.listProfiles(url).none { it.id == me.id }) {
            profilePrefs.saveProfile(url, me.id, me.username, me.effectiveAvatar())
        }
        val profiles = profilePrefs.listProfiles(url)
        _profiles.value = profiles
        _activeProfile.value = profiles.firstOrNull { it.id == _currentUser.value?.id }
        return profiles
    }''',
              '''    /** Rafraîchit les identités locales depuis la source canonique Movviz.
     *  On conserve la liste de profils propre à cet appareil (et ses cookies),
     *  mais nom + avatar sont réconciliés avec le serveur pour qu'un changement
     *  fait sur desktop soit visible sur TV sans recréer le profil. */
    suspend fun loadProfilesFromServer(): List<TvProfile> {
        val url = _serverUrl.value ?: return emptyList()
        val me = _currentUser.value
        if (me != null) {
            profilePrefs.saveProfile(url, me.id, me.username, me.effectiveAvatar())
        }
        if (me?.role == "admin") {
            when (val remote = MovvizRepository(url).tvProfiles()) {
                is ApiResult.Success -> {
                    val localIds = profilePrefs.listProfiles(url).map { it.id }.toSet()
                    remote.data.filter { it.id in localIds }.forEach { profile ->
                        profilePrefs.saveProfile(url, profile.id, profile.name, profile.avatar)
                    }
                }
                else -> Unit
            }
        }
        val profiles = profilePrefs.listProfiles(url)
        _profiles.value = profiles
        _activeProfile.value = profiles.firstOrNull { it.id == _currentUser.value?.id }
        return profiles
    }''')

          mobile_vm = 'android-mobile-nx/app/src/main/kotlin/com/movviz/nx/mobile/AppViewModel.kt'
          replace(mobile_vm,
              '''    /** Liste des profils connus par cette installation. Le nom historique de
     *  la méthode est conservé pour ne pas casser les appels existants, mais
     *  aucun profil n'est désormais téléchargé depuis un autre appareil. */
    suspend fun loadProfilesFromServer(): List<TvProfile> {
        val url = _serverUrl.value ?: return emptyList()
        val me = _currentUser.value
        if (me != null) {
            profilePrefs.saveProfile(url, me.id, me.username, me.effectiveAvatar())
        }
        val profiles = profilePrefs.listProfiles(url)
        _profiles.value = profiles
        _activeProfile.value = profiles.firstOrNull { it.id == _currentUser.value?.id }
        return profiles
    }''',
              '''    /** Rafraîchit nom + avatar des profils locaux depuis Movviz sans importer
     *  de nouvelles sessions sur l'appareil. customAvatar reste prioritaire
     *  côté serveur et Plex n'est qu'un fallback. */
    suspend fun loadProfilesFromServer(): List<TvProfile> {
        val url = _serverUrl.value ?: return emptyList()
        val me = _currentUser.value
        if (me != null) {
            profilePrefs.saveProfile(url, me.id, me.username, me.effectiveAvatar())
        }
        if (me?.role == "admin") {
            when (val remote = MovvizRepository(url).tvProfiles()) {
                is ApiResult.Success -> {
                    val localIds = profilePrefs.listProfiles(url).map { it.id }.toSet()
                    remote.data.filter { it.id in localIds }.forEach { profile ->
                        profilePrefs.saveProfile(url, profile.id, profile.name, profile.avatar)
                    }
                }
                else -> Unit
            }
        }
        val profiles = profilePrefs.listProfiles(url)
        _profiles.value = profiles
        _activeProfile.value = profiles.firstOrNull { it.id == _currentUser.value?.id }
        return profiles
    }''')

          home = 'android-tv-nx/app/src/main/kotlin/com/movviz/tv/ui/home/HomeScreen.kt'
          replace(home,
              'Text(text = "Reprendre", style = TextStyle(fontSize = 11.sp, fontWeight = FontWeight.Bold, color = Color.White))',
              'Text(text = if (current.isResumeCard && (current.progressPercent ?: 0) > 0) "Reprendre" else "Lire", style = TextStyle(fontSize = 11.sp, fontWeight = FontWeight.Bold, color = Color.White))')
          replace(home,
              '// CTA principal maquette : dégradé de marque + "Reprendre".',
              '// CTA principal : "Lire" par défaut, "Reprendre" seulement avec une progression réelle.')

          # Version globale
          replace('package.json', '"version": "1.25.17"', '"version": "1.25.18"')
          p = Path('package-lock.json')
          s = p.read_text()
          if '"version": "1.25.17"' not in s:
              raise SystemExit('package-lock version 1.25.17 not found')
          p.write_text(s.replace('"version": "1.25.17"', '"version": "1.25.18"', 2))

          readme = Path('README.md')
          rs = readme.read_text()
          if '1.25.17' in rs:
              readme.write_text(rs.replace('1.25.17', '1.25.18'))

          changelog = Path('CHANGELOG.md')
          cs = changelog.read_text()
          entry = '''## v1.25.18 — September 2026

### Android TV NX — sidebar premium + avatars Movviz réellement synchronisés

- Sidebar déployée réduite de 195 dp à 156 dp (-20 %).
- Suppression du gros dégradé actif et du contour blanc 2 dp : états actif/focus plus sobres, fond de marque léger et liseré 1 dp.
- Correction du fond actif qui ne remplissait pas la largeur du bouton déployé.
- Popup profil et footer harmonisés avec le même langage visuel premium.
- Le profil actif est désormais rafraîchi même s'il existe déjà en cache : une photo changée sur desktop remplace immédiatement l'ancien avatar TV.
- Les profils déjà connus de l'appareil réconcilient nom/avatar avec `/api/tv-profiles`; l'avatar Movviz (`customAvatar`) reste prioritaire et Plex n'est qu'un fallback.
- Même réconciliation appliquée au client NX mobile.
- Hero « À la une » : `Lire` par défaut, `Reprendre` uniquement lorsqu'une vraie progression existe.

'''
          if not cs.startswith('## v1.25.18'):
              changelog.write_text(entry + cs)
          PY

      - name: Validate patch assertions
        shell: bash
        run: |
          grep -q 'NAV_RAIL_EXPANDED_WIDTH = 156.dp' android-tv-nx/app/src/main/kotlin/com/movviz/tv/ui/home/NavRail.kt
          grep -q 'if (expanded) it.fillMaxWidth() else it.fillMaxSize()' android-tv-nx/app/src/main/kotlin/com/movviz/tv/ui/home/NavRail.kt
          grep -q 'current.isResumeCard' android-tv-nx/app/src/main/kotlin/com/movviz/tv/ui/home/HomeScreen.kt
          grep -q 'MovvizRepository(url).tvProfiles()' android-tv-nx/app/src/main/kotlin/com/movviz/tv/AppViewModel.kt
          grep -q 'MovvizRepository(url).tvProfiles()' android-mobile-nx/app/src/main/kotlin/com/movviz/nx/mobile/AppViewModel.kt

      - name: Compile Android TV NX
        working-directory: android-tv-nx
        run: ./gradlew :app:compileReleaseKotlin --no-daemon

      - name: Compile Android Mobile NX
        working-directory: android-mobile-nx
        run: ./gradlew :app:compileReleaseKotlin --no-daemon

      - name: Commit, push and tag
        shell: bash
        run: |
          git config user.name 'dj41ph4'
          git config user.email 'dj41ph4@gmail.com'
          git rm .github/workflows/release-v1.25.18-once.yml
          git add android-tv-nx android-mobile-nx package.json package-lock.json README.md CHANGELOG.md
          git commit -m 'release: v1.25.18 — NX TV premium et avatars Movviz synchronisés'
          git push origin HEAD:main
          git tag v1.25.18
          git push origin v1.25.18

      - name: Dispatch release builds
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run android-tv-build.yml --ref v1.25.18
          gh workflow run android-mobile-build.yml --ref v1.25.18
          gh workflow run linux-release-build.yml --ref v1.25.18
          gh workflow run build-installer.yml --ref v1.25.18
          gh workflow run docker-publish.yml --ref main
