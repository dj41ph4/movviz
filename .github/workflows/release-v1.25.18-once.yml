name: Release v1.25.18 once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-v1.25.18-once.yml

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch NX TV premium sidebar and avatar refresh
        shell: python
        run: |
          from pathlib import Path

          nav_path = Path('android-tv-nx/app/src/main/kotlin/com/movviz/tv/ui/home/NavRail.kt')
          s = nav_path.read_text(encoding='utf-8')

          if 'import androidx.compose.ui.layout.ContentScale' not in s:
              s = s.replace('import androidx.compose.ui.graphics.Color\n', 'import androidx.compose.ui.graphics.Color\nimport androidx.compose.ui.layout.ContentScale\n')

          s = s.replace(
'''            colors = ClickableSurfaceDefaults.colors(containerColor = Color.White.copy(alpha = .06f), focusedContainerColor = Color.White.copy(alpha = .14f)),
            border = ClickableSurfaceDefaults.border(
                focusedBorder = Border(border = androidx.compose.foundation.BorderStroke(1.dp, MovvizBrand2.copy(alpha = 0.55f)), shape = avatarShape),
            ),''',
'''            colors = ClickableSurfaceDefaults.colors(
                containerColor = Color.White.copy(alpha = .045f),
                focusedContainerColor = Color.White.copy(alpha = .075f),
            ),''')

          old = '''                Box(Modifier.fillMaxHeight().aspectRatio(1f).clip(androidx.compose.foundation.shape.CircleShape), contentAlignment = Alignment.Center) {
                    if (active?.avatar?.startsWith("http") == true) AsyncImage(model = active.avatar, contentDescription = active.name, modifier = Modifier.fillMaxSize().clip(avatarShape))
                    else Box(Modifier.fillMaxSize().background(Brush.linearGradient(listOf(MovvizBrand, MovvizBrand2))), contentAlignment = Alignment.Center) {
                        Text(active?.name?.take(2)?.uppercase() ?: "?", color = Color.White, fontSize = 10.sp, fontWeight = FontWeight.Bold)
                    }
                }'''
          new = '''                ProfileAvatar(
                    profile = active,
                    modifier = Modifier.fillMaxHeight().aspectRatio(1f),
                    fontSize = 10.sp,
                )'''
          if old not in s:
              raise SystemExit('footer avatar block not found')
          s = s.replace(old, new, 1)

          old = '''                            Box(Modifier.size(26.dp).clip(androidx.compose.foundation.shape.CircleShape).background(Brush.linearGradient(listOf(MovvizBrand, MovvizBrand2))), contentAlignment = Alignment.Center) {
                                if (active?.avatar?.startsWith("http") == true) AsyncImage(model = active.avatar, contentDescription = active.name, modifier = Modifier.fillMaxSize())
                                else Text(active?.name?.take(2)?.uppercase() ?: "?", color = Color.White, fontSize = 8.sp, fontWeight = FontWeight.Bold)
                            }'''
          new = '''                            ProfileAvatar(profile = active, modifier = Modifier.size(26.dp), fontSize = 8.sp)'''
          if old not in s:
              raise SystemExit('popup active avatar block not found')
          s = s.replace(old, new, 1)

          old = '''                Box(Modifier.size(21.dp).clip(androidx.compose.foundation.shape.CircleShape).background(Brush.linearGradient(listOf(MovvizBrand, MovvizBrand2))), contentAlignment = Alignment.Center) {
                    if (avatar.avatar?.startsWith("http") == true) AsyncImage(model = avatar.avatar, contentDescription = avatar.name, modifier = Modifier.fillMaxSize())
                    else Text(avatar.name.take(2).uppercase(), color = Color.White, fontSize = 8.sp, fontWeight = FontWeight.Bold)
                }'''
          new = '''                ProfileAvatar(profile = avatar, modifier = Modifier.size(21.dp), fontSize = 8.sp)'''
          if old not in s:
              raise SystemExit('menu avatar block not found')
          s = s.replace(old, new, 1)

          marker = '''@Composable
private fun MenuItem('''
          avatar_component = '''@Composable
private fun ProfileAvatar(
    profile: TvProfile?,
    modifier: Modifier = Modifier,
    fontSize: androidx.compose.ui.unit.TextUnit = 8.sp,
) {
    val avatarUrl = profile?.avatar?.takeIf { it.isNotBlank() }
    var failed by remember(avatarUrl) { mutableStateOf(false) }
    Box(
        modifier = modifier
            .clip(androidx.compose.foundation.shape.CircleShape)
            .background(Color.White.copy(alpha = 0.055f)),
        contentAlignment = Alignment.Center,
    ) {
        if (avatarUrl != null && !failed) {
            AsyncImage(
                model = avatarUrl,
                contentDescription = profile.name,
                contentScale = ContentScale.Crop,
                onError = { failed = true },
                modifier = Modifier.fillMaxSize(),
            )
        }
        if (avatarUrl == null || failed) {
            Box(
                Modifier.fillMaxSize().background(Brush.linearGradient(listOf(MovvizBrand.copy(alpha = .82f), MovvizBrand2.copy(alpha = .82f)))),
                contentAlignment = Alignment.Center,
            ) {
                Text(profile?.name?.take(2)?.uppercase() ?: "?", color = Color.White, fontSize = fontSize, fontWeight = FontWeight.Bold)
            }
        }
    }
}

'''
          if marker not in s:
              raise SystemExit('MenuItem marker not found')
          s = s.replace(marker, avatar_component + marker, 1)

          s = s.replace(
'''        colors = ClickableSurfaceDefaults.colors(
            containerColor = Color.Transparent,
            focusedContainerColor = Color.White.copy(alpha = 0.09f),
            contentColor = if (accent) MovvizBrand2 else MovvizInk,
            focusedContentColor = MovvizInk,
        ),
        border = ClickableSurfaceDefaults.border(
            focusedBorder = Border(border = androidx.compose.foundation.BorderStroke(1.dp, MovvizBrand2.copy(alpha = 0.50f)), shape = shape),
        ),''',
'''        colors = ClickableSurfaceDefaults.colors(
            containerColor = Color.Transparent,
            focusedContainerColor = Color.White.copy(alpha = 0.055f),
            contentColor = if (accent) MovvizBrand2 else MovvizInk,
            focusedContentColor = MovvizInk,
        ),''')

          s = s.replace(
'''        colors = ClickableSurfaceDefaults.colors(
            containerColor = Color.Transparent,
            focusedContainerColor = Color.White.copy(alpha = 0.055f),
            pressedContainerColor = Color.White.copy(alpha = 0.08f),
            contentColor = if (active) MovvizInk else MovvizInkDim,
            focusedContentColor = MovvizInk,
        ),
        border = ClickableSurfaceDefaults.border(
            focusedBorder = Border(border = androidx.compose.foundation.BorderStroke(1.dp, MovvizBrand2.copy(alpha = 0.52f)), shape = shape),
        ),''',
'''        colors = ClickableSurfaceDefaults.colors(
            containerColor = Color.Transparent,
            focusedContainerColor = Color.White.copy(alpha = 0.035f),
            pressedContainerColor = Color.White.copy(alpha = 0.05f),
            contentColor = if (active) MovvizInk else MovvizInkDim,
            focusedContentColor = MovvizInk,
        ),''')

          s = s.replace(
'                .let { if (active) it.background(MovvizBrand.copy(alpha = if (focused) 0.14f else 0.085f), shape) else it }',
'                .let { if (active) it.background(MovvizBrand.copy(alpha = if (focused) 0.060f else 0.035f), shape) else it }')

          target = '''            if (expanded) {
                Row('''
          replacement = '''            if (expanded && active) {
                Box(
                    Modifier
                        .align(Alignment.CenterStart)
                        .padding(start = 1.dp)
                        .width(2.dp)
                        .height(18.dp)
                        .clip(RoundedCornerShape(2.dp))
                        .background(MovvizBrand2.copy(alpha = if (focused) .95f else .72f))
                )
            }
            if (expanded) {
                Row('''
          if target not in s:
              raise SystemExit('expanded nav block not found')
          s = s.replace(target, replacement, 1)

          nav_path.write_text(s, encoding='utf-8')

          vm_path = Path('android-tv-nx/app/src/main/kotlin/com/movviz/tv/AppViewModel.kt')
          v = vm_path.read_text(encoding='utf-8')

          old = '''        if (user != null && (_activeProfile.value == null || _activeProfile.value?.id == user.id)) {
            _activeProfile.value = TvProfile(
                id = user.id,
                serverUrl = url,
                name = user.username,
                avatar = user.effectiveAvatar(),
                cookieSnapshot = ApiClient.sessionSnapshot(url),
            )
        }'''
          new = '''        if (user != null && (_activeProfile.value == null || _activeProfile.value?.id == user.id)) {
            val refreshedProfile = TvProfile(
                id = user.id,
                serverUrl = url,
                name = user.username,
                avatar = user.effectiveAvatar(),
                cookieSnapshot = ApiClient.sessionSnapshot(url),
            )
            _activeProfile.value = refreshedProfile
            _profiles.value = _profiles.value.map { if (it.id == user.id) refreshedProfile else it }
        }'''
          if old not in v:
              raise SystemExit('refreshCurrentUser profile block not found')
          v = v.replace(old, new, 1)

          needle = '''        val profile = _activeProfile.value ?: return
        homeBootstrapStartedAt = SystemClock.elapsedRealtime()'''
          repl = '''        val profile = _activeProfile.value ?: return
        // Réconcilie l'identité dès l'entrée sur l'accueil : un avatar modifié
        // sur desktop doit remplacer immédiatement l'ancien cache local TV.
        viewModelScope.launch {
            val refreshed = refreshCurrentUser()
            if (refreshed?.role == "admin") loadProfilesFromServer()
        }
        homeBootstrapStartedAt = SystemClock.elapsedRealtime()'''
          if needle not in v:
              raise SystemExit('bootstrapHome insertion point not found')
          v = v.replace(needle, repl, 1)
          vm_path.write_text(v, encoding='utf-8')

          # Version/changelog/docs.
          p = Path('package.json')
          x = p.read_text(encoding='utf-8').replace('"version": "1.25.17"', '"version": "1.25.18"', 1)
          p.write_text(x, encoding='utf-8')

          lock = Path('package-lock.json')
          x = lock.read_text(encoding='utf-8')
          x = x.replace('"version": "1.25.17"', '"version": "1.25.18"', 2)
          lock.write_text(x, encoding='utf-8')

          readme = Path('README.md')
          x = readme.read_text(encoding='utf-8').replace('1.25.17', '1.25.18')
          readme.write_text(x, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          oldlog = changelog.read_text(encoding='utf-8')
          entry = '''## v1.25.18 — September 2026

### Android TV NX : sidebar premium + avatar réellement rafraîchi

- Focus sidebar épuré : suppression des gros contours colorés, fond actif très discret et fine barre d'accent latérale.
- Popup profil harmonisé avec le même langage visuel sobre que la navigation.
- Rendu avatar centralisé : même composant pour footer, profil actif et liste des utilisateurs, avec URL Movviz effective et fallback uniquement en cas d'échec réel.
- Réconciliation automatique du profil actif avec `/api/auth/me` à l'entrée sur l'accueil pour récupérer immédiatement une photo modifiée depuis desktop.

'''
          if not oldlog.startswith('## v1.25.18'):
              changelog.write_text(entry + oldlog, encoding='utf-8')

      - name: Compile NX TV Kotlin
        working-directory: android-tv-nx
        run: |
          chmod +x gradlew
          ./gradlew :app:compileRetailReleaseKotlin --no-daemon

      - name: Commit release
        run: |
          git config user.name "dj41ph4"
          git config user.email "dj41ph4@gmail.com"
          git rm .github/workflows/release-v1.25.18-once.yml
          git add android-tv-nx/app/src/main/kotlin/com/movviz/tv/ui/home/NavRail.kt \
                  android-tv-nx/app/src/main/kotlin/com/movviz/tv/AppViewModel.kt \
                  package.json package-lock.json README.md CHANGELOG.md
          git commit -m "release: v1.25.18 — sidebar TV premium et avatar Movviz"
          git push origin HEAD:main

      - name: Tag v1.25.18
        run: |
          git tag v1.25.18
          git push origin v1.25.18

      - name: Dispatch release builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run android-tv-build.yml --ref v1.25.18
          gh workflow run android-mobile-build.yml --ref v1.25.18
          gh workflow run linux-release-build.yml --ref v1.25.18
          gh workflow run build-installer.yml --ref v1.25.18
          gh workflow run docker-publish.yml --ref main
