name: Retry TV polish v1.24.42

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_ship_tv_polish_v1.24.42_retry.yml'

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply audited TV patch and import fixes
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/_ship_tv_polish_v1.24.42.yml').read_text(encoding='utf-8')
          begin_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n"
          begin = source.index(begin_marker) + len(begin_marker)
          end = source.index(end_marker, begin)
          script = textwrap.dedent(source[begin:end])
          Path('/tmp/apply_tv_polish.py').write_text(script, encoding='utf-8')
          PY
          python3 /tmp/apply_tv_polish.py

          python3 <<'PY'
          from pathlib import Path
          p = Path('android-tv/app/src/main/kotlin/com/movviz/tv/ui/home/NavRail.kt')
          t = p.read_text(encoding='utf-8')
          if 'import androidx.compose.animation.core.rememberInfiniteTransition\n' not in t:
              anchor = 'import androidx.compose.animation.core.infiniteRepeatable\n'
              if anchor not in t:
                  raise SystemExit('missing infiniteRepeatable import anchor')
              t = t.replace(anchor, anchor + 'import androidx.compose.animation.core.rememberInfiniteTransition\n', 1)
          if 'import androidx.compose.foundation.shape.RoundedCornerShape\n' not in t:
              anchor = 'import androidx.compose.foundation.layout.*\n'
              if anchor not in t:
                  raise SystemExit('missing layout import anchor')
              t = t.replace(anchor, anchor + 'import androidx.compose.foundation.shape.RoundedCornerShape\n', 1)
          p.write_text(t, encoding='utf-8')
          PY

          # Le script d'origine supprime son workflow dans le workspace. On ne
          # laisse pas GITHUB_TOKEN toucher .github/workflows : le connecteur
          # utilisateur nettoiera ces fichiers après le build validé.
          git checkout HEAD -- .github/workflows

      - name: Validate patch
        run: |
          set -euo pipefail
          git diff --check
          grep -q '"version": "1.24.42"' package.json
          grep -q '"version": "1.24.42"' package-lock.json
          grep -q '12442' android-tv/app/build.gradle.kts
          grep -q '12442' android-mobile/app/build.gradle.kts
          grep -q 'class PlaybackPrefs' android-tv/app/src/main/kotlin/com/movviz/tv/data/ProfilePrefs.kt
          grep -q 'Reprendre à' android-tv/app/src/main/kotlin/com/movviz/tv/ui/title/TitleDetailScreen.kt
          grep -q 'UpdateAvailableButton' android-tv/app/src/main/kotlin/com/movviz/tv/ui/home/NavRail.kt

      - name: Compile Android TV release
        working-directory: android-tv
        run: gradle assembleRelease --no-daemon

      - name: Push validated product changes to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-tv android-mobile package.json package-lock.json README.md CHANGELOG.md
          git commit -m 'v1.24.42 - polish Android TV experience'
          git push origin HEAD:main
