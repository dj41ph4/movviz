          path = 'android-tv/app/src/main/kotlin/com/movviz/tv/ui/update/UpdateOverlay.kt'
          text = read(path)
          if 'import com.movviz.tv.ui.theme.AnimatedLogo' not in text:
              text = text.replace('import com.movviz.tv.ui.theme.MovvizBackground\n', 'import com.movviz.tv.ui.theme.MovvizBackground\nimport com.movviz.tv.ui.theme.AnimatedLogo\n', 1)

