name: Apply Android TV v1.24.42 optimization

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/_tv_optimize_v1.24.42.yml"

permissions:
  contents: write
  actions: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align optimization anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('android-tv/app/src/main/kotlin/com/movviz/tv/ui/player/PlayerActivity.kt')
          t = p.read_text(encoding='utf-8-sig')
          old = '    // Anti-veille : le flag window est posé pour TOUTE la vie de l’Activity\n'
          if old not in t:
              old = "    // Anti-veille : le flag window est posé pour TOUTE la vie de l'Activity\n"
          if old not in t:
              raise SystemExit('Anti-veille anchor not found')
          suffix = old.removeprefix('    // Anti-veille : ')
          p.write_text(t.replace(old, '    // Anti-veille :\n    // ' + suffix, 1), encoding='utf-8')

          p = Path('android-tv/app/src/main/kotlin/com/movviz/tv/ui/title/TitleDetailScreen.kt')
          t = p.read_text(encoding='utf-8-sig')
          old = '    // Statut "vu" manuel par utilisateur — /api/watch-status, distinct de\n'
          if old not in t:
              raise SystemExit('watch-status anchor not found')
          p.write_text(
              t.replace(
                  old,
                  '    // Statut "vu" manuel par utilisateur\n    // — /api/watch-status, distinct de\n',
                  1,
              ),
              encoding='utf-8',
          )
          PY

      - name: Apply TV optimization patch
        run: python3 scripts/_tv_optimize_v1.24.42.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compile Android TV before publishing
        working-directory: android-tv
        run: gradle assembleDebug --no-daemon

      - name: Commit validated optimization to main
        run: |
          set -euo pipefail
          rm -f .github/workflows/_tv_optimize_v1.24.42.yml
          rm -f .github/workflows/_tag_v1.24.40.yml
          rm -f scripts/_tv_optimize_v1.24.42.py
          git config user.name "dj41ph4"
          git config user.email "dj41ph4@gmail.com"
          git add -A
          git commit -m "v1.24.42 - optimize Android TV UX and playback"
          git push origin HEAD:main

      - name: Tag v1.24.42 and launch release pipelines
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --tags origin refs/tags/v1.24.42 >/dev/null 2>&1; then
            git tag -a v1.24.42 -m "v1.24.42"
            git push origin refs/tags/v1.24.42
          fi
          for wf in android-tv-build.yml android-mobile-build.yml linux-release-build.yml build-installer.yml docker-publish.yml; do
            gh workflow run "$wf" --ref v1.24.42 || true
          done
