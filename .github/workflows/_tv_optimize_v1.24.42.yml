          end = text.index(end_marker)
          new_fn = r'''@Composable
fun AutoUpdateOverlay(
    viewModel: AppViewModel? = null,
    startupMode: Boolean = false,
    onStartupResolved: () -> Unit = {},
) {
    val context = LocalContext.current
    val updateManager = remember { UpdateManager(context.applicationContext) }
    var state by remember { mutableStateOf<UpdateUiState>(UpdateUiState.Hidden) }
    var target by remember { mutableStateOf("") }
    var pending by remember { mutableStateOf<UpdateInfo?>(null) }
    var startupResolved by remember { mutableStateOf(false) }
    var downloadedFile by remember { mutableStateOf<File?>(null) }
    val scope = rememberCoroutineScope()

    fun finishStartup() {
        if (!startupMode || startupResolved) return
        startupResolved = true
        onStartupResolved()
    }

    suspend fun startInstall(info: UpdateInfo) {
        target = info.tag
        if (!updateManager.canInstallUnknown()) {
            pending = info
            state = UpdateUiState.NeedPermission
            return
        }
        try {
            state = UpdateUiState.Downloading(0f)
            val file = updateManager.download(info) { progress ->
                state = UpdateUiState.Downloading(progress)
            }
            downloadedFile = file
            state = UpdateUiState.Installing(null)
            updateManager.installInBackground(file) { progress ->
                state = UpdateUiState.Installing(progress)
            }
            // On a volontairement démarré l'installation. Si Android refuse
            // silencieusement le commit, le bouton Installer reste le repli.
            delay(30_000L)
            state = UpdateUiState.FallbackInstall
        } catch (e: Exception) {
            android.util.Log.w("MovvizUpdate", "cycle de mise à jour interrompu", e)
            state = if (downloadedFile != null) UpdateUiState.FallbackInstall else UpdateUiState.Hidden
            if (startupMode && state == UpdateUiState.Hidden) finishStartup()
        }
    }

    val lifecycleOwner = LocalLifecycleOwner.current
    DisposableEffect(lifecycleOwner) {
        val observer = LifecycleEventObserver { _, event ->
            if (event == Lifecycle.Event.ON_RESUME) {
                val info = pending
                if (info != null && state == UpdateUiState.NeedPermission && updateManager.canInstallUnknown()) {
                    pending = null
                    scope.launch { startInstall(info) }
                }
            }
        }
        lifecycleOwner.lifecycle.addObserver(observer)
        onDispose { lifecycleOwner.lifecycle.removeObserver(observer) }
    }

    val autoUpdate by (viewModel?.autoUpdateEnabled?.collectAsState()
        ?: remember { mutableStateOf(BuildConfig.AUTO_UPDATE) })

    if (startupMode) {
        // STARTUP GATE: on vérifie AVANT que la navigation soit composée.
        // C'est le seul chemin autorisé à lancer automatiquement une install.
        LaunchedEffect(Unit) {
            if (!autoUpdate) {
                viewModel?.setAvailableUpdate(updateManager.checkForUpdate())
                finishStartup()
                return@LaunchedEffect
            }
            val info = updateManager.checkForUpdate()
            if (info == null) {
                viewModel?.setAvailableUpdate(null)
                finishStartup()
            } else {
                viewModel?.setAvailableUpdate(info)
                startInstall(info)
            }
        }

        if (state == UpdateUiState.Hidden && !startupResolved) {
            Box(
                modifier = Modifier.fillMaxSize().background(MovvizBackground),
                contentAlignment = Alignment.Center,
            ) {
                Column(horizontalAlignment = Alignment.CenterHorizontally) {
                    AnimatedLogo(size = 56.dp)
                    Spacer(Modifier.height(16.dp))
                    Text(
                        text = "Vérification de Movviz…",
                        style = TextStyle(fontSize = 14.sp, color = Color.White.copy(alpha = 0.58f)),
                    )
                }
            }
        }
    } else {
        // Pendant l'utilisation, les checks sont UNIQUEMENT informatifs.
        // Même si une nouvelle release apparaît au milieu d'un film, aucun
        // téléchargement/PackageInstaller n'est démarré ici.
        LaunchedEffect(Unit) {
            while (true) {
                val info = updateManager.checkForUpdate()
                viewModel?.setAvailableUpdate(info)
                delay(30L * 60L * 1000L)
            }
        }

        val manualTrigger = viewModel?.updateCheckTrigger?.collectAsState()?.value
        LaunchedEffect(manualTrigger) {
            if (manualTrigger == null || manualTrigger == 0) return@LaunchedEffect
            viewModel.setUpdateCheckStatus("Vérification…")
            val info = updateManager.checkForUpdate()
            viewModel.setAvailableUpdate(info)
            viewModel.setUpdateCheckStatus(
                if (info == null) "Movviz est à jour (${BuildConfig.VERSION_NAME})"
                else "Mise à jour disponible : ${info.tag}"
            )
        }

        // Seule l'action EXPLICITE sur la flèche de la sidebar arrive ici.
        val installTrigger = viewModel?.updateInstallTrigger?.collectAsState()?.value
        LaunchedEffect(installTrigger) {
            if (installTrigger == null || installTrigger == 0) return@LaunchedEffect
            val info = viewModel.availableUpdate.value ?: return@LaunchedEffect
            startInstall(info)
        }
    }

    if (state != UpdateUiState.Hidden) {
        UpdateOverlay(
            state = state,
            targetVersion = target,
            onAuthorize = { updateManager.openInstallPermissionSettings() },
            onRetryInstall = { downloadedFile?.let { updateManager.installViaSystemInstaller(it) } },
            onLater = {
                state = UpdateUiState.Hidden
                if (startupMode) finishStartup()
            },
        )
    }
}

