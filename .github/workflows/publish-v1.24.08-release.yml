name: Publish v1.24.08 GitHub release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v1.24.08-release.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          git rev-parse v1.24.08 >/dev/null

          if gh release view v1.24.08 >/dev/null 2>&1; then
            echo "Release v1.24.08 already exists"
          else
            cat > /tmp/release-notes.md <<'EOF'
          ## Branding unifié — Windows, Android, Web/PWA et Docker

          Le nouveau logo Movviz rose/mauve avec clap blanc devient l'identité commune de l'application.

          - Windows : nouvel ICO multi-résolution pour l'installeur et les raccourcis.
          - Android Mobile et Android TV : launcher/adaptive icons harmonisés.
          - Android TV : banner aligné avec le nouveau branding.
          - Web/PWA : icône canonique mise à jour.
          - Docker : assets de branding Movviz alignés sur la même identité visuelle.
          EOF
            gh release create v1.24.08 \
              --title "Movviz v1.24.08" \
              --notes-file /tmp/release-notes.md \
              --verify-tag
          fi

      - name: Remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-v1.24.08-release.yml
          git commit -m "chore(release): remove v1.24.08 publisher"
          git push origin HEAD:main
