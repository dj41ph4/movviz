name: Build Synology native SPK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: armv8
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Verify source version and SQLite
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
          fi
          node -e "const s=require('node:sqlite'); if(typeof s.DatabaseSync!=='function') process.exit(1)"
      - name: Install web dependencies
        run: npm ci --no-audit --no-fund
      - name: Install native engine dependencies
        working-directory: engine
        run: |
          set -euo pipefail
          npm ci --omit=optional --no-audit --no-fund
          node --input-type=module -e "await import('node-datachannel'); await import('webtorrent')"
          test -f node_modules/node-datachannel/build/Release/node_datachannel.node
      - name: Build Next standalone
        run: npm run build
      - name: Prepare resolver and Chromium
        working-directory: resolver
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/movviz-playwright
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          npx playwright install chromium --only-shell
          node --input-type=module -e "import { chromium } from 'playwright'; const b=await chromium.launch({headless:true,args:['--no-sandbox']}); await b.close();"
          npm prune --omit=dev --no-audit --no-fund
          test -f dist/index.js
          test -d "$PLAYWRIGHT_BROWSERS_PATH"
          echo "MOVVIZ_SPK_BROWSER_DIR=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
      - name: Download FFmpeg runtime for DSM
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ matrix.arch }}' == x86_64 ]]; then ffarch=linux64; else ffarch=linuxarm64; fi
          archive="ffmpeg-n9.0-latest-${ffarch}-lgpl-9.0.tar.xz"
          curl --fail --location --show-error --retry 4 --retry-all-errors --connect-timeout 30 --max-time 600 \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/${archive}" -o "$RUNNER_TEMP/ffmpeg.tar.xz"
          mkdir -p "$RUNNER_TEMP/ffmpeg-runtime"
          tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$RUNNER_TEMP/ffmpeg-runtime" --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          "$RUNNER_TEMP/ffmpeg-runtime/ffmpeg" -version > "$RUNNER_TEMP/ffmpeg-version.txt"
          "$RUNNER_TEMP/ffmpeg-runtime/ffprobe" -version > "$RUNNER_TEMP/ffprobe-version.txt"
          head -n 1 "$RUNNER_TEMP/ffmpeg-version.txt" "$RUNNER_TEMP/ffprobe-version.txt"
          echo "MOVVIZ_SPK_FFMPEG_DIR=$RUNNER_TEMP/ffmpeg-runtime" >> "$GITHUB_ENV"
      - name: Create DSM package
        run: bash packaging/synology-native/build.sh '${{ matrix.arch }}'
      - name: Inspect package contents
        run: |
          set -euo pipefail
          spk=(dist/nas/*.spk)
          test "${#spk[@]}" -eq 1
          tar -tf "${spk[0]}" > "$RUNNER_TEMP/spk-contents.txt"
          sort "$RUNNER_TEMP/spk-contents.txt"
          for item in INFO package.tgz scripts/start-stop-status conf/privilege PACKAGE_ICON.PNG PACKAGE_ICON_256.PNG; do
            grep -Fxq "$item" "$RUNNER_TEMP/spk-contents.txt"
          done
          tar -xOf "${spk[0]}" package.tgz > "$RUNNER_TEMP/package.tgz"
          tar -tzf "$RUNNER_TEMP/package.tgz" > "$RUNNER_TEMP/package-contents.txt"
          grep -Fxq './app/engine/src/index.mjs' "$RUNNER_TEMP/package-contents.txt"
          grep -Fxq './app/runtime/ffmpeg/ffmpeg' "$RUNNER_TEMP/package-contents.txt"
          grep -Fxq './app/runtime/ffmpeg/ffprobe' "$RUNNER_TEMP/package-contents.txt"
          grep -Fxq './app/resolver/dist/index.js' "$RUNNER_TEMP/package-contents.txt"
          grep -q '^./app/runtime/playwright/chromium_headless_shell-' "$RUNNER_TEMP/package-contents.txt"
          if grep -E '(^|/)(\.env|\.git|\.movviz-data|keystore)(/|$)|\.(pem|jks)$' "$RUNNER_TEMP/package-contents.txt"; then
            echo 'Secret or local state in package' >&2
            exit 1
          fi
          (cd dist/nas && sha256sum -c ./*.sha256)
          printf 'commit=%s\nversion=%s\narch=%s\nnode=%s\ndate=%s\n' \
            "$GITHUB_SHA" "$(node -p "require('./package.json').version")" \
            '${{ matrix.arch }}' "$(node --version)" "$(date -u -Iseconds)" > dist/nas/build-info.txt
      - uses: actions/upload-artifact@v4
        with:
          name: movviz-synology-${{ matrix.arch }}
          path: |
            dist/nas/*.spk
            dist/nas/*.sha256
            dist/nas/build-info.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: movviz-synology-*
          path: dist/nas
          merge-multiple: true
      - name: Publish to the Movviz release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist/nas
          sha256sum ./*.spk > SHA256SUMS-synology
          for attempt in $(seq 1 20); do
            if gh release view "$TAG" >/dev/null 2>&1; then break; fi
            gh release create "$TAG" --title "$TAG" --generate-notes >/dev/null 2>&1 || true
            sleep 5
          done
          gh release view "$TAG" >/dev/null
          gh release upload "$TAG" ./*.spk SHA256SUMS-synology --clobber
