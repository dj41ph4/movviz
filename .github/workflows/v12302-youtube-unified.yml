name: v1.23.02 unified YouTube ambient player
on:
  push:
    branches: [v12302-youtube-unified-staging]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Unify ambient YouTube player and bump version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # -----------------------------------------------------------------
          # 1) Generalise the proven v1.22.61 card bridge into one ambient
          #    virtual-1080p engine with independent framing profiles.
          # -----------------------------------------------------------------
          old_path = Path('src/components/media/YouTubeCardBridgePlayer.tsx')
          new_path = Path('src/components/media/YouTubeVirtualPlayer.tsx')
          s = old_path.read_text()

          old = '''const REVEAL_SETTLE_MS = 700;\nconst ADVANCE_SEC = 0.03;\n// Card-only experiment: keep YouTube's *layout viewport* genuinely large so\n// the embed chooses its desktop player layout while CSS scales that viewport\n// down into the small Movviz popover. A transform does not change the iframe\n// document's innerWidth/innerHeight, so YouTube still sees 1920x1080.\nconst VIRTUAL_PLAYER_WIDTH = 1920;\nconst VIRTUAL_PLAYER_HEIGHT = 1080;\nconst CARD_CROP_ZOOM = 1.36;\nconst VIRTUAL_LAYOUT_TIMEOUT_MS = 1500;\n'''
          new = '''const ADVANCE_SEC = 0.03;\n// All ambient YouTube previews deliberately keep a genuine 1920x1080 iframe\n// layout viewport. CSS only scales the already-laid-out iframe into the\n// visible Movviz surface, so YouTube continues to see a desktop-sized player.\nconst VIRTUAL_PLAYER_WIDTH = 1920;\nconst VIRTUAL_PLAYER_HEIGHT = 1080;\nconst VIRTUAL_LAYOUT_TIMEOUT_MS = 1500;\n\nexport type YouTubeVirtualProfile = "card" | "hero" | "detail";\n\ntype VirtualProfileConfig = {\n  zoom: number;\n  centerX: number;\n  centerY: number;\n  revealSettleMs: number;\n};\n\n// Keep each surface independently tunable even when two profiles currently\n// share the same values. Seb can visually fine-tune hero/detail afterwards\n// without coupling either one to the already-approved card framing.\nconst VIRTUAL_PROFILES: Record<YouTubeVirtualProfile, VirtualProfileConfig> = {\n  card: { zoom: 1.36, centerX: 50, centerY: 50, revealSettleMs: 700 },\n  hero: { zoom: 1.10, centerX: 50, centerY: 50, revealSettleMs: 1500 },\n  detail: { zoom: 1.10, centerX: 50, centerY: 50, revealSettleMs: 1500 },\n};\n'''
          assert old in s, 'virtual player constants changed upstream'
          s = s.replace(old, new, 1)

          old = '''export function YouTubeCardBridgePlayer({\n  trailerKey,\n  title,\n  muted,\n  loopBeforeEndSec,\n  onPlayingChange,\n  onError,\n  fallback,\n}: {\n  trailerKey: string;\n  title: string;\n  muted: boolean;\n  loopBeforeEndSec: number;\n  onPlayingChange: (playing: boolean) => void;\n  onError: () => void;\n  fallback: ReactNode;\n}) {\n'''
          new = '''export function YouTubeVirtualPlayer({\n  trailerKey,\n  title,\n  muted,\n  loopBeforeEndSec,\n  onPlayingChange,\n  onError,\n  fallback,\n  profile,\n}: {\n  trailerKey: string;\n  title: string;\n  muted: boolean;\n  loopBeforeEndSec: number;\n  onPlayingChange: (playing: boolean) => void;\n  onError: () => void;\n  fallback: ReactNode;\n  profile: YouTubeVirtualProfile;\n}) {\n'''
          assert old in s, 'virtual player signature changed upstream'
          s = s.replace(old, new, 1)

          old = '''  const [useFallback, setUseFallback] = useState(false);\n  const [virtualScale, setVirtualScale] = useState<number | null>(null);\n'''
          new = '''  const [useFallback, setUseFallback] = useState(false);\n  const [virtualScale, setVirtualScale] = useState<number | null>(null);\n  const config = VIRTUAL_PROFILES[profile];\n'''
          assert old in s
          s = s.replace(old, new, 1)

          assert 'const nextScale = coverScale * CARD_CROP_ZOOM;' in s
          s = s.replace('const nextScale = coverScale * CARD_CROP_ZOOM;', 'const nextScale = coverScale * config.zoom;', 1)
          s = s.replace(
              '`[Movviz][YouTubeBridge] ${trailerKey}: virtual ${VIRTUAL_PLAYER_WIDTH}x${VIRTUAL_PLAYER_HEIGHT} -> ${Math.round(width)}x${Math.round(height)}; scale=${nextScale.toFixed(4)}`',
              '`[Movviz][YouTubeBridge] ${trailerKey}: ${profile} virtual ${VIRTUAL_PLAYER_WIDTH}x${VIRTUAL_PLAYER_HEIGHT} -> ${Math.round(width)}x${Math.round(height)}; scale=${nextScale.toFixed(4)}`',
              1,
          )
          assert '}, REVEAL_SETTLE_MS);' in s
          s = s.replace('}, REVEAL_SETTLE_MS);', '}, config.revealSettleMs);', 1)
          # Both the layout observer and bridge lifecycle depend on the preset.
          assert s.count('}, [trailerKey, useFallback]);') == 2
          s = s.replace('}, [trailerKey, useFallback]);', '}, [trailerKey, useFallback, profile]);')

          old = '''        className="pointer-events-none absolute left-1/2 top-1/2 max-w-none border-0"\n        style={{\n          width: `${VIRTUAL_PLAYER_WIDTH}px`,\n          height: `${VIRTUAL_PLAYER_HEIGHT}px`,\n          transform: `translate(-50%, -50%) scale(${virtualScale ?? 1})`,\n          transformOrigin: "center center",\n        }}\n'''
          new = '''        className="pointer-events-none absolute max-w-none border-0"\n        style={{\n          width: `${VIRTUAL_PLAYER_WIDTH}px`,\n          height: `${VIRTUAL_PLAYER_HEIGHT}px`,\n          left: `${config.centerX}%`,\n          top: `${config.centerY}%`,\n          transform: `translate(-50%, -50%) scale(${virtualScale ?? 1})`,\n          transformOrigin: "center center",\n        }}\n'''
          assert old in s, 'virtual iframe render changed upstream'
          s = s.replace(old, new, 1)
          new_path.write_text(s)
          old_path.unlink()

          # -----------------------------------------------------------------
          # 2) TrailerHeader: one virtual engine for all three ambient usages.
          #    The old YT.Player stays as a safety fallback and modal engine.
          # -----------------------------------------------------------------
          p = Path('src/components/media/TrailerHeader.tsx')
          s = p.read_text()
          old = 'import { YouTubeCardBridgePlayer } from "@/components/media/YouTubeCardBridgePlayer";'
          new = 'import { YouTubeVirtualPlayer, type YouTubeVirtualProfile } from "@/components/media/YouTubeVirtualPlayer";'
          assert old in s
          s = s.replace(old, new, 1)

          old = '''  /** Compact hover-card treatment only; hero/title rendering stays unchanged. */\n  cardPreview?: boolean;\n  className?: string;\n'''
          new = '''  /** Compact hover-card treatment only; keeps the existing card mask/fallback. */\n  cardPreview?: boolean;\n  /** Independent virtual-1080p framing preset for each ambient surface. */\n  youtubeProfile?: YouTubeVirtualProfile;\n  className?: string;\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = 'export function TrailerHeader({ backdropPath, size, trailerKeys, enhancedSources, title, trigger, enabled = true, muted: initialMuted = true, hideSoundToggle = false, hideTopGradient = false, extraZoom = false, cardPreview = false, className }: TrailerHeaderProps) {'
          new = 'export function TrailerHeader({ backdropPath, size, trailerKeys, enhancedSources, title, trigger, enabled = true, muted: initialMuted = true, hideSoundToggle = false, hideTopGradient = false, extraZoom = false, cardPreview = false, youtubeProfile, className }: TrailerHeaderProps) {'
          assert old in s
          s = s.replace(old, new, 1)

          old = '''  const [soundOn, setSoundOn] = useState(!initialMuted);\n  const muted = !soundOn;\n'''
          new = '''  const [soundOn, setSoundOn] = useState(!initialMuted);\n  const muted = !soundOn;\n  const resolvedYouTubeProfile: YouTubeVirtualProfile = cardPreview ? "card" : (youtubeProfile ?? "detail");\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''              {cardPreview ? (\n                <YouTubeCardBridgePlayer\n                  key={candidateKey}\n                  trailerKey={candidate.key}\n                  title={title}\n                  muted={muted}\n                  loopBeforeEndSec={LOOP_BEFORE_END_SEC}\n                  onPlayingChange={setVideoPlaying}\n                  onError={onVideoError}\n                  fallback={\n                    <YouTubePlayer trailerKey={candidate.key} title={title} muted={muted} onPlayingChange={setVideoPlaying} onError={onVideoError} extraZoom={extraZoom} cardPreview />\n                  }\n                />\n              ) : (\n                <YouTubePlayer key={candidateKey} trailerKey={candidate.key} title={title} muted={muted} onPlayingChange={setVideoPlaying} onError={onVideoError} extraZoom={extraZoom} />\n              )}\n'''
          new = '''              <YouTubeVirtualPlayer\n                key={candidateKey}\n                trailerKey={candidate.key}\n                title={title}\n                muted={muted}\n                loopBeforeEndSec={LOOP_BEFORE_END_SEC}\n                onPlayingChange={setVideoPlaying}\n                onError={onVideoError}\n                profile={resolvedYouTubeProfile}\n                fallback={\n                  <YouTubePlayer\n                    trailerKey={candidate.key}\n                    title={title}\n                    muted={muted}\n                    onPlayingChange={setVideoPlaying}\n                    onError={onVideoError}\n                    extraZoom={extraZoom}\n                    cardPreview={cardPreview}\n                  />\n                }\n              />\n'''
          assert old in s, 'TrailerHeader YouTube branch changed upstream'
          s = s.replace(old, new, 1)

          # Correct the high-level comment: setPlaybackQuality is retained only
          # in the legacy fallback/modal and is no longer the ambient primary.
          s = re.sub(
              r' \* Uses the YouTube IFrame Player API \(not a raw `<iframe src=\.\.\.>`\).*? \* playVideo\(\)\) rather than the `loop=1&playlist=` URL trick, since a manual\n \* loop lets us re-assert the quality floor on every replay too\.\n',
              ' * Ambient YouTube previews use a raw 1920x1080 iframe controlled through\\n * the postMessage bridge. The legacy YT.Player implementation remains only\\n * as a guarded fallback (and for the interactive trailer modal).\\n',
              s,
              count=1,
              flags=re.S,
          )
          p.write_text(s)

          # -----------------------------------------------------------------
          # 3) Explicit profile per ambient consumer. Card remains visually
          #    identical; hero/detail start at their old effective 1.10 zoom.
          # -----------------------------------------------------------------
          p = Path('src/components/dashboard/DashboardHero.tsx')
          s = p.read_text()
          old = '''          trigger="immediate"\n          enabled={trailerEnabled}\n'''
          new = '''          trigger="immediate"\n          youtubeProfile="hero"\n          enabled={trailerEnabled}\n'''
          assert old in s
          p.write_text(s.replace(old, new, 1))

          p = Path('src/components/title/TitleContent.tsx')
          s = p.read_text()
          old = '''              trigger="immediate"\n              enabled={titlePageVideoEnabled}\n'''
          new = '''              trigger="immediate"\n              youtubeProfile="detail"\n              enabled={titlePageVideoEnabled}\n'''
          assert old in s
          p.write_text(s.replace(old, new, 1))

          p = Path('src/components/dashboard/DashboardPosterCard.tsx')
          s = p.read_text()
          old = '''                hideTopGradient\n                cardPreview\n                className="h-full w-full"\n'''
          new = '''                hideTopGradient\n                cardPreview\n                youtubeProfile="card"\n                className="h-full w-full"\n'''
          assert old in s
          p.write_text(s.replace(old, new, 1))

          # -----------------------------------------------------------------
          # 4) Release metadata: user explicitly chose 1.23.02 (1.23.01 is
          #    intentionally skipped here).
          # -----------------------------------------------------------------
          for fn in ['package.json', 'package-lock.json']:
              p = Path(fn)
              s = p.read_text()
              assert '1.23.00' in s, f'{fn}: unexpected base version'
              p.write_text(s.replace('1.23.00', '1.23.02'))

          for fn in ['android-tv/app/build.gradle.kts', 'android-mobile/app/build.gradle.kts']:
              p = Path(fn)
              s = p.read_text()
              assert '12300' in s and '1.23.00' in s, f'{fn}: unexpected base version'
              p.write_text(s.replace('12300', '12302').replace('1.23.00', '1.23.02'))

          p = Path('README.md')
          s = p.read_text()
          assert 'Movviz-1.23.00' in s
          p.write_text(s.replace('Movviz-1.23.00', 'Movviz-1.23.02', 1))

          p = Path('CHANGELOG.md')
          s = p.read_text()
          assert s.startswith('# Changelog\n')
          entry = '''# Changelog\n\n## v1.23.02 — August 2026\n\n### YouTube ambiant — moteur 1080p virtuel unifié\n\nLes trois surfaces ambiantes (carte hover, hero/carrousel et en-tête de fiche) utilisent désormais le même moteur YouTube brut avec un vrai viewport logique `1920×1080`, piloté par `postMessage` puis réduit en CSS via `ResizeObserver`. Chaque surface possède son propre preset de cadrage : `card` conserve le zoom validé `1.36`, tandis que `hero` et `detail` démarrent à `1.10` pour reproduire au plus près leur rendu précédent et rester réglables indépendamment après validation visuelle. Le bridge, `apiInterface`, le masquage du chrome lorsqu'il est exposé, la boucle avant `ENDED`, le rideau backdrop, le mute et les timeouts sont mutualisés. L'ancien `YT.Player` reste le fallback de sécurité et continue d'alimenter la modal interactive de bande-annonce. Les toggles existants, l'ordre des trailers, les chemins vidéo directs et Android restent inchangés.\n\n'''
          p.write_text(entry + s[len('# Changelog\n\n'):])
          PY
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Portable tests
        shell: bash
        run: |
          FILES=$(find scripts -maxdepth 1 -name '*.test.ts' ! -name 'server-capabilities.test.ts' -print | tr '\n' ' ')
          node --experimental-transform-types --no-warnings --import ./scripts/movviz-test-loader.mjs --test $FILES
      - name: Production build
        run: npm run build
      - name: Commit and tag v1.23.02
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'v1.23.02 — unified virtual YouTube ambient player [skip ci]'
          git tag -a v1.23.02 -m 'v1.23.02 — unified virtual YouTube ambient player'
          git push origin HEAD:v12302-youtube-unified-staging
          git push origin v1.23.02
