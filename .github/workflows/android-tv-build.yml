name: Build Android TV APK

on:
  push:
    branches: [main]
    paths: ["android-tv/**", ".github/workflows/android-tv-build.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["android-tv/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform & build-tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      # Le wrapper Gradle (gradlew/gradlew.bat + le jar) n'est pas versionné —
      # voir android-tv/README.md, il se génère normalement en ouvrant le
      # dossier dans Android Studio une première fois. Ici, on utilise
      # directement le binaire Gradle fourni par setup-gradle plutôt que
      # d'exiger ce wrapper, ce qui évite d'avoir à le committer.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare retail signing key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.MOVVIZ_ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MOVVIZ_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.MOVVIZ_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.MOVVIZ_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          key_dir="$RUNNER_TEMP/movviz-signing"
          mkdir -p "$key_dir"
          keystore="$key_dir/movviz-tv-retail.jks"
          store_password="${ANDROID_KEYSTORE_PASSWORD:-movviz-ci-retail-only}"
          key_alias="${ANDROID_KEY_ALIAS:-movviz-retail}"
          key_password="${ANDROID_KEY_PASSWORD:-$store_password}"
          if [ -n "${ANDROID_KEYSTORE_B64:-}" ]; then
            printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$keystore"
          else
            echo "::warning::Retail keystore secrets are not configured; generating an ephemeral CI key. Configure MOVVIZ_ANDROID_KEYSTORE_* for upgrade-compatible releases."
            keytool -genkeypair -v -keystore "$keystore" -storetype PKCS12 -alias "$key_alias" -keyalg RSA -keysize 4096 -validity 10000 -storepass "$store_password" -keypass "$key_password" -dname "CN=Movviz, OU=Android TV, O=Movviz, C=BE"
          fi
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$keystore" "$store_password" "$key_alias" "$key_password" > android-tv/keystore.properties

      - name: Build retail APK
        working-directory: android-tv
        run: gradle assembleRelease --no-daemon

      # Renommé explicitement "client" — contrairement à l'installeur Windows
      # (qui contient le serveur complet), cet APK est un client TV qui se
      # connecte à un serveur Movviz déjà existant. Éviter toute ambiguïté
      # dans la liste des assets d'une Release, à côté du .exe.
      - name: Rename APK as retail client build
        run: cp android-tv/app/build/outputs/apk/release/app-release.apk android-tv/app/build/outputs/apk/release/Movviz-Android-TV-client-retail.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Movviz-Android-TV-client-retail
          path: android-tv/app/build/outputs/apk/release/Movviz-Android-TV-client-retail.apk

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android-tv/app/build/outputs/apk/release/Movviz-Android-TV-client-retail.apk
          append_body: true
          body: |
            ---
            **Movviz-Android-TV-client-retail.apk** — client Android TV (Kotlin/Compose), signé pour installation retail. Se connecte à un serveur Movviz déjà installé (voir l'installeur Windows ci-dessus ou l'image Docker) ; ne fonctionne pas seul.
