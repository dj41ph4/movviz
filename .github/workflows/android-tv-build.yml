name: Build Android TV APK

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["android-tv/**"]
  workflow_dispatch:

permissions:
  contents: write

# Une version Android est reconstruite une seule fois, à partir de son tag.
# Un push avec main + tag déclenchait auparavant deux builds différents : le
# build de branche ne pouvait pas joindre d'APK à la Release et masquait
# facilement un échec du build de tag.
concurrency:
  group: android-tv-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      # Le wrapper Gradle (gradlew/gradlew.bat + le jar) n'est pas versionné —
      # voir android-tv/README.md, il se génère normalement en ouvrant le
      # dossier dans Android Studio une première fois. Ici, on utilise
      # directement le binaire Gradle fourni par setup-gradle plutôt que
      # d'exiger ce wrapper, ce qui évite d'avoir à le committer.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.MOVVIZ_ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MOVVIZ_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.MOVVIZ_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.MOVVIZ_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          key_dir="$RUNNER_TEMP/movviz-signing"
          mkdir -p "$key_dir"
          keystore="$key_dir/movviz-tv-release.jks"
          : "${ANDROID_KEYSTORE_B64:?MOVVIZ_ANDROID_KEYSTORE_B64 est requis pour une release}"
          : "${ANDROID_KEYSTORE_PASSWORD:?MOVVIZ_ANDROID_KEYSTORE_PASSWORD est requis pour une release}"
          : "${ANDROID_KEY_ALIAS:?MOVVIZ_ANDROID_KEY_ALIAS est requis pour une release}"
          : "${ANDROID_KEY_PASSWORD:?MOVVIZ_ANDROID_KEY_PASSWORD est requis pour une release}"
          store_password="$ANDROID_KEYSTORE_PASSWORD"
          key_alias="$ANDROID_KEY_ALIAS"
          key_password="$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$keystore"
          expected_cert="4e8d66761eb1cdc228c96478617910ebf5e1bba01adb000aedfa50f8e1af90ec"
          actual_cert="$(keytool -list -v -keystore "$keystore" -storepass "$store_password" -alias "$key_alias" | awk '/SHA256:/{gsub(":", "", $2); print tolower($2); exit}')"
          test "$actual_cert" = "$expected_cert" || { echo "::error::La clé CI ne correspond pas à la clé retail Movviz"; exit 1; }
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$keystore" "$store_password" "$key_alias" "$key_password" > android-tv/keystore.properties
          # NX est un canal TV séparé, mais doit être signé par la même clé
          # retail pour pouvoir se mettre à jour par-dessus lui-même.
          cp android-tv/keystore.properties android-tv-nx/keystore.properties

      # Sans ceci, versionName/versionCode restaient figés à leur valeur par
      # défaut dans build.gradle.kts quel que soit le tag publié — l'app
      # comparait alors indéfiniment son ancienne version de repli au tag
      # GitHub le plus récent et se croyait éternellement en retard : boucle
      # de mise à jour à chaque lancement, même juste après avoir installé.
      - name: Compute app version from tag
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME#v}"
            IFS='.' read -r major minor patch <<< "$tag"
            # 10# force la base 10 : un patch comme "08"/"09" (courant dans
            # l'historique des tags, ex. v1.19.08) serait sinon lu comme un
            # littéral octal invalide et ferait échouer le build.
            code=$(( 10#$major * 100000 + 10#$minor * 1000 + 10#$patch ))
            echo "name=$tag" >> "$GITHUB_OUTPUT"
            echo "code=$code" >> "$GITHUB_OUTPUT"
          else
            echo "name=" >> "$GITHUB_OUTPUT"
            echo "code=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        working-directory: android-tv
        # Canal unique depuis le retrait de la variante retail : l'APK livré
        # embarque l'auto-update (BuildConfig.AUTO_UPDATE=true) — l'application
        # se met à jour elle-même via GitHub au lancement.
        run: |
          gradle assembleRelease --no-daemon \
            ${{ steps.ver.outputs.name != '' && format('-PmovvizVersionName={0} -PmovvizVersionCode={1}', steps.ver.outputs.name, steps.ver.outputs.code) || '' }}

      # Renommé explicitement "client" — contrairement à l'installeur Windows
      # (qui contient le serveur complet), cet APK est un client TV qui se
      # connecte à un serveur Movviz déjà existant. Éviter toute ambiguïté
      # dans la liste des assets d'une Release, à côté du .exe.
      - name: Rename APK as client build
        run: |
          cp android-tv/app/build/outputs/apk/release/app-release.apk android-tv/app/build/outputs/apk/release/Movviz-Android-TV-client.apk

      - name: Build NX retail APK
        working-directory: android-tv-nx
        run: |
          gradle assembleRelease --no-daemon \
            ${{ steps.ver.outputs.name != '' && format('-PmovvizVersionName={0} -PmovvizVersionCode={1}', steps.ver.outputs.name, steps.ver.outputs.code) || '' }}

      - name: Rename NX retail APK
        run: |
          cp android-tv-nx/app/build/outputs/apk/release/app-release.apk android-tv-nx/app/build/outputs/apk/release/Movviz-NX-Android-TV-client.apk

      # La Release est le canal réellement consommé par l'auto-update. Elle
      # doit être alimentée avant l'archive Actions : un incident temporaire
      # du stockage d'artefacts ne doit jamais empêcher la livraison TV.
      - name: Publish TV APKs to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              break
            fi
            gh release create "$TAG" --title "$TAG" --generate-notes >/dev/null 2>&1 || true
            sleep 3
          done
          gh release view "$TAG" >/dev/null
          gh release upload "$TAG" \
            android-tv/app/build/outputs/apk/release/Movviz-Android-TV-client.apk \
            android-tv-nx/app/build/outputs/apk/release/Movviz-NX-Android-TV-client.apk \
            --clobber

      - name: Upload APK artifact
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: Movviz-Android-TV-client
          path: android-tv/app/build/outputs/apk/release/Movviz-Android-TV-client.apk

      - name: Upload NX APK artifact
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: Movviz-NX-Android-TV-client
          path: android-tv-nx/app/build/outputs/apk/release/Movviz-NX-Android-TV-client.apk
