name: Build Android TV APK

on:
  push:
    branches: [main]
    paths: ["android-tv/**", ".github/workflows/android-tv-build.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["android-tv/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      # Le wrapper Gradle (gradlew/gradlew.bat + le jar) n'est pas versionné —
      # voir android-tv/README.md, il se génère normalement en ouvrant le
      # dossier dans Android Studio une première fois. Ici, on utilise
      # directement le binaire Gradle fourni par setup-gradle plutôt que
      # d'exiger ce wrapper, ce qui évite d'avoir à le committer.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.MOVVIZ_ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MOVVIZ_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.MOVVIZ_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.MOVVIZ_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          key_dir="$RUNNER_TEMP/movviz-signing"
          mkdir -p "$key_dir"
          keystore="$key_dir/movviz-tv-release.jks"
          store_password="${ANDROID_KEYSTORE_PASSWORD:-movviz-ci-release-only}"
          key_alias="${ANDROID_KEY_ALIAS:-movviz-release}"
          key_password="${ANDROID_KEY_PASSWORD:-$store_password}"
          if [ -n "${ANDROID_KEYSTORE_B64:-}" ]; then
            printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$keystore"
          else
            echo "::warning::Release keystore secrets are not configured; generating an ephemeral CI key. Configure MOVVIZ_ANDROID_KEYSTORE_* for upgrade-compatible releases."
            keytool -genkeypair -v -keystore "$keystore" -storetype PKCS12 -alias "$key_alias" -keyalg RSA -keysize 4096 -validity 10000 -storepass "$store_password" -keypass "$key_password" -dname "CN=Movviz, OU=Android TV, O=Movviz, C=BE"
          fi
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$keystore" "$store_password" "$key_alias" "$key_password" > android-tv/keystore.properties

      # Sans ceci, versionName/versionCode restaient figés à leur valeur par
      # défaut dans build.gradle.kts quel que soit le tag publié — l'app
      # comparait alors indéfiniment son ancienne version de repli au tag
      # GitHub le plus récent et se croyait éternellement en retard : boucle
      # de mise à jour à chaque lancement, même juste après avoir installé.
      - name: Compute app version from tag
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME#v}"
            IFS='.' read -r major minor patch <<< "$tag"
            # 10# force la base 10 : un patch comme "08"/"09" (courant dans
            # l'historique des tags, ex. v1.19.08) serait sinon lu comme un
            # littéral octal invalide et ferait échouer le build.
            code=$(( 10#$major * 10000 + 10#$minor * 100 + 10#$patch ))
            echo "name=$tag" >> "$GITHUB_OUTPUT"
            echo "code=$code" >> "$GITHUB_OUTPUT"
          else
            echo "name=" >> "$GITHUB_OUTPUT"
            echo "code=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        working-directory: android-tv
        # Canal unique depuis le retrait de la variante retail : l'APK livré
        # embarque l'auto-update (BuildConfig.AUTO_UPDATE=true) — l'application
        # se met à jour elle-même via GitHub au lancement.
        run: |
          gradle assembleRelease --no-daemon \
            ${{ steps.ver.outputs.name != '' && format('-PmovvizVersionName={0} -PmovvizVersionCode={1}', steps.ver.outputs.name, steps.ver.outputs.code) || '' }}

      # Renommé explicitement "client" — contrairement à l'installeur Windows
      # (qui contient le serveur complet), cet APK est un client TV qui se
      # connecte à un serveur Movviz déjà existant. Éviter toute ambiguïté
      # dans la liste des assets d'une Release, à côté du .exe.
      - name: Rename APK as client build
        run: |
          cp android-tv/app/build/outputs/apk/release/app-release.apk android-tv/app/build/outputs/apk/release/Movviz-Android-TV-client.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Movviz-Android-TV-client
          path: android-tv/app/build/outputs/apk/release/Movviz-Android-TV-client.apk

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android-tv/app/build/outputs/apk/release/Movviz-Android-TV-client.apk
          append_body: true
          body: |
            ---
            **Movviz-Android-TV-client.apk** — client Android TV unique (Kotlin/Compose), signé pour installation retail et intégrant l'auto-update. Il vérifie les releases GitHub au lancement, télécharge et installe la prochaine version compatible par-dessus l'existante, sans perte de données.
