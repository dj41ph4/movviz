name: Build Movviz NX smartphone APK

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["android-mobile-nx/**", "docs/android-mobile-audit.md", ".github/workflows/android-mobile-build.yml"]
  workflow_dispatch:

permissions:
  contents: write

# Chaque APK de version provient uniquement du tag de release : pas de second
# run de branche ambigu quand main et le tag sont poussés ensemble.
concurrency:
  group: android-mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Prepare shared retail signing key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.MOVVIZ_ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MOVVIZ_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.MOVVIZ_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.MOVVIZ_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          key_dir="$RUNNER_TEMP/movviz-signing"
          mkdir -p "$key_dir"
          keystore="$key_dir/movviz-retail.jks"
          : "${ANDROID_KEYSTORE_B64:?MOVVIZ_ANDROID_KEYSTORE_B64 est requis pour une release}"
          : "${ANDROID_KEYSTORE_PASSWORD:?MOVVIZ_ANDROID_KEYSTORE_PASSWORD est requis pour une release}"
          : "${ANDROID_KEY_ALIAS:?MOVVIZ_ANDROID_KEY_ALIAS est requis pour une release}"
          : "${ANDROID_KEY_PASSWORD:?MOVVIZ_ANDROID_KEY_PASSWORD est requis pour une release}"
          store_password="$ANDROID_KEYSTORE_PASSWORD"
          key_alias="$ANDROID_KEY_ALIAS"
          key_password="$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$keystore"
          expected_cert="4e8d66761eb1cdc228c96478617910ebf5e1bba01adb000aedfa50f8e1af90ec"
          actual_cert="$(keytool -list -v -keystore "$keystore" -storepass "$store_password" -alias "$key_alias" | awk '/SHA256:/{gsub(":", "", $2); print tolower($2); exit}')"
          test "$actual_cert" = "$expected_cert" || { echo "::error::La clé CI ne correspond pas à la clé retail Movviz"; exit 1; }
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$keystore" "$store_password" "$key_alias" "$key_password" > android-mobile-nx/keystore.properties

      # Même correctif que le workflow Android TV : dérive versionName/
      # versionCode du tag Git plutôt que la valeur par défaut figée dans
      # build.gradle.kts, pour que "À propos" affiche la vraie version publiée.
      - name: Compute app version from tag
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME#v}"
            IFS='.' read -r major minor patch <<< "$tag"
            # 10# force la base 10 : un patch comme "08"/"09" (courant dans
            # l'historique des tags, ex. v1.19.08) serait sinon lu comme un
            # littéral octal invalide et ferait échouer le build.
            code=$(( 10#$major * 100000 + 10#$minor * 1000 + 10#$patch ))
            echo "name=$tag" >> "$GITHUB_OUTPUT"
            echo "code=$code" >> "$GITHUB_OUTPUT"
          else
            echo "name=" >> "$GITHUB_OUTPUT"
            echo "code=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Movviz NX smartphone APK
        working-directory: android-mobile-nx
        run: |
          gradle assembleRelease --no-daemon \
            ${{ steps.ver.outputs.name != '' && format('-PmovvizVersionName={0} -PmovvizVersionCode={1}', steps.ver.outputs.name, steps.ver.outputs.code) || '' }}

      - name: Rename Movviz NX smartphone APK
        run: cp android-mobile-nx/app/build/outputs/apk/release/app-release.apk android-mobile-nx/app/build/outputs/apk/release/Movviz-NX-Mobile-client.apk

      - name: Publish Movviz NX smartphone APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              break
            fi
            gh release create "$TAG" --title "$TAG" --generate-notes >/dev/null 2>&1 || true
            sleep 3
          done
          gh release view "$TAG" >/dev/null
          gh release upload "$TAG" \
            android-mobile-nx/app/build/outputs/apk/release/Movviz-NX-Mobile-client.apk \
            --clobber

      - name: Upload Movviz NX smartphone APK artifact
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: Movviz-NX-Mobile-client
          path: android-mobile-nx/app/build/outputs/apk/release/Movviz-NX-Mobile-client.apk
