name: Build Android smartphone APK

on:
  push:
    branches: [main]
    paths: ["android-mobile/**", "docs/android-mobile-audit.md", ".github/workflows/android-mobile-build.yml", "android-tv/app/src/main/kotlin/com/movviz/tv/data/**"]
    tags: ["v*"]
  pull_request:
    paths: ["android-mobile/**", "docs/android-mobile-audit.md", ".github/workflows/android-mobile-build.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare shared retail signing key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.MOVVIZ_ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MOVVIZ_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.MOVVIZ_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.MOVVIZ_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          key_dir="$RUNNER_TEMP/movviz-signing"
          mkdir -p "$key_dir"
          keystore="$key_dir/movviz-retail.jks"
          : "${ANDROID_KEYSTORE_B64:?MOVVIZ_ANDROID_KEYSTORE_B64 est requis pour une release}"
          : "${ANDROID_KEYSTORE_PASSWORD:?MOVVIZ_ANDROID_KEYSTORE_PASSWORD est requis pour une release}"
          : "${ANDROID_KEY_ALIAS:?MOVVIZ_ANDROID_KEY_ALIAS est requis pour une release}"
          : "${ANDROID_KEY_PASSWORD:?MOVVIZ_ANDROID_KEY_PASSWORD est requis pour une release}"
          store_password="$ANDROID_KEYSTORE_PASSWORD"
          key_alias="$ANDROID_KEY_ALIAS"
          key_password="$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$keystore"
          expected_cert="4e8d66761eb1cdc228c96478617910ebf5e1bba01adb000aedfa50f8e1af90ec"
          actual_cert="$(keytool -list -v -keystore "$keystore" -storepass "$store_password" -alias "$key_alias" | awk '/SHA256:/{gsub(":", "", $3); print tolower($3); exit}')"
          test "$actual_cert" = "$expected_cert" || { echo "::error::La clé CI ne correspond pas à la clé retail Movviz"; exit 1; }
          # android-mobile réutilise volontairement le fichier de signature
          # Android TV (voir app/build.gradle.kts) pour garantir la même
          # clé retail sans dupliquer une configuration secrète.
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$keystore" "$store_password" "$key_alias" "$key_password" > android-tv/keystore.properties

      # Même correctif que le workflow Android TV : dérive versionName/
      # versionCode du tag Git plutôt que la valeur par défaut figée dans
      # build.gradle.kts, pour que "À propos" affiche la vraie version publiée.
      - name: Compute app version from tag
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME#v}"
            IFS='.' read -r major minor patch <<< "$tag"
            # 10# force la base 10 : un patch comme "08"/"09" (courant dans
            # l'historique des tags, ex. v1.19.08) serait sinon lu comme un
            # littéral octal invalide et ferait échouer le build.
            code=$(( 10#$major * 100000 + 10#$minor * 1000 + 10#$patch ))
            echo "name=$tag" >> "$GITHUB_OUTPUT"
            echo "code=$code" >> "$GITHUB_OUTPUT"
          else
            echo "name=" >> "$GITHUB_OUTPUT"
            echo "code=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build smartphone APK
        working-directory: android-mobile
        run: |
          gradle assembleRelease --no-daemon \
            ${{ steps.ver.outputs.name != '' && format('-PmovvizVersionName={0} -PmovvizVersionCode={1}', steps.ver.outputs.name, steps.ver.outputs.code) || '' }}

      - name: Rename smartphone APK
        run: cp android-mobile/app/build/outputs/apk/release/app-release.apk android-mobile/app/build/outputs/apk/release/Movviz-Android-Mobile-client.apk

      - name: Upload smartphone APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Movviz-Android-Mobile-client
          path: android-mobile/app/build/outputs/apk/release/Movviz-Android-Mobile-client.apk

      - name: Attach smartphone APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android-mobile/app/build/outputs/apk/release/Movviz-Android-Mobile-client.apk
          append_body: true
          body: |
            ---
            **Movviz-Android-Mobile-client.apk** — client Android smartphone natif Jetpack Compose, signé avec la même clé retail que le client TV.
