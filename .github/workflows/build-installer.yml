name: Build Windows Installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify SQLite runtime
        run: node -e "const s=require('node:sqlite'); if(typeof s.DatabaseSync!=='function') process.exit(1)"

      - name: Install Inno Setup 6
        run: |
          if (Get-Command "ISCC.exe" -ErrorAction SilentlyContinue) {
            Write-Host "Inno Setup déjà installé"
          } else {
            choco install innosetup --no-progress --allow-downgrade
          }
          echo "ISCC_DIR=C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Windows updater
        shell: powershell
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts\windows-update-worker.test.ps1
          if ($LASTEXITCODE -ne 0) { throw "Updater worker tests failed" }
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts\windows-update-e2e-helpers.test.ps1
          if ($LASTEXITCODE -ne 0) { throw "Updater E2E helper tests failed" }
          node --experimental-transform-types --no-warnings --import ./scripts/movviz-test-loader.mjs --test scripts/windows-update-service.test.ts
          if ($LASTEXITCODE -ne 0) { throw "Updater API tests failed" }
          & scripts\windows-installer-smoke.ps1 -Compiler "$env:ISCC_DIR\ISCC.exe"

      - name: Install engine dependencies
        run: npm ci --no-audit --no-fund
        working-directory: engine

      - name: Verify WebTorrent queue and transfers
        run: node --test scripts/engine-client-restart.test.mjs scripts/engine-seed.test.mjs scripts/engine-pause.test.mjs scripts/engine-stall.test.mjs scripts/engine-episode-placement.test.mjs scripts/engine-replacement-retry.test.mjs

      - name: Install resolver dependencies
        run: npm ci --no-audit --no-fund
        working-directory: resolver

      - name: Build resolver TypeScript
        run: npm run build
        working-directory: resolver

      - name: Build installer
        run: packaging\windows\installer\build.ps1
        shell: powershell

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Movviz-Setup
          path: dist\Movviz-Setup-*.exe

      - name: Extract release notes
        run: node scripts/extract-changelog.mjs

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist\Movviz-Setup-*.exe
          body_path: dist/release-notes.md

      - name: Verify real update with independent Windows services
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        timeout-minutes: 20
        shell: powershell
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          & scripts\windows-update-e2e.ps1 -Installer (Resolve-Path "dist\Movviz-Setup-$version.exe") -Version $version

      - name: Collect Windows update diagnostics
        if: always()
        shell: powershell
        run: |
          . scripts\windows-update-e2e-helpers.ps1
          Save-MovvizUpdateDiagnostics -Destination (Join-Path $env:RUNNER_TEMP 'movviz-update-diagnostics')
          Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'movviz-update-diagnostics') -Recurse -File |
            Where-Object { $_.Name -match '\.(err|wrapper)\.log$' } |
            ForEach-Object { Write-Host "Diagnostics: $($_.FullName)"; Get-Content -LiteralPath $_.FullName -Tail 60 }

      - name: Upload Windows update diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-update-diagnostics
          if-no-files-found: ignore
          path: ${{ runner.temp }}\movviz-update-diagnostics
