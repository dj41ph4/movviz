name: v1.22.61 virtual HD YouTube cards
on:
  push:
    branches: [v12261-virtual-hd-staging]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Patch virtual HD card iframe and bump version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/components/media/YouTubeCardBridgePlayer.tsx')
          s = p.read_text()

          old = 'const ADVANCE_SEC = 0.03;\n'
          new = '''const ADVANCE_SEC = 0.03;\n// Card-only experiment: keep YouTube's *layout viewport* genuinely large so\n// the embed chooses its desktop player layout while CSS scales that viewport\n// down into the small Movviz popover. A transform does not change the iframe\n// document's innerWidth/innerHeight, so YouTube still sees 1920x1080.\nconst VIRTUAL_PLAYER_WIDTH = 1920;\nconst VIRTUAL_PLAYER_HEIGHT = 1080;\nconst CARD_CROP_ZOOM = 1.36;\nconst VIRTUAL_LAYOUT_TIMEOUT_MS = 1500;\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''  const iframeRef = useRef<HTMLIFrameElement>(null);\n  const commandRef = useRef<((func: string, args?: unknown[]) => boolean) | null>(null);\n  const [useFallback, setUseFallback] = useState(false);\n\n  useEffect(() => {\n'''
          new = '''  const containerRef = useRef<HTMLDivElement>(null);\n  const iframeRef = useRef<HTMLIFrameElement>(null);\n  const commandRef = useRef<((func: string, args?: unknown[]) => boolean) | null>(null);\n  const [useFallback, setUseFallback] = useState(false);\n  const [virtualScale, setVirtualScale] = useState<number | null>(null);\n\n  useEffect(() => {\n    if (useFallback) return;\n    const container = containerRef.current;\n    if (!container) return;\n    if (typeof ResizeObserver === "undefined") {\n      console.debug(`[Movviz][YouTubeBridge] ${trailerKey}: fallback (ResizeObserver unavailable)`);\n      setUseFallback(true);\n      return;\n    }\n\n    let cancelled = false;\n    let hadValidLayout = false;\n    const updateVirtualScale = () => {\n      const width = container.clientWidth;\n      const height = container.clientHeight;\n      if (!(width > 0) || !(height > 0)) return;\n      const coverScale = Math.max(width / VIRTUAL_PLAYER_WIDTH, height / VIRTUAL_PLAYER_HEIGHT);\n      const nextScale = coverScale * CARD_CROP_ZOOM;\n      if (!Number.isFinite(nextScale) || nextScale <= 0) return;\n      if (!hadValidLayout) {\n        console.debug(\n          `[Movviz][YouTubeBridge] ${trailerKey}: virtual ${VIRTUAL_PLAYER_WIDTH}x${VIRTUAL_PLAYER_HEIGHT} -> ${Math.round(width)}x${Math.round(height)}; scale=${nextScale.toFixed(4)}`,\n        );\n      }\n      hadValidLayout = true;\n      setVirtualScale((previous) =>\n        previous != null && Math.abs(previous - nextScale) < 0.0005 ? previous : nextScale,\n      );\n    };\n\n    updateVirtualScale();\n    const observer = new ResizeObserver(updateVirtualScale);\n    observer.observe(container);\n    const layoutTimeout = setTimeout(() => {\n      if (!cancelled && !hadValidLayout) {\n        console.debug(`[Movviz][YouTubeBridge] ${trailerKey}: fallback (invalid virtual layout)`);\n        setUseFallback(true);\n      }\n    }, VIRTUAL_LAYOUT_TIMEOUT_MS);\n\n    return () => {\n      cancelled = true;\n      clearTimeout(layoutTimeout);\n      observer.disconnect();\n    };\n  }, [trailerKey, useFallback]);\n\n  useEffect(() => {\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''  return (\n    <iframe\n      ref={iframeRef}\n      title={title}\n      allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; web-share"\n      referrerPolicy="strict-origin-when-cross-origin"\n      className="pointer-events-none absolute left-1/2 top-1/2 h-[56.25cqw] w-[100cqw] min-h-full min-w-[177.78cqh] -translate-x-1/2 -translate-y-1/2 scale-[1.36]"\n    />\n  );\n}\n'''
          new = '''  return (\n    <div\n      ref={containerRef}\n      className="pointer-events-none absolute inset-0 overflow-hidden"\n      style={{ contain: "paint" }}\n    >\n      <iframe\n        ref={iframeRef}\n        title={title}\n        width={VIRTUAL_PLAYER_WIDTH}\n        height={VIRTUAL_PLAYER_HEIGHT}\n        allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; web-share"\n        referrerPolicy="strict-origin-when-cross-origin"\n        className="pointer-events-none absolute left-1/2 top-1/2 max-w-none border-0"\n        style={{\n          width: `${VIRTUAL_PLAYER_WIDTH}px`,\n          height: `${VIRTUAL_PLAYER_HEIGHT}px`,\n          transform: `translate(-50%, -50%) scale(${virtualScale ?? 1})`,\n          transformOrigin: "center center",\n        }}\n      />\n    </div>\n  );\n}\n'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)

          for fn in ['package.json', 'package-lock.json']:
              p = Path(fn)
              s = p.read_text()
              assert '1.22.60' in s
              p.write_text(s.replace('1.22.60', '1.22.61'))

          for fn in ['android-tv/app/build.gradle.kts', 'android-mobile/app/build.gradle.kts']:
              p = Path(fn)
              s = p.read_text()
              assert '12260' in s and '1.22.60' in s
              p.write_text(s.replace('12260', '12261').replace('1.22.60', '1.22.61'))

          p = Path('README.md')
          s = p.read_text()
          assert 'Movviz-1.22.60' in s
          p.write_text(s.replace('Movviz-1.22.60', 'Movviz-1.22.61', 1))

          p = Path('CHANGELOG.md')
          s = p.read_text()
          assert s.startswith('# Changelog\n')
          entry = '''# Changelog\n\n## v1.22.61 — August 2026\n\n### Cartes — iframe YouTube virtuelle 1080p\n\nLes petites previews YouTube utilisent désormais un iframe brut dont le viewport logique reste réellement à `1920×1080`, puis un wrapper Movviz calcule via `ResizeObserver` un `transform: scale(...)` pour le réduire à la taille de la carte. Le scale applique `cover × 1.36`, ce qui conserve exactement le zoom/cadrage de la v1.22.60 tout en laissant YouTube croire qu'il dispose d'un grand lecteur desktop. L'objectif est double : éviter le layout compact du player et maximiser les chances que l'ABR YouTube sélectionne une qualité élevée ; la qualité 1080p reste toutefois décidée par YouTube et n'est pas officiellement forçable. Le bridge `postMessage`, `apiInterface`, `hideVideoInfo` si exposé, la boucle avant `ENDED`, le poster rideau et le fallback `YT.Player` restent inchangés. Si le viewport de carte ne peut pas être mesuré proprement, Movviz retombe automatiquement sur le rendu stable v1.22.60. Hero, fiches, modal et Android ne changent pas.\n\n'''
          p.write_text(entry + s[len('# Changelog\n\n'):])
          PY
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Portable tests
        shell: bash
        run: |
          FILES=$(find scripts -maxdepth 1 -name '*.test.ts' ! -name 'server-capabilities.test.ts' -print | tr '\n' ' ')
          node --experimental-transform-types --no-warnings --import ./scripts/movviz-test-loader.mjs --test $FILES
      - name: Production build
        run: npm run build
      - name: Commit and tag v1.22.61
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/media/YouTubeCardBridgePlayer.tsx package.json package-lock.json android-tv/app/build.gradle.kts android-mobile/app/build.gradle.kts README.md CHANGELOG.md
          git commit -m 'v1.22.61 — virtual 1080p YouTube card iframe'
          git tag -a v1.22.61 -m 'v1.22.61 — virtual 1080p YouTube card iframe'
          git push origin HEAD:v12261-virtual-hd-staging
          git push origin v1.22.61
