name: Build README hero

on:
  push:
    paths:
      - 'assets/screenshots/.hero-build/part4.b64'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild compact README hero
        shell: bash
        run: |
          cat assets/screenshots/.hero-build/part1.b64 \
              assets/screenshots/.hero-build/part2.b64 \
              assets/screenshots/.hero-build/part3.b64 \
              assets/screenshots/.hero-build/part4.b64 \
            | base64 --decode > assets/screenshots/readme-hero-promo.webp

          test "$(stat -c%s assets/screenshots/readme-hero-promo.webp)" -gt 20000
          test "$(stat -c%s assets/screenshots/readme-hero-promo.webp)" -lt 50000

          sed -i 's#assets/screenshots/readme-hero-promo\.svg#assets/screenshots/readme-hero-promo.webp#g' README.md

          rm -rf assets/screenshots/.hero-build
          rm -f assets/screenshots/readme-hero-promo.svg
          rm -f assets/screenshots/readme-hero-promo-part*.svg

      - name: Commit generated hero
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(readme): finalize compact MOVVIZ hero"
          git push
