name: Finalize Movviz v1.25.17 avatar release

on:
  push:
    branches: [main]
    paths: [".github/workflows/release-v1.25.17-once.yml"]

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate avatar changes
        run: |
          set -euo pipefail
          npm ci
          mapfile -t TEST_FILES < <(find scripts -maxdepth 1 -name '*.test.ts' ! -name 'server-capabilities.test.ts' -print | sort)
          test "${#TEST_FILES[@]}" -gt 0
          node --experimental-transform-types --no-warnings --import ./scripts/movviz-test-loader.mjs --test "${TEST_FILES[@]}"
          npm run typecheck

      - name: Finalize v1.25.17 metadata
        run: |
          set -euo pipefail
          npm version 1.25.17 --no-git-tag-version
          python3 <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          text = text.replace("version-1.25.16-a855f7", "version-1.25.17-a855f7", 1)
          text = text.replace("Version 1.25.16", "Version 1.25.17", 1)
          readme.write_text(text, encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          if "## v1.25.17" not in text:
              section = (
                  "## v1.25.17 — September 2026\n\n"
                  "### Profils : avatar Movviz canonique sur desktop, mobile NX et TV NX\n\n"
                  "- L'avatar personnalisé Movviz reste la source de vérité : un rafraîchissement de la photo Plex met seulement à jour le fallback et ne peut plus effacer `customAvatar`.\n"
                  "- Les fichiers d'avatar Movviz encore présents sur disque sont récupérés automatiquement si une ancienne logique les avait désactivés.\n"
                  "- Android TV NX et Android Mobile NX normalisent les URLs `/api/avatars/...` par rapport au serveur Movviz afin que picker, sidebar, badges et fiche profil affichent tous la même photo.\n"
                  "- L'upload Movviz tente aussi une réplication vers Plex via l'endpoint privé utilisé par Plex Web ; cette synchro est strictement best-effort et un refus côté Plex n'empêche jamais l'avatar Movviz local de fonctionner.\n\n"
              )
              marker = "# Changelog\n\n"
              if marker not in text:
                  raise SystemExit("CHANGELOG header not found")
              changelog.write_text(text.replace(marker, marker + section, 1), encoding="utf-8")
          PY

          git config user.name "dj41ph4"
          git config user.email "dj41ph4@gmail.com"
          git rm .github/workflows/release-v1.25.17-once.yml
          git add package.json package-lock.json README.md CHANGELOG.md
          git commit -m "release: v1.25.17 — avatar Movviz canonique desktop/mobile/TV"
          git push origin HEAD:main

      - name: Create v1.25.17 tag
        run: |
          set -euo pipefail
          git fetch origin --tags
          if git show-ref --verify --quiet refs/tags/v1.25.17; then
            echo "v1.25.17 already exists"
            exit 1
          fi
          git tag v1.25.17 HEAD
          git push origin v1.25.17

      - name: Dispatch release builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run android-tv-build.yml --ref v1.25.17
          gh workflow run android-mobile-build.yml --ref v1.25.17
          gh workflow run linux-release-build.yml --ref v1.25.17
          gh workflow run build-installer.yml --ref v1.25.17
          gh workflow run docker-publish.yml --ref main
