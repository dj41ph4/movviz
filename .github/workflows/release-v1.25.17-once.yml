name: Finalize Movviz v1.25.17 avatar release

on:
  push:
    branches: [main]
    paths: [".github/workflows/release-v1.25.17-once.yml"]

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate server avatar policy
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run typecheck

      - name: Finalize release metadata
        shell: bash
        run: |
          set -euo pipefail
          npm version 1.25.17 --no-git-tag-version

          python3 <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          s = readme.read_text(encoding="utf-8")
          s = s.replace("version-1.25.16-a855f7", "version-1.25.17-a855f7", 1)
          s = s.replace("Version 1.25.16", "Version 1.25.17", 1)
          readme.write_text(s, encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          s = changelog.read_text(encoding="utf-8")
          if "## v1.25.17" not in s:
              section = """## v1.25.17 — September 2026

### Profils : avatar Movviz canonique sur desktop, mobile NX et TV NX

- L'avatar personnalisé Movviz est désormais la source de vérité : un rafraîchissement de la photo Plex met seulement à jour le fallback et ne peut plus effacer `customAvatar`.
- Récupération automatique des fichiers d'avatar Movviz encore présents sur disque mais désactivés par l'ancienne logique « dernier changement gagnant » ; aucun nouvel upload n'est nécessaire si le fichier existe toujours.
- Android TV NX et Android Mobile NX normalisent les URLs `/api/avatars/...` par rapport au serveur Movviz afin que picker, sidebar, badges et fiche profil affichent tous la même photo.
- La réplication Movviz → Plex reste best-effort via l'endpoint privé utilisé par Plex Web : un refus ou changement côté Plex n'empêche jamais l'avatar Movviz de fonctionner.

"""
              marker = "# Changelog\n\n"
              if marker not in s:
                  raise SystemExit("CHANGELOG header not found")
              changelog.write_text(s.replace(marker, marker + section, 1), encoding="utf-8")
          PY

          git rm .github/workflows/release-v1.25.17-once.yml
          git config user.name "dj41ph4"
          git config user.email "dj41ph4@gmail.com"
          git add package.json package-lock.json README.md CHANGELOG.md .github/workflows/release-v1.25.17-once.yml
          git commit -m "release: v1.25.17 — avatar Movviz canonique desktop/mobile/TV"
          git push origin HEAD:main

      - name: Create v1.25.17 tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --tags
          if git show-ref --verify --quiet refs/tags/v1.25.17; then
            echo "v1.25.17 already exists"
            exit 1
          fi
          git tag v1.25.17 HEAD
          git push origin v1.25.17

      - name: Dispatch release builds
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run android-tv-build.yml --ref v1.25.17
          gh workflow run android-mobile-build.yml --ref v1.25.17
          gh workflow run linux-release-build.yml --ref v1.25.17
          gh workflow run build-installer.yml --ref v1.25.17
          gh workflow run docker-publish.yml --ref main
