name: Mobile profile parity

on:
  push:
    branches: [main]
    paths:
      - "scripts/_apply_mobile_profile_parity.py"
      - ".github/workflows/_mobile_profile_parity.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply profile parity
        run: python scripts/_apply_mobile_profile_parity.py
      - name: Commit changes
        run: |
          git config user.name "dj41ph4"
          git config user.email "dj41ph4@gmail.com"
          git add -A
          git commit -m "v1.24.39 - mobile hero synced with desktop profile" || exit 0
          git push origin main
