name: Release v1.25.19 once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-v1.25.19-once.yml

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build NX TV release
        working-directory: android-tv-nx
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Bump version and changelog
        shell: python
        run: |
          from pathlib import Path

          p = Path('package.json')
          s = p.read_text(encoding='utf-8')
          s = s.replace('"version": "1.25.18"', '"version": "1.25.19"', 1)
          p.write_text(s, encoding='utf-8')

          lock = Path('package-lock.json')
          s = lock.read_text(encoding='utf-8')
          s = s.replace('"version": "1.25.18"', '"version": "1.25.19"', 2)
          lock.write_text(s, encoding='utf-8')

          readme = Path('README.md')
          s = readme.read_text(encoding='utf-8').replace('1.25.18', '1.25.19')
          readme.write_text(s, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          current = changelog.read_text(encoding='utf-8')
          entry = "\n".join([
              "## v1.25.19 — September 2026",
              "",
              "### Android TV NX : avatar rafraîchi à chaque démarrage",
              "",
              "- Aucun changement visuel par rapport à v1.25.18.",
              "- Les seules images dont le cache est forcé sont les photos de profil.",
              "- Un identifiant de session est ajouté à l'URL de l'avatar à chaque nouveau démarrage du process TV : Coil recharge donc réellement la photo au lieu de réutiliser une ancienne image en cache.",
              "- L'URL reste stable pendant toute la session afin d'éviter des téléchargements répétés lors des recompositions.",
              "- Le cache-buster éphémère n'est jamais persisté dans les préférences locales.",
              "",
              "",
          ])
          if not current.startswith('## v1.25.19'):
              changelog.write_text(entry + current, encoding='utf-8')

      - name: Commit release
        run: |
          git config user.name "dj41ph4"
          git config user.email "dj41ph4@gmail.com"
          git rm .github/workflows/release-v1.25.19-once.yml
          git add package.json package-lock.json README.md CHANGELOG.md
          git commit -m "release: v1.25.19 — refresh avatar cache on TV startup"
          git push origin HEAD:main

      - name: Tag v1.25.19
        run: |
          git tag v1.25.19
          git push origin v1.25.19

      - name: Dispatch release builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run android-tv-build.yml --ref v1.25.19
          gh workflow run android-mobile-build.yml --ref v1.25.19
          gh workflow run linux-release-build.yml --ref v1.25.19
          gh workflow run build-installer.yml --ref v1.25.19
          gh workflow run docker-publish.yml --ref main
