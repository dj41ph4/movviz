name: Tag v1.24.40

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tag_v1.24.40.yml'

permissions:
  contents: write
  actions: write

jobs:
  tag-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create v1.24.40 tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin refs/tags/v1.24.40 >/dev/null 2>&1; then
            echo "v1.24.40 already exists"
          else
            git tag -a v1.24.40 -m "v1.24.40"
            git push origin refs/tags/v1.24.40
          fi

      - name: Dispatch release builds explicitly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for wf in android-mobile-build.yml android-tv-build.yml linux-release-build.yml build-installer.yml; do
            if gh workflow view "$wf" >/dev/null 2>&1; then
              gh workflow run "$wf" --ref v1.24.40 || true
            fi
          done
