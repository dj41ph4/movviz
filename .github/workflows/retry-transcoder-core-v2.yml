name: Retry transcoder core v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retry-transcoder-core-v2.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply core migration
        run: |
          python scripts/apply-transcoder-core-v2.py
          python scripts/fix-transcoder-core-v2-test.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Playback policy tests
        run: node --experimental-transform-types --no-warnings --import ./scripts/movviz-test-loader.mjs --test scripts/decide-playback.test.ts scripts/webcodecs-policy.test.ts
      - name: Portable tests
        shell: bash
        run: |
          set -euo pipefail
          FILES=$(find scripts -maxdepth 1 -name '*.test.ts' ! -name 'server-capabilities.test.ts' -print | tr '\n' ' ')
          node --experimental-transform-types --no-warnings --import ./scripts/movviz-test-loader.mjs --test $FILES
      - name: Production build
        run: npm run build
      - name: Verify core invariants
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'mode: "PLEX_FALLBACK"' src/lib/playback/engine/decidePlayback.ts
          grep -q 'toneMapRealtimeFactor.*>= 3' src/lib/playback/engine/decidePlayback.ts
          grep -q 'selected French AAC track is the only audio truth' scripts/decide-playback.test.ts
          grep -q 'MOVVIZ_FFMPEG_PATH' packaging/windows/installer/movviz-service.xml
          grep -q 'ffprobe.exe' packaging/windows/installer/build.ps1
      - name: Commit validated core and remove migration helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f scripts/apply-transcoder-core-v2.py scripts/fix-transcoder-core-v2-test.py .github/workflows/apply-transcoder-core-v2.yml .github/workflows/retry-transcoder-core-v2.yml
          git add -A
          git commit -m 'refactor(playback): unify transcoder core invariants'
          git push origin HEAD:main
