name: Apply Android TV synchronized home redesign

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v12406-tv-home.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Make migration consume literal Kotlin body
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/v12406-tv-home.mjs')
          s = p.read_text()
          start = s.index('  const fn = String.raw`')
          end_marker = '`;\n  s = before + fn + after;'
          end = s.index(end_marker, start)
          s = s[:start] + '  const fn = read("scripts/v12406-home-body.txt");\n  s = before + fn + after;' + s[end + len(end_marker):]
          p.write_text(s)
          PY
      - name: Apply migration
        run: node scripts/v12406-tv-home.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Validate Android TV compile
        working-directory: android-tv
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Remove one-shot migration scaffolding
        run: git rm scripts/v12406-tv-home.mjs scripts/v12406-home-body.txt .github/workflows/v12406-tv-home.yml
      - name: Commit synchronized home
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-tv
          git diff --cached --check
          git commit -m "feat(tv): synchronize home experience with desktop"
          git push origin HEAD:main
