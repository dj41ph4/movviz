name: v1.22.54 card iframe experiment

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-test-release:
    if: github.event.head_commit.message == 'chore: stage v1.22.54 card iframe experiment'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard expected base
        shell: bash
        run: |
          set -euo pipefail
          PARENT="$(git rev-parse HEAD^)"
          test "$PARENT" = "713f8053e7f9bde363b4d20c19b13598da51a1f1"

      - name: Patch card-only YouTube treatment
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          trailer = "src/components/media/TrailerHeader.tsx"
          card = "src/components/dashboard/DashboardPosterCard.tsx"

          replace_once(
              trailer,
              "  extraZoom?: boolean;\n  className?: string;",
              "  extraZoom?: boolean;\n  /** Compact hover-card treatment only: keeps hero/title rendering untouched while cropping/masking YouTube's small-player title chrome. */\n  cardPreview?: boolean;\n  className?: string;",
          )

          replace_once(
              trailer,
              'function YouTubePlayer({ trailerKey, title, muted, onPlayingChange, onError, extraZoom }: { trailerKey: string; title: string; muted: boolean; onPlayingChange: (playing: boolean) => void; onError: () => void; extraZoom?: boolean }) {',
              'function YouTubePlayer({ trailerKey, title, muted, onPlayingChange, onError, extraZoom, cardPreview = false }: { trailerKey: string; title: string; muted: boolean; onPlayingChange: (playing: boolean) => void; onError: () => void; extraZoom?: boolean; cardPreview?: boolean }) {',
          )

          replace_once(
              trailer,
              '''      className={cn(\n        "pointer-events-none absolute left-1/2 top-1/2 h-[56.25cqw] w-[100cqw] min-h-full min-w-[177.78cqh] -translate-x-1/2 -translate-y-1/2",\n        extraZoom ? "scale-[1.15]" : "scale-110"\n      )}''',
              '''      className={cn(\n        "pointer-events-none absolute left-1/2 h-[56.25cqw] w-[100cqw] min-h-full min-w-[177.78cqh] -translate-x-1/2 -translate-y-1/2",\n        cardPreview ? "top-[46%] scale-[1.18]" : "top-1/2",\n        !cardPreview && (extraZoom ? "scale-[1.15]" : "scale-110")\n      )}''',
          )

          replace_once(
              trailer,
              'export function TrailerHeader({ backdropPath, size, trailerKeys, enhancedSources, title, trigger, enabled = true, muted: initialMuted = true, hideSoundToggle = false, hideTopGradient = false, extraZoom = false, className }: TrailerHeaderProps) {',
              'export function TrailerHeader({ backdropPath, size, trailerKeys, enhancedSources, title, trigger, enabled = true, muted: initialMuted = true, hideSoundToggle = false, hideTopGradient = false, extraZoom = false, cardPreview = false, className }: TrailerHeaderProps) {',
          )

          replace_once(
              trailer,
              '<YouTubePlayer key={candidateKey} trailerKey={candidate.key} title={title} muted={muted} onPlayingChange={setVideoPlaying} onError={onVideoError} extraZoom={extraZoom} />',
              '<YouTubePlayer key={candidateKey} trailerKey={candidate.key} title={title} muted={muted} onPlayingChange={setVideoPlaying} onError={onVideoError} extraZoom={extraZoom} cardPreview={cardPreview} />',
          )

          replace_once(
              trailer,
              '''          {!hideTopGradient && (\n            /* Masque la barre titre/channel YouTube dans les lecteurs qui le\n             * demandent ; les cartes gardent ainsi leur image sans voile noir. */\n            <div className="pointer-events-none absolute inset-x-0 top-0 z-10 h-20 bg-gradient-to-b from-black/80 via-black/35 to-transparent" />\n          )}''',
              '''          {(!hideTopGradient || cardPreview) && (\n            /* The normal hero/title mask stays byte-for-byte equivalent. Cards\n             * opt into a proportional, lighter mask because YouTube switches to\n             * a compact title layout at small iframe sizes. */\n            <div\n              className={cn(\n                "pointer-events-none absolute inset-x-0 top-0 z-10 bg-gradient-to-b to-transparent",\n                cardPreview ? "h-[28%] from-black/70 via-black/25" : "h-20 from-black/80 via-black/35"\n              )}\n            />\n          )}''',
          )

          replace_once(
              card,
              '''                hideTopGradient\n                className="h-full w-full"''',
              '''                hideTopGradient\n                cardPreview\n                className="h-full w-full"''',
          )

          # Version metadata
          import subprocess
          subprocess.run(["npm", "version", "1.22.54", "--no-git-tag-version"], check=True)

          for path in ["android-tv/app/build.gradle.kts", "android-mobile/app/build.gradle.kts"]:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if '12253' not in text or '"1.22.53"' not in text:
                  raise SystemExit(f"{path}: expected v1.22.53 fallback metadata")
              text = text.replace('12253', '12254').replace('"1.22.53"', '"1.22.54"')
              p.write_text(text, encoding="utf-8")

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          old = "Movviz-1.22.53-7c3aed"
          if old not in text:
              raise SystemExit("README badge v1.22.53 not found")
          readme.write_text(text.replace(old, "Movviz-1.22.54-7c3aed", 1), encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          marker = "# Changelog\n\n"
          if not text.startswith(marker):
              raise SystemExit("CHANGELOG header not found")
          entry = '''## v1.22.54 — August 2026\n\n### Cartes — iframe YouTube compact sans titre\n\nEssai ciblé sur les previews des cartes uniquement : le hero et les vidéos de fiche restent inchangés. Les petites cartes conservent l'IFrame API YouTube et le trafic direct YouTube → utilisateur, mais utilisent un crop légèrement renforcé (`scale 1.18`, centre remonté à 46 %) et un masque supérieur proportionnel de 28 % pour cacher le chrome titre/channel du layout compact. `YOUTUBE_CHROME_SETTLE_MS=1500`, `LOOP_BEFORE_END_SEC=0.75`, la sélection des trailers et les fallbacks YouTube restent inchangés. Aucun Piped/Invidious/yt-dlp n'est ajouté.\n\n'''
          changelog.write_text(marker + entry + text[len(marker):], encoding="utf-8")

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Lint (report only)
        continue-on-error: true
        run: npm run lint

      - name: Commit, self-clean and tag v1.22.54
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v12254-card-iframe-experiment.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "v1.22.54 — card YouTube iframe compact chrome"
          git push origin HEAD:main
          git tag -a v1.22.54 -m "v1.22.54 — card YouTube iframe compact chrome"
          git push origin v1.22.54
