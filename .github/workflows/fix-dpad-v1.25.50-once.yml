name: One-shot D-pad repair v1.25.50

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-dpad-v1.25.50-once.yml

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Repair native Compose focus graph
        run: python3 scripts/fix_dpad_v12550.py

      - name: Compile Android TV after focus repair
        working-directory: android-tv-nx
        run: gradle :app:assembleDebug --no-daemon

      - name: Commit, tag and dispatch release builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-dpad-v1.25.50-once.yml scripts/fix_dpad_v12550.py
          git add android-tv-nx package.json package-lock.json README.md CHANGELOG.md
          git commit -m "release: v1.25.50 — D-pad natif après refonte sidebar"
          git push origin HEAD:main
          git tag v1.25.50
          git push origin v1.25.50
          gh workflow run android-tv-build.yml --ref v1.25.50
          gh workflow run android-mobile-build.yml --ref v1.25.50
          gh workflow run linux-release-build.yml --ref v1.25.50
          gh workflow run build-installer.yml --ref v1.25.50
          gh workflow run docker-publish.yml --ref main
