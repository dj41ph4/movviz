name: One-shot D-pad repair v1.25.50

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-dpad-v1.25.50-once.yml

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Repair native Compose focus graph
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          main_activity = root / 'android-tv-nx/app/src/main/kotlin/com/movviz/tv/MainActivity.kt'
          main_screen = root / 'android-tv-nx/app/src/main/kotlin/com/movviz/tv/ui/home/MainScreen.kt'
          home_screen = root / 'android-tv-nx/app/src/main/kotlin/com/movviz/tv/ui/home/HomeScreen.kt'
          nav_rail = root / 'android-tv-nx/app/src/main/kotlin/com/movviz/tv/ui/home/NavRail.kt'

          def must_replace(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f'Expected block not found: {label}')
              return text.replace(old, new, 1)

          # 1) MainScreen: the sidebar is LEFT now. Remove the old global UP
          # interception inherited from the top navigation and let Compose
          # handle vertical traversal. The screen group only redirects a real
          # LEFT exit to the selected sidebar item.
          s = main_screen.read_text()
          for imp in [
              'import androidx.compose.ui.input.key.Key\n',
              'import androidx.compose.ui.input.key.KeyEventType\n',
              'import androidx.compose.ui.input.key.key\n',
              'import androidx.compose.ui.input.key.onKeyEvent\n',
              'import androidx.compose.ui.input.key.type\n',
              'import androidx.compose.ui.platform.LocalFocusManager\n',
          ]:
              s = s.replace(imp, '')
          if 'import androidx.compose.foundation.focusGroup\n' not in s:
              s = s.replace('import androidx.compose.foundation.layout.padding\n', 'import androidx.compose.foundation.layout.padding\nimport androidx.compose.foundation.focusGroup\n')
          if 'import androidx.compose.ui.focus.focusProperties\n' not in s:
              s = s.replace('import androidx.compose.ui.focus.FocusRequester\n', 'import androidx.compose.ui.focus.FocusRequester\nimport androidx.compose.ui.focus.focusProperties\n')
          old = '''    val focusManager = LocalFocusManager.current
    Box(
        // L'accueil possède sa propre arborescence TV : son TvLazyColumn doit
        // recevoir UP directement pour remonter de rangée en rangée. Les
        // écrans historiques conservent leur repli global vers la NavRail,
        // afin que cette correction ne change pas leurs parcours existants.
        modifier = Modifier.fillMaxSize().onKeyEvent { event ->
            if (tab == HomeTab.HOME && !searchOpen) return@onKeyEvent false
            if (event.type != KeyEventType.KeyDown || event.key != Key.DirectionUp) return@onKeyEvent false
            if (focusManager.moveFocus(FocusDirection.Up)) true
            else navRailFocusRequester?.let { runCatching { it.requestFocus() }.isSuccess } == true
        },
'''
          new = '''    Box(
        // La navigation est désormais une sidebar à GAUCHE. Le déplacement
        // vertical reste entièrement natif (TvLazyColumn/TvLazyRow). On ne
        // redirige que la vraie sortie LEFT du groupe vers l'onglet actif,
        // via focusProperties, sans intercepter les touches.
        modifier = Modifier.fillMaxSize()
            .focusProperties {
                exit = { focusDirection ->
                    if (focusDirection == FocusDirection.Left) {
                        navRailFocusRequester ?: FocusRequester.Default
                    } else {
                        FocusRequester.Default
                    }
                }
            }
            .focusGroup(),
'''
          s = must_replace(s, old, new, 'MainScreen global UP handler')
          s = s.replace('// Cible HAUT depuis le contenu → NavRail : onglet sélectionné de la\n', '// Cible GAUCHE depuis le contenu → NavRail : onglet sélectionné de la\n')
          main_screen.write_text(s)

          # 2) HomeScreen already has the correct LEFT focusProperties before
          # focusGroup. Remove only the competing manual UP engine and the
          # invisible anchor's old top-nav UP shortcut.
          s = home_screen.read_text()
          old = '''    val focusManager = androidx.compose.ui.platform.LocalFocusManager.current
    Box(
        modifier = Modifier.fillMaxSize().background(MaterialTheme.colorScheme.background)
            .focusProperties {
                exit = { focusDirection ->
                    if (focusDirection == androidx.compose.ui.focus.FocusDirection.Left) navRailFocusRequester ?: androidx.compose.ui.focus.FocusRequester.Default else androidx.compose.ui.focus.FocusRequester.Default
                }
            }
            .focusGroup()
            .onPreviewKeyEvent { event ->
                if (event.type != KeyEventType.KeyDown || event.key != Key.DirectionUp) return@onPreviewKeyEvent false
                // UP depuis le contenu : tenter d'abord un déplacement naturel
                // (rangée → rangée, carte → hero). S'il échoue (déjà tout en
                // haut), aller sur l'onglet sélectionné de la NavRail.
                if (focusManager.moveFocus(androidx.compose.ui.focus.FocusDirection.Up)) true
                else navRailFocusRequester?.let { runCatching { it.requestFocus() }.isSuccess } == true
            },
'''
          new = '''    Box(
        modifier = Modifier.fillMaxSize().background(MaterialTheme.colorScheme.background)
            .focusProperties {
                exit = { focusDirection ->
                    if (focusDirection == androidx.compose.ui.focus.FocusDirection.Left) navRailFocusRequester ?: androidx.compose.ui.focus.FocusRequester.Default else androidx.compose.ui.focus.FocusRequester.Default
                }
            }
            .focusGroup(),
'''
          s = must_replace(s, old, new, 'HomeScreen competing UP handler')
          old_anchor = '''                            if (anchorOwnsContentFocus) it.focusRequester(contentFocus)
                                .focusRequester(topAnchor).focusable()
                                .onPreviewKeyEvent { event ->
                                    if (event.type == KeyEventType.KeyDown && event.key == Key.DirectionUp) {
                                        navRailFocusRequester?.let { runCatching { it.requestFocus() }.isSuccess } == true
                                    } else false
                                }
                            else it.focusRequester(topAnchor)
'''
          new_anchor = '''                            if (anchorOwnsContentFocus) it.focusRequester(contentFocus)
                                .focusRequester(topAnchor).focusable()
                            else it.focusRequester(topAnchor)
'''
          s = must_replace(s, old_anchor, new_anchor, 'HomeScreen top anchor UP handler')
          s = s.replace('    // Destination UP uniquement depuis l\'ancre réellement située au sommet.\n    // Ne jamais l\'employer depuis une carte : TvLazyColumn doit d\'abord\n    // résoudre la rangée précédente et faire défiler le contenu.\n', '    // Destination GAUCHE vers la NavRail. Le déplacement vertical reste\n    // entièrement géré par les listes TV natives.\n')
          for imp in [
              'import androidx.compose.ui.input.key.Key\n',
              'import androidx.compose.ui.input.key.KeyEventType\n',
              'import androidx.compose.ui.input.key.key\n',
              'import androidx.compose.ui.input.key.onPreviewKeyEvent\n',
              'import androidx.compose.ui.input.key.type\n',
          ]:
              s = s.replace(imp, '')
          home_screen.write_text(s)

          # 3) Detail/person/row screens: same geometry. The old helper was a
          # global UP interceptor. Replace it with a native LEFT group exit.
          s = main_activity.read_text()
          for imp in [
              'import androidx.compose.ui.input.key.Key\n',
              'import androidx.compose.ui.input.key.KeyEventType\n',
              'import androidx.compose.ui.input.key.key\n',
              'import androidx.compose.ui.input.key.onKeyEvent\n',
              'import androidx.compose.ui.input.key.onPreviewKeyEvent\n',
              'import androidx.compose.ui.input.key.type\n',
          ]:
              s = s.replace(imp, '')
          if 'import androidx.compose.foundation.focusGroup\n' not in s:
              s = s.replace('import androidx.compose.foundation.focusable\n', 'import androidx.compose.foundation.focusable\nimport androidx.compose.foundation.focusGroup\n')
          if 'import androidx.compose.ui.focus.focusProperties\n' not in s:
              s = s.replace('import androidx.compose.ui.focus.focusRequester\n', 'import androidx.compose.ui.focus.focusRequester\nimport androidx.compose.ui.focus.focusProperties\n')
          s = s.replace('DetailUpToNavHandler', 'DetailFocusToNavHandler')
          start = s.index('/** Conteneur des écrans HORS MainScreen')
          old_tail = s[start:]
          marker = '@Composable\nprivate fun DetailFocusToNavHandler('
          if marker not in old_tail:
              raise SystemExit('Detail focus helper not found')
          new_tail = '''/** Conteneur des écrans HORS MainScreen (fiche titre, fiche acteur,\n * grille « voir tout »). La NavRail vit à GAUCHE : Compose garde le contrôle\n * de UP/DOWN/RIGHT à l'intérieur du contenu et seule une sortie LEFT du\n * groupe est redirigée vers l'onglet actif. Aucun événement D-pad n'est\n * consommé manuellement ici. */\n@Composable\nprivate fun DetailFocusToNavHandler(\n    navRailFocusRequester: FocusRequester,\n    content: @Composable () -> Unit,\n) {\n    Box(\n        modifier = Modifier.fillMaxSize()\n            .focusProperties {\n                exit = { focusDirection ->\n                    if (focusDirection == FocusDirection.Left) {\n                        navRailFocusRequester\n                    } else {\n                        FocusRequester.Default\n                    }\n                }\n            }\n            .focusGroup(),\n    ) {\n        content()\n    }\n}\n'''
          s = s[:start] + new_tail
          # Correct the exact old bug: requestFocus() returns Boolean. A
          # successful try with a returned false is NOT a focus move.
          s = re.sub(r'runCatching \{ ([^{}\n]*?\.requestFocus\(\)) \}\.isSuccess', r'runCatching { \1 }.getOrDefault(false)', s)
          main_activity.write_text(s)

          # 4) Apply the same Boolean fix everywhere in the TV client. This is
          # mechanical and only touches runCatching(requestFocus()).isSuccess.
          tv_root = root / 'android-tv-nx/app/src/main/kotlin'
          changed = []
          fixed_count = 0
          pattern = re.compile(r'runCatching \{ ([^{}\n]*?\.requestFocus\(\)) \}\.isSuccess')
          for path in tv_root.rglob('*.kt'):
              text = path.read_text()
              text2, n = pattern.subn(r'runCatching { \1 }.getOrDefault(false)', text)
              # A second historical anti-pattern used in the NavRail popup.
              text2 = re.sub(r'try \{ ([A-Za-z_][A-Za-z0-9_]*)\.requestFocus\(\); true \} catch', r'try { \1.requestFocus() } catch', text2)
              if text2 != text:
                  path.write_text(text2)
                  changed.append(str(path))
                  fixed_count += n
          print(f'Boolean requestFocus fixes: {fixed_count}')
          for p in changed:
              print('  ', p)

          # Safety assertions: these are the regressions that must not survive.
          for path in tv_root.rglob('*.kt'):
              text = path.read_text()
              if re.search(r'runCatching \{ [^{}\n]*?\.requestFocus\(\) \}\.isSuccess', text):
                  raise SystemExit(f'Unsafe requestFocus isSuccess remains in {path}')
          for path in [main_activity, main_screen, home_screen]:
              text = path.read_text()
              if 'moveFocus(FocusDirection.Up)' in text or 'moveFocus(androidx.compose.ui.focus.FocusDirection.Up)' in text:
                  raise SystemExit(f'Global manual UP traversal remains in {path}')
          PY

      - name: Compile Android TV after focus repair
        working-directory: android-tv-nx
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare v1.25.50 metadata
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          version = '1.25.50'
          pkg = Path('package.json')
          data = json.loads(pkg.read_text())
          data['version'] = version
          pkg.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          lock = Path('package-lock.json')
          if lock.exists():
              d = json.loads(lock.read_text())
              d['version'] = version
              if '' in d.get('packages', {}):
                  d['packages']['']['version'] = version
              lock.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n')

          readme = Path('README.md')
          r = readme.read_text()
          r = r.replace('version-1.25.49-', 'version-1.25.50-').replace('Version 1.25.49', 'Version 1.25.50')
          readme.write_text(r)

          changelog = Path('CHANGELOG.md')
          old = changelog.read_text()
          entry = '''## v1.25.50 — September 2026

### Android TV : D-pad réparé après la refonte sidebar

- La navigation latérale et le contenu utilisent de nouveau un seul moteur de focus : `focusProperties`/`focusGroup` de Compose, sans interception globale de `UP`.
- La sidebar étant désormais à gauche, la sortie du contenu vers le menu se fait sur `LEFT`; `UP`/`DOWN` restent natifs dans les listes, rangées, grilles et fiches.
- Les anciens appels `runCatching { requestFocus() }.isSuccess` ont été corrigés : le booléen réellement renvoyé par `requestFocus()` est maintenant respecté, donc un refus de focus n'est plus pris pour un succès.
- Aucun changement visuel : dimensions, couleurs, cartes, sidebar et animations restent identiques à la refonte actuelle.

'''
          if not old.startswith('## v1.25.50'):
              changelog.write_text(entry + old)
          PY

      - name: Commit, tag and dispatch release builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-dpad-v1.25.50-once.yml
          git add android-tv-nx package.json package-lock.json README.md CHANGELOG.md
          git commit -m 'release: v1.25.50 — D-pad natif après refonte sidebar'
          git push origin HEAD:main
          git tag v1.25.50
          git push origin v1.25.50

          # GITHUB_TOKEN tag pushes do not recursively start other workflows.
          # Dispatch the normal release pipelines explicitly.
          gh workflow run android-tv-build.yml --ref v1.25.50
          gh workflow run android-mobile-build.yml --ref v1.25.50
          gh workflow run linux-release-build.yml --ref v1.25.50
          gh workflow run build-installer.yml --ref v1.25.50
          gh workflow run docker-publish.yml --ref main
