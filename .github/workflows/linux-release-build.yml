name: Build Linux Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify SQLite runtime
        run: node -e "const s=require('node:sqlite'); if(typeof s.DatabaseSync!=='function') process.exit(1)"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install engine dependencies
        run: npm ci --no-audit --no-fund
        working-directory: engine

      - name: Build production bundle
        run: npm run build

      - name: Package standalone bundle + engine
        run: |
          set -euo pipefail
          STAGE="$(mktemp -d)/movviz"
          mkdir -p "$STAGE"
          cp -r .next/standalone/. "$STAGE/"
          cp -r .next/static "$STAGE/.next/static"
          [ -d public ] && cp -r public "$STAGE/public"
          cp -r engine "$STAGE/engine"
          mkdir -p "$STAGE/packaging/linux"
          cp packaging/linux/install.sh "$STAGE/packaging/linux/install.sh"
          cp packaging/linux/uninstall.sh "$STAGE/packaging/linux/uninstall.sh"
          cp packaging/linux/movviz.service "$STAGE/packaging/linux/movviz.service"
          cp packaging/linux/README-LINUX.md "$STAGE/README-LINUX.md"
          chmod +x "$STAGE/packaging/linux/install.sh" "$STAGE/packaging/linux/uninstall.sh"

          test -f "$STAGE/server.js"
          test -f "$STAGE/package.json"
          test -d "$STAGE/.next/static"
          test -d "$STAGE/engine/node_modules"
          test -x "$STAGE/packaging/linux/install.sh"
          test -x "$STAGE/packaging/linux/uninstall.sh"
          test -f "$STAGE/packaging/linux/movviz.service"
          test -f "$STAGE/README-LINUX.md"

          cd "$(dirname "$STAGE")"
          tar -cf - movviz | gzip -9 > "$GITHUB_WORKSPACE/movviz-linux-x64.tar.gz"
          cd "$GITHUB_WORKSPACE"

          tar -tzf movviz-linux-x64.tar.gz > /tmp/tar-list.txt
          grep -qx 'movviz/packaging/linux/install.sh' /tmp/tar-list.txt
          grep -qx 'movviz/packaging/linux/uninstall.sh' /tmp/tar-list.txt
          grep -qx 'movviz/README-LINUX.md' /tmp/tar-list.txt
          sha256sum movviz-linux-x64.tar.gz > movviz-linux-x64.tar.gz.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: movviz-linux-x64
          path: |
            movviz-linux-x64.tar.gz
            movviz-linux-x64.tar.gz.sha256

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            movviz-linux-x64.tar.gz
            movviz-linux-x64.tar.gz.sha256
