name: Build Linux Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install engine dependencies
        run: npm ci --no-audit --no-fund
        working-directory: engine

      - name: Build production bundle
        run: npm run build

      - name: Diagnose tar failure
        run: |
          echo "=== file count ==="
          find .next/standalone -type f 2>/dev/null | wc -l
          echo "=== total size ==="
          du -sh .next/standalone 2>/dev/null
          echo "=== special files (pipes/sockets) ==="
          find .next/standalone -type p -o -type s 2>/dev/null | head -20
          echo "=== symlinks ==="
          find .next/standalone -type l 2>/dev/null | head -20
          echo "=== tar test standalone only ==="
          tar -cf /dev/null -C .next/standalone . 2>&1 && echo "tar works on full standalone" || echo "tar FAILED on full standalone"
          echo "=== tar test engine only ==="
          tar -cf /dev/null -C . engine 2>&1 && echo "tar works on engine" || echo "tar FAILED on engine"
          echo "=== tar test static only ==="
          tar -cf /dev/null -C .next static 2>&1 && echo "tar works on static" || echo "tar FAILED on static"
          echo "=== tar test full STAGE simulation ==="
          STAGE="$(mktemp -d)/movviz"
          mkdir -p "$STAGE"
          cp -r .next/standalone/. "$STAGE/"
          cp -r .next/static "$STAGE/.next/static"
          cp -r engine "$STAGE/engine"
          mkdir -p "$STAGE/packaging/linux"
          cp packaging/linux/install.sh "$STAGE/packaging/linux/install.sh"
          cp packaging/linux/README-LINUX.md "$STAGE/README-LINUX.md"
          chmod +x "$STAGE/packaging/linux/install.sh"
          cd "$(dirname "$STAGE")"
          echo "=== tar test STAGE without gzip ==="
          tar -cf /dev/null movviz 2>&1 && echo "tar works on STAGE uncompressed" || echo "tar FAILED on STAGE uncompressed"
          echo "=== tar test STAGE with gzip ==="
          tar -cf - movviz | gzip -9 > /dev/null 2>&1 && echo "tar+gzip works on STAGE" || echo "tar+gzip FAILED on STAGE"
          echo "=== STAGE size ==="
          du -sh "$STAGE"

      - name: Package standalone bundle + engine
        run: |
          set -euo pipefail
          STAGE="$(mktemp -d)/movviz"
          mkdir -p "$STAGE"
          cp -r .next/standalone/. "$STAGE/"
          cp -r .next/static "$STAGE/.next/static"
          [ -d public ] && cp -r public "$STAGE/public"
          cp -r engine "$STAGE/engine"
          mkdir -p "$STAGE/packaging/linux"
          cp packaging/linux/install.sh "$STAGE/packaging/linux/install.sh"
          cp packaging/linux/uninstall.sh "$STAGE/packaging/linux/uninstall.sh"
          cp packaging/linux/movviz.service "$STAGE/packaging/linux/movviz.service"
          cp packaging/linux/README-LINUX.md "$STAGE/README-LINUX.md"
          chmod +x "$STAGE/packaging/linux/install.sh" "$STAGE/packaging/linux/uninstall.sh"
          echo "Stage size: $(du -sh "$STAGE" | cut -f1)"

          test -f "$STAGE/server.js"
          test -f "$STAGE/package.json"
          test -d "$STAGE/.next/static"
          test -d "$STAGE/engine/node_modules"
          test -x "$STAGE/packaging/linux/install.sh"
          test -x "$STAGE/packaging/linux/uninstall.sh"
          test -f "$STAGE/packaging/linux/movviz.service"
          test -f "$STAGE/README-LINUX.md"

          cd "$(dirname "$STAGE")"
          tar -cf - movviz | gzip -9 > "$GITHUB_WORKSPACE/movviz-linux-x64.tar.gz"
          cd "$GITHUB_WORKSPACE"
          tar -tzf movviz-linux-x64.tar.gz | grep -qx 'movviz/packaging/linux/install.sh'
          tar -tzf movviz-linux-x64.tar.gz | grep -qx 'movviz/packaging/linux/uninstall.sh'
          tar -tzf movviz-linux-x64.tar.gz | grep -qx 'movviz/README-LINUX.md'
          sha256sum movviz-linux-x64.tar.gz > movviz-linux-x64.tar.gz.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: movviz-linux-x64
          path: |
            movviz-linux-x64.tar.gz
            movviz-linux-x64.tar.gz.sha256

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            movviz-linux-x64.tar.gz
            movviz-linux-x64.tar.gz.sha256
