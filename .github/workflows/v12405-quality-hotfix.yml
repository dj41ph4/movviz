name: v1.24.05 unified quality hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v12405-quality-hotfix.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply quality replan hotfix
        shell: bash
        run: |
          set -euo pipefail
          node scripts/v12405-quality-hotfix.mjs
          rm -f scripts/v12405-quality-hotfix.mjs .github/workflows/v12405-quality-hotfix.yml
          git diff --check

      - name: Verify quality wiring invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'forcedQualityDownscale' src/lib/playback/engine/decidePlayback.ts
          grep -q 'FORCED_QUALITY' src/lib/playback/engine/decidePlayback.ts
          grep -q 'tryStartUnifiedEngineRef' src/components/player/VideoPlayer.tsx
          grep -q 'quality: overrides.quality ?? toPlannerQuality(qualityRef.current)' src/components/player/VideoPlayer.tsx
          grep -q 'quality: toPlannerQuality(qualityRef.current)' src/components/player/VideoPlayer.tsx
          test ! -e scripts/v12405-quality-hotfix.mjs
          test ! -e .github/workflows/v12405-quality-hotfix.yml

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Quality regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-transform-types --no-warnings --import ./scripts/movviz-test-loader.mjs --test scripts/decide-playback.test.ts scripts/player-quality-replan.test.ts

      - name: Portable tests
        shell: bash
        run: |
          set -euo pipefail
          FILES=$(find scripts -maxdepth 1 -name '*.test.ts' ! -name 'server-capabilities.test.ts' -print | tr '\n' ' ')
          node --experimental-transform-types --no-warnings --import ./scripts/movviz-test-loader.mjs --test $FILES

      - name: Production build
        run: npm run build

      - name: Commit hotfix to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'fix(playback): replan explicit quality through unified transcoder'
          git push origin HEAD:main
