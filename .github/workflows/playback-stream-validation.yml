name: Playback stream validation

on:
  push:
    branches: [main]
    paths:
      - 'src/app/api/playback/session/**'
      - 'src/app/api/playback-ffmpeg/**'
      - 'src/lib/playback/engine/**'
      - 'src/lib/playback/ffmpeg/**'
      - 'src/components/player/VideoPlayer.tsx'
      - 'scripts/decide-playback.test.ts'
      - 'scripts/playback-session-manager.test.ts'
      - '.github/workflows/playback-stream-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playback-stream-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Portable tests
        shell: bash
        run: |
          FILES=$(find scripts -maxdepth 1 -name '*.test.ts' ! -name 'server-capabilities.test.ts' -print | tr '\n' ' ')
          node --experimental-transform-types --no-warnings --import ./scripts/movviz-test-loader.mjs --test $FILES
      - name: Production build
        run: npm run build
