name: v1.24.00 direct main release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v12400-main-release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Align v1.24.00 version metadata and runtime requirements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          expected_old = '1.23.04'
          expected_new = '1.24.00'

          pkg = Path('package.json')
          pkg_data = json.loads(pkg.read_text())
          assert pkg_data.get('version') == expected_old, f"package.json is {pkg_data.get('version')}, expected {expected_old}"
          pkg_data['version'] = expected_new
          pkg.write_text(json.dumps(pkg_data, ensure_ascii=False, indent=2) + '\n')

          lock = Path('package-lock.json')
          lock_data = json.loads(lock.read_text())
          assert lock_data.get('version') == expected_old, 'package-lock root version mismatch'
          assert lock_data.get('packages', {}).get('', {}).get('version') == expected_old, 'package-lock packages[""] version mismatch'
          lock_data['version'] = expected_new
          lock_data['packages']['']['version'] = expected_new
          lock.write_text(json.dumps(lock_data, ensure_ascii=False, indent=2) + '\n')

          for fn in ['android-tv/app/build.gradle.kts', 'android-mobile/app/build.gradle.kts']:
              p = Path(fn)
              s = p.read_text()
              assert '12304' in s and '"1.23.04"' in s, f'{fn}: expected 1.23.04 fallback metadata missing'
              s = s.replace('12304', '12400').replace('"1.23.04"', '"1.24.00"')
              p.write_text(s)

          p = Path('README.md')
          s = p.read_text()
          assert 'Movviz-1.23.04' in s, 'README current release badge is not on 1.23.04'
          p.write_text(s.replace('Movviz-1.23.04', 'Movviz-1.24.00', 1))

          p = Path('packaging/linux/install.sh')
          s = p.read_text()
          assert 'Node.js 20 ou plus récent est requis mais introuvable.' in s
          assert '"$NODE_MAJOR" -ge 20' in s
          assert 'Node.js 20 ou plus récent est requis (version détectée' in s
          s = s.replace('Node.js 20 ou plus récent est requis mais introuvable.', 'Node.js 22 ou plus récent est requis mais introuvable.')
          s = s.replace('"$NODE_MAJOR" -ge 20', '"$NODE_MAJOR" -ge 22')
          s = s.replace('Node.js 20 ou plus récent est requis (version détectée', 'Node.js 22 ou plus récent est requis (version détectée')
          p.write_text(s)

          p = Path('packaging/linux/README-LINUX.md')
          s = p.read_text()
          assert 'Node.js 20 ou plus récent' in s
          p.write_text(s.replace('Node.js 20 ou plus récent', 'Node.js 22 ou plus récent'))

          p = Path('CHANGELOG.md')
          s = p.read_text()
          assert s.startswith('# Changelog\n'), 'unexpected CHANGELOG header'
          entry = '''# Changelog\n\n## v1.24.00 — August 2026\n\n### Movviz AI — User Context Engine unifié\n\nMovviz AI dispose désormais d'un moteur de contexte utilisateur unifié et persistant. Un ledger SQLite par `user_id` conserve l'historique média sans mélanger les profils : lectures, films et épisodes terminés, rewatchs distincts, progression, reprises et chronologie réelle quand elle est connue. Les anciennes données de visionnage/progression sont bootstrapées de manière idempotente sans fabriquer de dates absentes.\n\nLe Query Engine peut exploiter cet état vérifié pour fournir à l'IA la progression exacte des séries, les contenus en cours et l'historique récent, avec enrichissement par métadonnées/genres. Ratings, feedback, demandes, facts, insights et mémoire IA restent compatibles via une couche d'adapters unifiée afin d'éviter toute migration destructive. Des traits de goûts fondés sur des preuves et un niveau de confiance peuvent également alimenter la personnalité sans transformer une inférence en fait.\n\nLe Context Engine est additif et résilient : les stores existants restent fonctionnels, les écritures SQLite n'empêchent jamais la lecture en cas de panne et `MOVVIZ_CONTEXT_ENGINE_DISABLED=true` permet un rollback immédiat. Les tests couvrent notamment l'isolation multi-utilisateur, l'idempotence et la conservation de plusieurs rewatchs.\n\n### Runtime — Node.js 22\n\nLe serveur Movviz passe à Node.js 22 minimum pour garantir la disponibilité de `node:sqlite`. L'installeur Windows embarque désormais Node 22 et les builds Linux utilisent/annoncent également Node 22 minimum.\n\n'''
          p.write_text(entry + s[len('# Changelog\n\n'):])
          PY

      - name: Verify aligned release and SQLite runtime
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'),l=require('./package-lock.json'); if(p.version!=='1.24.00'||l.version!=='1.24.00'||l.packages[''].version!=='1.24.00') process.exit(1)"
          node -e "const s=require('node:sqlite'); if(typeof s.DatabaseSync!=='function') process.exit(1)"
          grep -q 'versionCode = .*12400' android-tv/app/build.gradle.kts
          grep -q 'versionName = .*"1.24.00"' android-tv/app/build.gradle.kts
          grep -q 'versionCode = .*12400' android-mobile/app/build.gradle.kts
          grep -q 'versionName = .*"1.24.00"' android-mobile/app/build.gradle.kts
          grep -q 'node-version: 22' .github/workflows/build-installer.yml
          grep -q 'node-version: 22' .github/workflows/linux-release-build.yml
          grep -q 'Node.js 22 ou plus récent' packaging/linux/install.sh
          grep -q '"$NODE_MAJOR" -ge 22' packaging/linux/install.sh
          grep -q 'Node.js 22 ou plus récent' packaging/linux/README-LINUX.md
          grep -q 'tags: \["v\*"\]' .github/workflows/build-installer.yml
          grep -q 'tags: \["v\*"\]' .github/workflows/linux-release-build.yml
          grep -q 'tags: \["v\*"\]' .github/workflows/android-tv-build.yml
          grep -q 'tags: \["v\*"\]' .github/workflows/android-mobile-build.yml
          test -f src/lib/userContext/database.ts
          test -f src/lib/userContext/history.ts
          grep -q 'MOVVIZ_CONTEXT_ENGINE_DISABLED' src/lib/userContext/database.ts

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Portable tests
        shell: bash
        run: |
          FILES=$(find scripts -maxdepth 1 -name '*.test.ts' ! -name 'server-capabilities.test.ts' -print | tr '\n' ' ')
          node --experimental-transform-types --no-warnings --import ./scripts/movviz-test-loader.mjs --test $FILES

      - name: Production build
        run: npm run build

      - name: Commit and tag v1.24.00 on main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json android-tv/app/build.gradle.kts android-mobile/app/build.gradle.kts README.md CHANGELOG.md packaging/linux/install.sh packaging/linux/README-LINUX.md
          git commit -m 'v1.24.00 — unified user context engine'
          git push origin HEAD:main
          git tag -a v1.24.00 -m 'v1.24.00 — unified user context engine'
          git push origin v1.24.00
