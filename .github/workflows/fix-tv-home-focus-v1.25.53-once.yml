name: One-shot Android TV Home focus repair v1.25.53

on:
  push:
    branches: [main]
    paths:
      - "scripts/fix_tv_home_focus_v12553.py"
      - ".github/workflows/fix-tv-home-focus-v1.25.53-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --rebase origin main

      - name: Guard expected version
        run: |
          set -euo pipefail
          current="$(node -p "require('./package.json').version")"
          test "$current" = "1.25.52" || { echo "::error::Expected 1.25.52, found $current; refusing to overwrite a newer release"; exit 1; }
          ! git rev-parse -q --verify refs/tags/v1.25.53 >/dev/null || { echo "::error::v1.25.53 already exists"; exit 1; }

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Apply focused D-pad repair
        run: |
          set -euo pipefail
          python scripts/fix_tv_home_focus_v12553.py
          git diff --check

      - name: Compile Android TV Kotlin before release
        working-directory: android-tv-nx
        run: gradle :app:compileDebugKotlin --no-daemon

      - name: Finalize v1.25.53 metadata
        run: |
          set -euo pipefail
          npm version 1.25.53 --no-git-tag-version
          sed -i 's/version-1\.25\.52-a855f7/version-1.25.53-a855f7/g; s/Version 1\.25\.52/Version 1.25.53/g' README.md
          python - <<'PY'
          from pathlib import Path
          p = Path('CHANGELOG.md')
          current = p.read_text(encoding='utf-8')
          entry = '''## v1.25.53 — September 2026

### Android TV : sortie fiable du hero Accueil au D-pad

- Le haut d’Accueil pouvait rester bloqué sur les boutons du hero : `DOWN` dépendait encore de la recherche spatiale automatique de Compose pour découvrir la première carte d’une `TvLazyColumn`, qui n’est pas toujours candidate tant qu’elle n’est pas suffisamment entrée dans le viewport.
- Le hero et la première carte de la première rangée sont maintenant reliés par `focusProperties.down` et un `FocusRequester` dédié. Le bouton principal garde également une sortie `LEFT` explicite vers la sidebar.
- Aucun `onKeyEvent`/`onPreviewKeyEvent` n’est réintroduit : le déplacement reste entièrement géré par le moteur de focus Compose, et le visuel ne change pas.

'''
          p.write_text(entry + current, encoding='utf-8')
          PY

      - name: Commit, tag and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/fix_tv_home_focus_v12553.py .github/workflows/fix-tv-home-focus-v1.25.53-once.yml
          git add android-tv-nx/app/src/main/kotlin/com/movviz/tv/ui/home/HomeScreen.kt package.json package-lock.json README.md CHANGELOG.md
          git diff --cached --check
          git commit -m "release: v1.25.53 — libère le D-pad en haut d’Accueil"
          git push origin HEAD:main
          git tag v1.25.53
          git push origin v1.25.53
