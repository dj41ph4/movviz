name: Ship TV polish v1.24.42

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_ship_tv_polish_v1.24.42.yml'

permissions:
  contents: write
  actions: write

jobs:
  patch-test-ship:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply Android TV polish
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')

          def read(path):
              return (ROOT / path).read_text(encoding='utf-8-sig')

          def write(path, text):
              (ROOT / path).write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'patch anchor missing: {label}')
              return text.replace(old, new, 1)

          # -----------------------------------------------------------------
          # 1) Playback subtitle persistence: OFF by default, per profile/media
          # -----------------------------------------------------------------
          p = 'android-tv/app/src/main/kotlin/com/movviz/tv/data/ProfilePrefs.kt'
          t = read(p)
          if 'class PlaybackPrefs' not in t:
              t += '''\n\n/** Préférence de sous-titres mémorisée localement par profil ET média.\n * Absence de valeur = OFF : on ne laisse jamais ExoPlayer activer une piste\n * texte de lui-même au premier lancement d'un film/épisode. */\ndata class SubtitlePreference(\n    val enabled: Boolean,\n    val language: String? = null,\n)\n\nclass PlaybackPrefs(\n    context: Context,\n    private val serverUrl: String,\n    private val profileId: String,\n) {\n    private val prefs = context.applicationContext.getSharedPreferences("movviz_playback_prefs", Context.MODE_PRIVATE)\n\n    fun subtitlePreference(mediaKey: String): SubtitlePreference {\n        val prefix = key(mediaKey)\n        val enabled = prefs.getBoolean("$prefix|enabled", false)\n        val language = prefs.getString("$prefix|language", null)\n        return SubtitlePreference(enabled = enabled, language = language)\n    }\n\n    fun saveSubtitlePreference(mediaKey: String, enabled: Boolean, language: String? = null) {\n        prefs.edit()\n            .putBoolean("${key(mediaKey)}|enabled", enabled)\n            .putString("${key(mediaKey)}|language", language)\n            .apply()\n    }\n\n    private fun key(mediaKey: String): String =\n        "${serverUrl.trim().trimEnd('/')}|$profileId|subtitle|$mediaKey"\n}\n'''
              write(p, t)

          p = 'android-tv/app/src/main/kotlin/com/movviz/tv/ui/player/PlayerActivity.kt'
          t = read(p)
          t = replace_once(t, 'import com.movviz.tv.data.MovvizRepository\n', 'import com.movviz.tv.data.MovvizRepository\nimport com.movviz.tv.data.PlaybackPrefs\n', 'PlayerActivity import PlaybackPrefs')
          t = replace_once(t, 'private const val EXTRA_LOCAL_KEYS = "extra_local_keys"\n', 'private const val EXTRA_LOCAL_KEYS = "extra_local_keys"\nprivate const val EXTRA_PROFILE_ID = "extra_profile_id"\n', 'PlayerActivity profile extra')
          t = replace_once(t, '        val posterPath = intent.getStringExtra(EXTRA_POSTER_PATH)\n', '        val posterPath = intent.getStringExtra(EXTRA_POSTER_PATH)\n        val profileId = intent.getStringExtra(EXTRA_PROFILE_ID) ?: "anonymous"\n', 'PlayerActivity read profile')
          t = replace_once(t, '                        tmdbId = tmdbId,\n                        queue = queue,', '                        tmdbId = tmdbId,\n                        profileId = profileId,\n                        queue = queue,', 'PlayerScreen profile arg')
          t = replace_once(t, '            posterPath: String? = null,\n        ): Intent = Intent(context, PlayerActivity::class.java).apply {', '            posterPath: String? = null,\n            profileId: String? = null,\n        ): Intent = Intent(context, PlayerActivity::class.java).apply {', 'forQueue profile param')
          t = replace_once(t, '            putExtra(EXTRA_POSTER_PATH, posterPath)\n            putStringArrayListExtra(EXTRA_LOCAL_KEYS, ArrayList(queue.map { it.localKey ?: "" }))', '            putExtra(EXTRA_POSTER_PATH, posterPath)\n            profileId?.let { putExtra(EXTRA_PROFILE_ID, it) }\n            putStringArrayListExtra(EXTRA_LOCAL_KEYS, ArrayList(queue.map { it.localKey ?: "" }))', 'forQueue profile extra')
          t = replace_once(t, '    tmdbId: Int,\n    queue: List<QueueItem>,', '    tmdbId: Int,\n    profileId: String,\n    queue: List<QueueItem>,', 'PlayerScreen signature profile')
          t = replace_once(t, '    val repository = remember(baseUrl) { MovvizRepository(baseUrl) }\n', '    val repository = remember(baseUrl) { MovvizRepository(baseUrl) }\n    val playbackPrefs = remember(baseUrl, profileId) { PlaybackPrefs(context, baseUrl, profileId) }\n', 'PlayerScreen PlaybackPrefs')
          t = replace_once(t, '    var tracksVersion by remember { mutableStateOf(0) } // force la recomposition des dialogues pistes\n', '    var tracksVersion by remember { mutableStateOf(0) } // force la recomposition des dialogues pistes\n    var subtitlePreferenceAppliedFor by remember { mutableStateOf<String?>(null) }\n', 'subtitle applied state')
          t = replace_once(t, '    // Charge un item de la queue dans le player existant — appelé au premier\n', '''    fun subtitlePreferenceKey(item: QueueItem): String =\n        buildString {\n            append(type).append(':').append(tmdbId)\n            if (item.seasonNumber > 0 && item.episodeNumber > 0) {\n                append(':').append(item.seasonNumber).append(':').append(item.episodeNumber)\n            }\n            append(':').append(item.ratingKey)\n        }\n\n    // Charge un item de la queue dans le player existant — appelé au premier\n''', 'subtitle key helper')
          t = replace_once(t, '    fun load(item: QueueItem, resumeMs: Long, level: Int = 0) {\n        loading = true\n', '''    fun load(item: QueueItem, resumeMs: Long, level: Int = 0) {\n        loading = true\n        // Toujours couper le texte AVANT de préparer un nouveau MediaItem :\n        // cela supprime le flash de sous-titre forcé/default qu'ExoPlayer peut\n        // sélectionner seul. Une préférence explicitement activée sera\n        // restaurée juste après la découverte des pistes.\n        subtitlePreferenceAppliedFor = null\n        exoPlayer.trackSelectionParameters = exoPlayer.trackSelectionParameters.buildUpon()\n            .setTrackTypeDisabled(C.TRACK_TYPE_TEXT, true)\n            .clearOverridesOfType(C.TRACK_TYPE_TEXT)\n            .build()\n''', 'disable subtitles before load')
          marker = '    // Signale l\'arrêt/la position finale au serveur en quittant l\'écran —\n'
          restore_block = '''    // Une piste texte n'est restaurée qu'après que Media3 a exposé les\n    // groupes du MediaItem courant. Sans préférence enregistrée, OFF reste\n    // la règle. Si le média avait été repris avec sous-titres ON, on tente la\n    // même langue puis la première piste disponible en repli.\n    LaunchedEffect(current.ratingKey, current.seasonNumber, current.episodeNumber, tracksVersion) {\n        val groups = exoPlayer.currentTracks.groups.withIndex()\n            .filter { it.value.type == C.TRACK_TYPE_TEXT }\n        if (groups.isEmpty()) return@LaunchedEffect\n        val prefKey = subtitlePreferenceKey(current)\n        if (subtitlePreferenceAppliedFor == prefKey) return@LaunchedEffect\n        val pref = playbackPrefs.subtitlePreference(prefKey)\n        subtitlePreferenceAppliedFor = prefKey\n        val builder = exoPlayer.trackSelectionParameters.buildUpon()\n            .clearOverridesOfType(C.TRACK_TYPE_TEXT)\n        if (!pref.enabled) {\n            exoPlayer.trackSelectionParameters = builder\n                .setTrackTypeDisabled(C.TRACK_TYPE_TEXT, true)\n                .build()\n        } else {\n            val chosen = groups.firstOrNull { (_, group) ->\n                group.getTrackFormat(0).language?.equals(pref.language, ignoreCase = true) == true\n            } ?: groups.first()\n            exoPlayer.trackSelectionParameters = builder\n                .setTrackTypeDisabled(C.TRACK_TYPE_TEXT, false)\n                .setOverrideForType(TrackSelectionOverride(chosen.value.mediaTrackGroup, 0))\n                .build()\n        }\n    }\n\n'''
          t = replace_once(t, marker, restore_block + marker, 'restore subtitle preference effect')
          old = '''                onSelect = { groupIndex, _ ->\n                    if (groupIndex < 0) {\n                        exoPlayer.trackSelectionParameters = exoPlayer.trackSelectionParameters.buildUpon()\n                            .setTrackTypeDisabled(C.TRACK_TYPE_TEXT, true)\n                            .clearOverridesOfType(C.TRACK_TYPE_TEXT)\n                            .build()\n                    } else {\n                        applyTrackOverride(exoPlayer, C.TRACK_TYPE_TEXT, exoPlayer.currentTracks.groups[groupIndex])\n                    }\n                    showSubtitleDialog = false\n                },'''
          new = '''                onSelect = { groupIndex, _ ->\n                    val prefKey = subtitlePreferenceKey(queue[currentIndex])\n                    subtitlePreferenceAppliedFor = prefKey\n                    if (groupIndex < 0) {\n                        playbackPrefs.saveSubtitlePreference(prefKey, enabled = false)\n                        exoPlayer.trackSelectionParameters = exoPlayer.trackSelectionParameters.buildUpon()\n                            .setTrackTypeDisabled(C.TRACK_TYPE_TEXT, true)\n                            .clearOverridesOfType(C.TRACK_TYPE_TEXT)\n                            .build()\n                    } else {\n                        val group = exoPlayer.currentTracks.groups[groupIndex]\n                        val language = group.getTrackFormat(0).language\n                        playbackPrefs.saveSubtitlePreference(prefKey, enabled = true, language = language)\n                        applyTrackOverride(exoPlayer, C.TRACK_TYPE_TEXT, group)\n                    }\n                    showSubtitleDialog = false\n                },'''
          t = replace_once(t, old, new, 'subtitle dialog persistence')
          write(p, t)

          # -----------------------------------------------------------------
          # 2) Resume CTA refreshes immediately when returning from the player
          # -----------------------------------------------------------------
          p = 'android-tv/app/src/main/kotlin/com/movviz/tv/MainActivity.kt'
          t = read(p)
          t = t.replace('PlayerActivity.forQueue(context, url, type, tmdbId, title, queue, startIndex, posterPath = posterPath)', 'PlayerActivity.forQueue(context, url, type, tmdbId, title, queue, startIndex, posterPath = posterPath, profileId = viewModel.currentUser.value?.id)')
          t = t.replace('PlayerActivity.forQueue(context, url, type, tmdbId, title, queue, startIndex, startFromBeginning = true, posterPath = posterPath)', 'PlayerActivity.forQueue(context, url, type, tmdbId, title, queue, startIndex, startFromBeginning = true, posterPath = posterPath, profileId = viewModel.currentUser.value?.id)')
          write(p, t)

          p = 'android-tv/app/src/main/kotlin/com/movviz/tv/ui/title/TitleDetailScreen.kt'
          t = read(p)
          t = replace_once(t, 'import androidx.compose.runtime.Composable\n', 'import androidx.compose.runtime.Composable\nimport androidx.compose.runtime.DisposableEffect\n', 'TitleDetail DisposableEffect import')
          t = replace_once(t, 'import kotlinx.coroutines.delay\n', 'import kotlinx.coroutines.delay\nimport androidx.lifecycle.Lifecycle\nimport androidx.lifecycle.LifecycleEventObserver\nimport androidx.lifecycle.compose.LocalLifecycleOwner\n', 'TitleDetail lifecycle imports')
          anchor = '''    LaunchedEffect(type, tmdbId) {\n        viewModel.loadDetail(type, tmdbId)\n        viewModel.loadHeroLogo(type, tmdbId)\n'''
          if anchor not in t:
              raise SystemExit('patch anchor missing: TitleDetail initial load')
          # Insert lifecycle observer after the whole first LaunchedEffect block by locating the next comment.
          next_comment = '    // Même état vivant que la fiche desktop : après l\'ajout, la même fiche\n'
          lifecycle_block = '''    // PlayerActivity vit au-dessus de cette fiche. Quand elle se ferme, la\n    // composition est conservée : le LaunchedEffect(type, tmdbId) ne repart\n    // donc pas. On recharge explicitement le on-deck à ON_RESUME pour que le\n    // CTA passe immédiatement de « Lire » à « Reprendre à HH:MM:SS ».\n    val lifecycleOwner = LocalLifecycleOwner.current\n    DisposableEffect(lifecycleOwner, type, tmdbId) {\n        val observer = LifecycleEventObserver { _, event ->\n            if (event == Lifecycle.Event.ON_RESUME) {\n                viewModel.loadContinueWatching()\n                viewModel.loadWatchStatus()\n                if (viewModel.isInLibrary(type, tmdbId)) {\n                    viewModel.refreshTitleLibraryEntry(type, tmdbId)\n                }\n            }\n        }\n        lifecycleOwner.lifecycle.addObserver(observer)\n        onDispose { lifecycleOwner.lifecycle.removeObserver(observer) }\n    }\n\n'''
          t = replace_once(t, next_comment, lifecycle_block + next_comment, 'TitleDetail resume lifecycle')
          old_fmt = '''private fun formatResumeTime(offsetMs: Long): String {\n    val totalSeconds = (offsetMs / 1000).coerceAtLeast(0)\n    val h = totalSeconds / 3600\n    val m = (totalSeconds % 3600) / 60\n    val s = totalSeconds % 60\n    return if (h > 0) "%d:%02d:%02d".format(h, m, s) else "%d:%02d".format(m, s)\n}'''
          new_fmt = '''private fun formatResumeTime(offsetMs: Long): String {\n    val totalSeconds = (offsetMs / 1000).coerceAtLeast(0)\n    val h = totalSeconds / 3600\n    val m = (totalSeconds % 3600) / 60\n    val s = totalSeconds % 60\n    return "%02d:%02d:%02d".format(h, m, s)\n}'''
          t = replace_once(t, old_fmt, new_fmt, 'HH:MM:SS resume format')
          write(p, t)

          # -----------------------------------------------------------------
          # 3) Fix local catalog genres: TMDb IDs were compared to genre names
          # -----------------------------------------------------------------
          p = 'android-tv/app/src/main/kotlin/com/movviz/tv/ui/home/CatalogScreen.kt'
          t = read(p)
          t = replace_once(t, '    var selectedGenre by remember(type) { mutableStateOf<String?>(null) }\n\n    val filtered = remember(cards, selectedGenre) {\n        if (selectedGenre == null) cards else cards.filter { selectedGenre in it.genres }\n    }', '''    var selectedGenre by remember(type) { mutableStateOf<CatalogGenreSelection?>(null) }\n\n    val filtered = remember(cards, selectedGenre) {\n        val selection = selectedGenre\n        if (selection == null) cards else cards.filter { cardMatchesCatalogGenre(it, selection) }\n    }''', 'Catalog genre filter')
          t = replace_once(t, '            CatalogGenreRow(genres = genres, selected = selectedGenre, onSelect = { selectedGenre = if (selectedGenre == it) null else it })', '            CatalogGenreRow(genres = genres, selected = selectedGenre, onSelect = { selectedGenre = if (selectedGenre?.key == it.key) null else it })', 'Catalog genre callback')
          old_row = '''private val SYNTHETIC_GENRES = listOf("anime" to "Anime", "teen" to "Romance ado")\n\n@Composable\nprivate fun CatalogGenreRow(genres: List<GenreDto>, selected: String?, onSelect: (String) -> Unit) {\n    LazyRow(\n        contentPadding = PaddingValues(end = 24.dp),\n        horizontalArrangement = Arrangement.spacedBy(10.dp),\n    ) {\n        items(SYNTHETIC_GENRES, key = { "synth-${it.first}" }) { (id, label) ->\n            CatalogGenreChip(label = label, active = selected == id, onClick = { onSelect(id) })\n        }\n        items(genres, key = { "tmdb-${it.id}" }) { g ->\n            CatalogGenreChip(label = g.name, active = selected == g.id.toString(), onClick = { onSelect(g.id.toString()) })\n        }\n    }\n}\n'''
          new_row = '''private data class CatalogGenreSelection(val key: String, val label: String)\nprivate val SYNTHETIC_GENRES = listOf("anime" to "Anime", "teen" to "Romance ado")\n\nprivate fun normalizedGenre(value: String): String =\n    java.text.Normalizer.normalize(value, java.text.Normalizer.Form.NFD)\n        .replace("\\\\p{M}+".toRegex(), "")\n        .trim()\n        .lowercase()\n\nprivate fun cardMatchesCatalogGenre(card: TvTitleCard, selection: CatalogGenreSelection): Boolean {\n    val names = card.genres.map(::normalizedGenre).toSet()\n    return when (selection.key) {\n        "anime" -> "animation" in names || "anime" in names\n        "teen" -> {\n            val family = "familial" in names || "family" in names || "kids" in names\n            if (family) false\n            else if (card.isMovie) {\n                "romance" in names && ("comedie" in names || "comedy" in names || "drame" in names || "drama" in names)\n            } else {\n                "soap" in names || (("drame" in names || "drama" in names) && ("comedie" in names || "comedy" in names))\n            }\n        }\n        else -> normalizedGenre(selection.label) in names\n    }\n}\n\n@Composable\nprivate fun CatalogGenreRow(genres: List<GenreDto>, selected: CatalogGenreSelection?, onSelect: (CatalogGenreSelection) -> Unit) {\n    LazyRow(\n        contentPadding = PaddingValues(end = 24.dp),\n        horizontalArrangement = Arrangement.spacedBy(10.dp),\n    ) {\n        items(SYNTHETIC_GENRES, key = { "synth-${it.first}" }) { (id, label) ->\n            val value = CatalogGenreSelection(id, label)\n            CatalogGenreChip(label = label, active = selected?.key == id, onClick = { onSelect(value) })\n        }\n        items(genres, key = { "tmdb-${it.id}" }) { g ->\n            val value = CatalogGenreSelection(g.id.toString(), g.name)\n            CatalogGenreChip(label = g.name, active = selected?.key == value.key, onClick = { onSelect(value) })\n        }\n    }\n}\n'''
          t = replace_once(t, old_row, new_row, 'Catalog genre row')
          write(p, t)

          # -----------------------------------------------------------------
          # 4) Profile parity / no cache bleed between household profiles
          # -----------------------------------------------------------------
          p = 'android-tv/app/src/main/kotlin/com/movviz/tv/AppViewModel.kt'
          t = read(p)
          select_anchor = '''    suspend fun selectProfile(profile: TvProfile): ApiResult<MovvizUserDto> {\n        val url = _serverUrl.value ?: profile.serverUrl\n'''
          select_new = '''    private fun clearProfileScopedState() {\n        _currentUser.value = null\n        _activeProfile.value = null\n        _movies.value = emptyList()\n        _series.value = emptyList()\n        _dashboardHero.value = emptyList()\n        _heroLogos.value = emptyMap()\n        _continueWatching.value = emptyList()\n        _trendingMovies.value = emptyList()\n        _trendingSeries.value = emptyList()\n        _movieRows.value = emptyList()\n        _seriesRows.value = emptyList()\n        _movieLibraryRecommendations.value = emptyList()\n        _seriesLibraryRecommendations.value = emptyList()\n        _detail.value = null\n        _person.value = null\n        _seriesSeasons.value = emptyList()\n        _seasonMetadata.value = emptyMap()\n        _searchResults.value = emptyList()\n        _watchStatus.value = null\n        _userPrefs.value = null\n        seasonsTmdbId = null\n    }\n\n    suspend fun selectProfile(profile: TvProfile): ApiResult<MovvizUserDto> {\n        val url = _serverUrl.value ?: profile.serverUrl\n        // Même règle que le smartphone : aucun rail, hero ou recommandation\n        // du profil précédent ne doit survivre pendant la restauration du\n        // cookie du nouveau compte.\n        clearProfileScopedState()\n'''
          t = replace_once(t, select_anchor, select_new, 'profile scoped cache clear')

          update_anchor = '''    private val _updateCheckStatus = MutableStateFlow<String?>(null)\n    val updateCheckStatus: StateFlow<String?> = _updateCheckStatus.asStateFlow()\n'''
          update_new = '''    private val _updateCheckStatus = MutableStateFlow<String?>(null)\n    val updateCheckStatus: StateFlow<String?> = _updateCheckStatus.asStateFlow()\n    private val _availableUpdateTag = MutableStateFlow<String?>(null)\n    val availableUpdateTag: StateFlow<String?> = _availableUpdateTag.asStateFlow()\n    private val _updateInstallTrigger = MutableStateFlow(0)\n    val updateInstallTrigger: StateFlow<Int> = _updateInstallTrigger.asStateFlow()\n\n    fun setAvailableUpdateTag(tag: String?) {\n        _availableUpdateTag.value = tag\n    }\n\n    fun requestUpdateInstall() {\n        _updateInstallTrigger.value += 1\n    }\n'''
          t = replace_once(t, update_anchor, update_new, 'update indicator state')
          write(p, t)

          # -----------------------------------------------------------------
          # 5) Sidebar update indicator + manual install action
          # -----------------------------------------------------------------
          p = 'android-tv/app/src/main/kotlin/com/movviz/tv/ui/home/NavRail.kt'
          t = read(p)
          t = replace_once(t, 'import com.movviz.tv.ui.theme.MovvizIconDotCircle\n', 'import com.movviz.tv.ui.theme.MovvizIconDotCircle\nimport com.movviz.tv.ui.theme.MovvizIconDownload\n', 'NavRail download icon import')
          t = replace_once(t, 'import androidx.compose.animation.core.animateDpAsState\nimport androidx.compose.animation.core.tween\n', 'import androidx.compose.animation.core.animateDpAsState\nimport androidx.compose.animation.core.animateFloat\nimport androidx.compose.animation.core.infiniteRepeatable\nimport androidx.compose.animation.core.RepeatMode\nimport androidx.compose.animation.core.tween\nimport androidx.compose.ui.graphics.graphicsLayer\n', 'NavRail pulse imports')
          t = replace_once(t, '    onSwitchProfile: () -> Unit = {},\n', '    onSwitchProfile: () -> Unit = {},\n    updateAvailableTag: String? = null,\n    onUpdateClick: () -> Unit = {},\n', 'NavRail update args')
          search_anchor = '''        Spacer(modifier = Modifier.weight(1f))\n        SearchButton(\n'''
          update_ui = '''        Spacer(modifier = Modifier.weight(1f))\n        if (updateAvailableTag != null) {\n            UpdateAvailableButton(\n                tag = updateAvailableTag,\n                expanded = railFocused,\n                onClick = onUpdateClick,\n            )\n            Spacer(modifier = Modifier.height(12.dp))\n        }\n        SearchButton(\n'''
          t = replace_once(t, search_anchor, update_ui, 'NavRail update indicator placement')
          profile_anchor = '''@Composable\nprivate fun ProfileMenuButton(\n'''
          update_button = '''@Composable\nprivate fun UpdateAvailableButton(tag: String, expanded: Boolean, onClick: () -> Unit) {\n    var focused by remember { mutableStateOf(false) }\n    val pulse = rememberInfiniteTransition(label = "updatePulse")\n    val alpha by pulse.animateFloat(\n        initialValue = 0.48f,\n        targetValue = 1f,\n        animationSpec = infiniteRepeatable(tween(720), RepeatMode.Reverse),\n        label = "updatePulseAlpha",\n    )\n    val shape = RoundedCornerShape(10.dp)\n    Surface(\n        onClick = onClick,\n        modifier = Modifier\n            .fillMaxWidth()\n            .height(40.dp)\n            .graphicsLayer {\n                this.alpha = if (focused) 1f else alpha\n                scaleX = if (focused) 1.04f else 1f\n                scaleY = if (focused) 1.04f else 1f\n            }\n            .onFocusChanged { focused = it.isFocused }\n            .tvPointerClick(onClick),\n        shape = ClickableSurfaceDefaults.shape(shape = shape),\n        colors = ClickableSurfaceDefaults.colors(\n            containerColor = MovvizBrand.copy(alpha = 0.18f),\n            focusedContainerColor = MovvizBrand.copy(alpha = 0.32f),\n            contentColor = Color.White,\n        ),\n        border = ClickableSurfaceDefaults.border(\n            focusedBorder = Border(\n                border = androidx.compose.foundation.BorderStroke(2.dp, MovvizBrand2),\n                shape = shape,\n            ),\n        ),\n    ) {\n        Row(\n            verticalAlignment = Alignment.CenterVertically,\n            horizontalArrangement = Arrangement.Center,\n            modifier = Modifier.fillMaxSize().padding(horizontal = 8.dp),\n        ) {\n            Icon(\n                imageVector = MovvizIconDownload,\n                contentDescription = "Mise à jour $tag disponible",\n                tint = Color.White,\n                modifier = Modifier.size(22.dp),\n            )\n            AnimatedVisibility(visible = expanded, enter = fadeIn(tween(140)), exit = fadeOut(tween(90))) {\n                Row(verticalAlignment = Alignment.CenterVertically) {\n                    Spacer(modifier = Modifier.width(8.dp))\n                    Text(\n                        text = "Mise à jour ${tag.removePrefix("v")}",\n                        style = TextStyle(fontSize = 11.sp, fontWeight = FontWeight.Bold, color = Color.White),\n                        maxLines = 1,\n                    )\n                }\n            }\n        }\n    }\n}\n\n'''
          t = replace_once(t, profile_anchor, update_button + profile_anchor, 'NavRail update button')
          write(p, t)

          p = 'android-tv/app/src/main/kotlin/com/movviz/tv/MainActivity.kt'
          t = read(p)
          t = replace_once(t, '                    onSwitchProfile = {\n                        navController.navigate(ROUTE_PROFILES) { popUpTo(ROUTE_HOME) }\n                    },\n', '                    onSwitchProfile = {\n                        navController.navigate(ROUTE_PROFILES) { popUpTo(ROUTE_HOME) }\n                    },\n                    updateAvailableTag = viewModel.availableUpdateTag.collectAsState().value,\n                    onUpdateClick = { viewModel.requestUpdateInstall() },\n', 'MainActivity update NavRail args')
          write(p, t)

          # -----------------------------------------------------------------
          # 6) Updates: auto-install only in the startup window; later checks
          #    only light the sidebar indicator. User click = explicit install.
          # -----------------------------------------------------------------
          p = 'android-tv/app/src/main/kotlin/com/movviz/tv/ui/update/UpdateOverlay.kt'
          t = read(p)
          t = replace_once(t, 'import android.os.Build\n', 'import android.os.Build\nimport android.os.SystemClock\n', 'UpdateOverlay SystemClock import')
          t = replace_once(t, 'import java.io.File\n', 'import java.io.File\n\nprivate const val STARTUP_AUTO_UPDATE_WINDOW_MS = 3_000L\nprivate const val BACKGROUND_UPDATE_CHECK_MS = 30L * 60L * 1_000L\n', 'UpdateOverlay constants')
          t = replace_once(t, '    val scope = rememberCoroutineScope()\n', '    val scope = rememberCoroutineScope()\n    val startupStartedAt = remember { SystemClock.elapsedRealtime() }\n', 'UpdateOverlay startup clock')
          old_auto = '''    // Check GitHub au lancement — une seule fois par démarrage de l'appli.\n    val autoUpdate by (viewModel?.autoUpdateEnabled?.collectAsState() ?: remember { mutableStateOf(BuildConfig.AUTO_UPDATE) })\n    LaunchedEffect(Unit) {\n        if (!autoUpdate || dismissed) return@LaunchedEffect\n        delay(5_000)\n        val info = updateManager.checkForUpdate() ?: return@LaunchedEffect\n        pending = info\n        start(info)\n    }\n'''
          new_auto = '''    // Check GitHub au lancement. L'installation AUTOMATIQUE n'est autorisée\n    // que dans une fenêtre très courte de démarrage et tant que MainActivity\n    // est réellement RESUMED. Si le réseau répond trop tard ou si un film a\n    // déjà ouvert PlayerActivity, on mémorise seulement la disponibilité :\n    // la flèche clignotante de la sidebar laisse alors l'utilisateur décider.\n    val autoUpdate by (viewModel?.autoUpdateEnabled?.collectAsState() ?: remember { mutableStateOf(BuildConfig.AUTO_UPDATE) })\n    LaunchedEffect(Unit) {\n        if (!autoUpdate || dismissed) return@LaunchedEffect\n        delay(250)\n        val info = updateManager.checkForUpdate()\n        if (info == null) {\n            viewModel?.setAvailableUpdateTag(null)\n            return@LaunchedEffect\n        }\n        pending = info\n        viewModel?.setAvailableUpdateTag(info.tag)\n        val stillStartup = SystemClock.elapsedRealtime() - startupStartedAt <= STARTUP_AUTO_UPDATE_WINDOW_MS\n        val foreground = lifecycleOwner.lifecycle.currentState.isAtLeast(Lifecycle.State.RESUMED)\n        if (stillStartup && foreground) start(info)\n    }\n\n    // Une session TV peut rester ouverte des heures. On peut découvrir une\n    // nouvelle release sans jamais l'installer en douce : toutes les 30 min,\n    // simple check réseau → indicateur sidebar, rien de plus.\n    LaunchedEffect(autoUpdate) {\n        if (!autoUpdate) return@LaunchedEffect\n        delay(BACKGROUND_UPDATE_CHECK_MS)\n        while (true) {\n            if (state == UpdateUiState.Hidden) {\n                val info = updateManager.checkForUpdate()\n                viewModel?.setAvailableUpdateTag(info?.tag)\n            }\n            delay(BACKGROUND_UPDATE_CHECK_MS)\n        }\n    }\n'''
          t = replace_once(t, old_auto, new_auto, 'startup-only auto update')
          old_manual_tail = '''        viewModel.setUpdateCheckStatus(null)\n        pending = info\n        start(info)\n    }\n'''
          new_manual_tail = '''        viewModel.setAvailableUpdateTag(info.tag)\n        viewModel.setUpdateCheckStatus("Mise à jour ${info.tag.removePrefix("v")} disponible")\n        pending = info\n        // Vérifier depuis Paramètres ne lance plus une installation en plein\n        // usage. L'installation part uniquement depuis la flèche de sidebar.\n    }\n\n    val installTrigger = viewModel?.updateInstallTrigger?.collectAsState()?.value\n    LaunchedEffect(installTrigger) {\n        if (installTrigger == null || installTrigger == 0) return@LaunchedEffect\n        val info = pending ?: updateManager.checkForUpdate()\n        if (info == null) {\n            viewModel.setAvailableUpdateTag(null)\n            viewModel.setUpdateCheckStatus("Movviz est à jour (${BuildConfig.VERSION_NAME})")\n            return@LaunchedEffect\n        }\n        pending = info\n        viewModel.setAvailableUpdateTag(info.tag)\n        start(info)\n    }\n'''
          t = replace_once(t, old_manual_tail, new_manual_tail, 'manual check no auto install')
          # When manual check says up-to-date, also clear stale indicator.
          t = replace_once(t, '            viewModel.setUpdateCheckStatus("Movviz est à jour (${BuildConfig.VERSION_NAME})")\n            return@LaunchedEffect\n', '            viewModel.setAvailableUpdateTag(null)\n            viewModel.setUpdateCheckStatus("Movviz est à jour (${BuildConfig.VERSION_NAME})")\n            return@LaunchedEffect\n', 'clear stale update tag')
          write(p, t)

          # -----------------------------------------------------------------
          # 7) More dynamic premium focus without destabilising TV layout
          # -----------------------------------------------------------------
          p = 'android-tv/app/src/main/kotlin/com/movviz/tv/ui/theme/Theme.kt'
          t = read(p)
          focus_anchor = '''    val elevation by animateDpAsState(\n        targetValue = if (focused) 20.dp else 0.dp,\n        animationSpec = tween(durationMillis = 180),\n        label = "tvCardFocusElevation",\n    )\n'''
          focus_new = focus_anchor + '''    val scale by animateFloatAsState(\n        targetValue = if (focused) 1.035f else 1f,\n        animationSpec = spring(dampingRatio = Spring.DampingRatioNoBouncy, stiffness = Spring.StiffnessMediumLow),\n        label = "tvCardFocusScale",\n    )\n'''
          t = replace_once(t, focus_anchor, focus_new, 'TV card premium scale')
          t = replace_once(t, '    return this\n        .shadow(\n', '    return this\n        .graphicsLayer { scaleX = scale; scaleY = scale }\n        .shadow(\n', 'TV card scale application')
          t = t.replace(' * de grille — aucune rangée voisine ne bouge — et le focus se lit par un\n * contour blanc net et un halo lent blanc/Movviz.', ' * de grille — aucune mesure de layout ne change — et le focus se lit par un\n * micro-zoom GPU (3,5%), un contour blanc net et un halo lent blanc/Movviz.')
          write(p, t)

          # -----------------------------------------------------------------
          # 8) Version 1.24.42 everywhere + changelog
          # -----------------------------------------------------------------
          p = 'package.json'
          t = read(p)
          t = replace_once(t, '"version": "1.24.41"', '"version": "1.24.42"', 'package version')
          write(p, t)

          p = 'package-lock.json'
          t = read(p)
          # Lock file was still on 1.24.39: fix both root occurrences now.
          count = t.count('"version": "1.24.39"')
          if count < 2:
              raise SystemExit('package-lock root version anchors missing')
          t = t.replace('"version": "1.24.39"', '"version": "1.24.42"', 2)
          write(p, t)

          for p in ['android-tv/app/build.gradle.kts', 'android-mobile/app/build.gradle.kts']:
              t = read(p)
              t = t.replace('?: 12439', '?: 12442')
              t = t.replace('?: "1.24.39"', '?: "1.24.42"')
              write(p, t)

          p = 'README.md'
          t = read(p)
          t = t.replace('Movviz-1.24.41-', 'Movviz-1.24.42-', 1)
          write(p, t)

          p = 'CHANGELOG.md'
          t = read(p)
          heading = '# Changelog\n\n'
          entry = '''## v1.24.42 — September 2026\n\n### Android TV — reprise, sous-titres, genres et mise à jour maîtrisée\n\nAndroid TV gagne une reprise réellement dynamique au retour du lecteur (`Reprendre à HH:MM:SS`), des sous-titres désactivés par défaut avec mémorisation par profil et média, la correction du filtrage des catégories qui comparait à tort les IDs TMDb aux noms de genres, une purge complète des données personnalisées lors d'un changement de profil, un focus plus vivant et une flèche de mise à jour clignotante dans la sidebar. Les mises à jour automatiques ne peuvent plus démarrer en pleine navigation ou lecture : seule la courte fenêtre de démarrage autorise l'auto-installation ; ensuite l'utilisateur déclenche explicitement l'installation depuis l'indicateur.\n\n'''
          if entry not in t:
              if heading not in t:
                  raise SystemExit('CHANGELOG heading missing')
              t = t.replace(heading, heading + entry, 1)
          write(p, t)

          # The trigger workflow must not ship in the release tag.
          Path('.github/workflows/_ship_tv_polish_v1.24.42.yml').unlink()
          PY

      - name: Validate patch
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'version = "1.24.42"' package-lock.json || true
          grep -q '"version": "1.24.42"' package.json
          grep -q '12442' android-tv/app/build.gradle.kts
          grep -q '12442' android-mobile/app/build.gradle.kts
          grep -q 'class PlaybackPrefs' android-tv/app/src/main/kotlin/com/movviz/tv/data/ProfilePrefs.kt
          grep -q 'Reprendre à' android-tv/app/src/main/kotlin/com/movviz/tv/ui/title/TitleDetailScreen.kt
          grep -q 'UpdateAvailableButton' android-tv/app/src/main/kotlin/com/movviz/tv/ui/home/NavRail.kt

      - name: Compile Android TV release
        working-directory: android-tv
        run: gradle assembleRelease --no-daemon

      - name: Commit polished TV release to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'v1.24.42 - polish Android TV experience'
          git push origin HEAD:main

      - name: Tag v1.24.42
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin refs/tags/v1.24.42 >/dev/null 2>&1; then
            echo 'v1.24.42 already exists'
          else
            git tag -a v1.24.42 -m 'v1.24.42'
            git push origin refs/tags/v1.24.42
          fi

      - name: Dispatch release pipelines explicitly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for wf in android-tv-build.yml android-mobile-build.yml linux-release-build.yml build-installer.yml docker-publish.yml; do
            if gh workflow view "$wf" >/dev/null 2>&1; then
              gh workflow run "$wf" --ref v1.24.42
            fi
          done
