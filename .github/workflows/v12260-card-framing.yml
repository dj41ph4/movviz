name: v1.22.60 card framing
on:
  push:
    branches: [v12260-card-framing-staging]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Patch card framing and bump version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/media/YouTubeCardBridgePlayer.tsx')
          s = p.read_text()
          old = 'className="pointer-events-none absolute left-1/2 top-[46%] h-[56.25cqw] w-[100cqw] min-h-full min-w-[177.78cqh] -translate-x-1/2 -translate-y-1/2 scale-[1.18]"'
          new = 'className="pointer-events-none absolute left-1/2 top-1/2 h-[56.25cqw] w-[100cqw] min-h-full min-w-[177.78cqh] -translate-x-1/2 -translate-y-1/2 scale-[1.36]"'
          assert old in s
          p.write_text(s.replace(old, new))

          p = Path('src/components/media/TrailerHeader.tsx')
          s = p.read_text()
          old = 'cardPreview ? "top-[46%] scale-[1.18]" : "top-1/2",'
          new = 'cardPreview ? "top-1/2 scale-[1.36]" : "top-1/2",'
          assert old in s
          p.write_text(s.replace(old, new))

          for fn in ['package.json','package-lock.json']:
              p = Path(fn); s = p.read_text(); p.write_text(s.replace('1.22.59','1.22.60'))
          for fn in ['android-tv/app/build.gradle.kts','android-mobile/app/build.gradle.kts']:
              p = Path(fn); s = p.read_text(); s=s.replace('12259','12260').replace('1.22.59','1.22.60'); p.write_text(s)
          p=Path('README.md'); s=p.read_text(); p.write_text(s.replace('Movviz-1.22.59','Movviz-1.22.60',1))
          p=Path('CHANGELOG.md'); s=p.read_text(); entry='''# Changelog\n\n## v1.22.60 — August 2026\n\n### Cartes — recadrage iframe YouTube\n\nLes petites previews YouTube sont recentrées verticalement (`top: 50 %` au lieu de `46 %`) et reçoivent 15 % de zoom supplémentaire par rapport au cadrage précédent (`scale 1.18` → `scale 1.36`) afin de supprimer les bandes noires intégrées aux trailers. Le bridge `postMessage` et son fallback `YT.Player` utilisent exactement le même cadrage. Hero, fiches, modal, sélection des trailers et Android restent inchangés.\n\n'''
          assert s.startswith('# Changelog\n')
          p.write_text(entry + s[len('# Changelog\n\n'):])
          PY
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Portable tests
        run: node --experimental-transform-types --test $(find src scripts -name '*.test.ts' ! -name 'server-capabilities.test.ts' -print)
      - name: Production build
        run: npm run build
      - name: Commit and tag
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/media/YouTubeCardBridgePlayer.tsx src/components/media/TrailerHeader.tsx package.json package-lock.json android-tv/app/build.gradle.kts android-mobile/app/build.gradle.kts README.md CHANGELOG.md
          git commit -m 'v1.22.60 — center and zoom YouTube card previews'
          git tag -a v1.22.60 -m 'v1.22.60 — center and zoom YouTube card previews'
          git push origin HEAD:v12260-card-framing-staging
          git push origin v1.22.60
