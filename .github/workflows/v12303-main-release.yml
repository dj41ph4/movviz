name: v1.23.03 direct main release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v12303-main-release.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Tune detail framing and bump version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Direct-main release guard: abort rather than patching an unexpected base.
          p = Path('package.json')
          s = p.read_text()
          assert '"version": "1.23.02"' in s, 'main is not on expected 1.23.02 base'

          p = Path('src/components/media/YouTubeVirtualPlayer.tsx')
          s = p.read_text()
          old = 'detail: { zoom: 1.10, centerX: 50, centerY: 50, revealSettleMs: 1500 },'
          new = 'detail: { zoom: 1.15, centerX: 50, centerY: 50, revealSettleMs: 1500 },'
          assert old in s, 'detail profile no longer matches expected 1.23.02 state'
          p.write_text(s.replace(old, new, 1))

          for fn in ['package.json', 'package-lock.json']:
              p = Path(fn)
              s = p.read_text()
              assert '1.23.02' in s, f'{fn}: 1.23.02 missing'
              p.write_text(s.replace('1.23.02', '1.23.03'))

          for fn in ['android-tv/app/build.gradle.kts', 'android-mobile/app/build.gradle.kts']:
              p = Path(fn)
              s = p.read_text()
              assert '12302' in s and '1.23.02' in s, f'{fn}: expected version metadata missing'
              p.write_text(s.replace('12302', '12303').replace('1.23.02', '1.23.03'))

          p = Path('README.md')
          s = p.read_text()
          assert 'Movviz-1.23.02' in s, 'README release badge/link not on 1.23.02'
          p.write_text(s.replace('Movviz-1.23.02', 'Movviz-1.23.03', 1))

          p = Path('CHANGELOG.md')
          s = p.read_text()
          assert s.startswith('# Changelog\n'), 'unexpected changelog header'
          entry = '''# Changelog\n\n## v1.23.03 — August 2026\n\n### Fiches — cadrage YouTube virtuel affiné\n\nLe profil `detail`, partagé par la fiche complète et la fiche volante/TitlePanel, conserve le moteur YouTube virtuel 1920×1080 de v1.23.02 mais passe d’un zoom `1.10` à `1.15`. Le changement reste centré et volontairement conservateur afin de rendre le bénéfice visuel plus perceptible dans les fiches sans toucher au carrousel `hero` déjà validé ni aux cartes `card`. Le bridge `postMessage`, les fallbacks, les toggles, la sélection des trailers et la modal de bande-annonce interactive restent inchangés.\n\n'''
          p.write_text(entry + s[len('# Changelog\n\n'):])
          PY
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Portable tests
        shell: bash
        run: |
          FILES=$(find scripts -maxdepth 1 -name '*.test.ts' ! -name 'server-capabilities.test.ts' -print | tr '\n' ' ')
          node --experimental-transform-types --no-warnings --import ./scripts/movviz-test-loader.mjs --test $FILES
      - name: Production build
        run: npm run build
      - name: Commit and tag v1.23.03 on main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/media/YouTubeVirtualPlayer.tsx package.json package-lock.json android-tv/app/build.gradle.kts android-mobile/app/build.gradle.kts README.md CHANGELOG.md
          git commit -m 'v1.23.03 — tune virtual YouTube detail framing [skip ci]'
          git tag -a v1.23.03 -m 'v1.23.03 — tune virtual YouTube detail framing'
          git push origin HEAD:main
          git push origin v1.23.03
      - name: Remove obsolete v1.23.02 staging branch
        shell: bash
        run: git push origin --delete v12302-youtube-unified-staging || true
