name: One-shot release v1.24.08

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v1.24.08.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify release base
        shell: bash
        run: |
          set -euo pipefail
          current="$(node -p "require('./package.json').version")"
          if [ "$current" != "1.24.07" ]; then
            echo "Expected 1.24.07, got $current" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin refs/tags/v1.24.08 >/dev/null 2>&1; then
            echo "Tag v1.24.08 already exists" >&2
            exit 1
          fi

      - name: Bump all version metadata to 1.24.08
        shell: bash
        run: |
          set -euo pipefail
          npm version 1.24.08 --no-git-tag-version --allow-same-version
          python3 - <<'PY'
          from pathlib import Path

          for name in (
              "android-mobile/app/build.gradle.kts",
              "android-tv/app/build.gradle.kts",
          ):
              p = Path(name)
              s = p.read_text(encoding="utf-8")
              if "12407" not in s or '"1.24.07"' not in s:
                  raise SystemExit(f"unexpected version metadata in {name}")
              s = s.replace("12407", "12408", 1).replace('"1.24.07"', '"1.24.08"', 1)
              p.write_text(s, encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          s = changelog.read_text(encoding="utf-8")
          if "## v1.24.08" not in s:
              marker = "# Changelog\n\n"
              section = (
                  "## v1.24.08 — August 2026\n\n"
                  "### Branding unifié — Windows, Android, Web/PWA et Docker\n\n"
                  "Le nouveau logo Movviz rose/mauve avec clap blanc devient l'identité commune de l'application. "
                  "L'installeur et les raccourcis Windows utilisent désormais un ICO multi-résolution, Android Mobile et Android TV "
                  "partagent les mêmes launcher/adaptive icons, le banner TV est aligné, et le Web/PWA ainsi que les assets Docker "
                  "utilisent le même visuel canonique.\n\n"
              )
              if marker not in s:
                  raise SystemExit("CHANGELOG header not found")
              s = s.replace(marker, marker + section, 1)
              changelog.write_text(s, encoding="utf-8")
          PY

      - name: Commit release metadata and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/release-v1.24.08.yml
          git add package.json package-lock.json CHANGELOG.md android-mobile/app/build.gradle.kts android-tv/app/build.gradle.kts
          git commit -m "release: v1.24.08 branding"

      - name: Create and push v1.24.08
        shell: bash
        run: |
          set -euo pipefail
          git tag -a v1.24.08 -m "Movviz v1.24.08 — unified branding"
          git push origin HEAD:main refs/tags/v1.24.08
