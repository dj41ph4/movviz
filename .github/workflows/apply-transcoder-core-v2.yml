name: Apply transcoder core v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-transcoder-core-v2.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply transcoder core patch
        run: python scripts/apply-transcoder-core-v2.py

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Playback policy tests
        run: |
          node --experimental-transform-types --no-warnings --import ./scripts/movviz-test-loader.mjs --test scripts/decide-playback.test.ts scripts/webcodecs-policy.test.ts

      - name: Portable test suite
        shell: bash
        run: |
          set -euo pipefail
          FILES=$(find scripts -maxdepth 1 -name '*.test.ts' ! -name 'server-capabilities.test.ts' -print | tr '\n' ' ')
          node --experimental-transform-types --no-warnings --import ./scripts/movviz-test-loader.mjs --test $FILES

      - name: Production build
        run: npm run build

      - name: Verify no Plex transcoder decision in new planner
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'mode: "PLEX_FALLBACK"' src/lib/playback/engine/decidePlayback.ts; then
            echo 'decidePlayback still emits PLEX_FALLBACK' >&2
            exit 1
          fi
          grep -q 'toneMapRealtimeFactor.*>= 3' src/lib/playback/engine/decidePlayback.ts
          grep -q 'MOVVIZ_FFMPEG_PATH' packaging/windows/installer/movviz-service.xml
          grep -q 'ffprobe.exe' packaging/windows/installer/build.ps1

      - name: Commit validated core and remove migration helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f scripts/apply-transcoder-core-v2.py .github/workflows/apply-transcoder-core-v2.yml
          git add -A
          git commit -m 'refactor(playback): unify transcoder core invariants'
          git push origin HEAD:main

      - name: Remove accidental temporary branches
        if: always()
        shell: bash
        run: |
          for b in noop-temp-do-not-use noop-temp-do-not-use2 noop-temp-do-not-use3 noop-temp-do-not-use4 noop-temp-do-not-use5; do
            git push origin --delete "$b" 2>/dev/null || true
          done
