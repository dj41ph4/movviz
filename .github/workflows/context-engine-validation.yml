name: Context Engine validation

on:
  push:
    branches: [main]
    paths:
      - 'src/lib/userContext/**'
      - 'src/lib/recommender/**'
      - 'src/lib/events/**'
      - 'src/app/api/metadata/**'
      - 'src/app/api/events/**'
      - 'src/lib/metadata/tmdb.ts'
      - 'scripts/full-history-recommendations.test.ts'
      - 'src/lib/playback/progressStore.ts'
      - 'src/lib/plex/watchStore.ts'
      - 'src/lib/plex/historyExport.ts'
      - 'src/app/api/plex/export-history/**'
      - 'engine/src/**'
      - 'src/lib/ai/profile.ts'
      - 'scripts/user-context.test.ts'
      - '.github/workflows/context-engine-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: context-engine-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Portable tests
        shell: bash
        run: |
          FILES=$(find scripts -maxdepth 1 -name '*.test.ts' ! -name 'server-capabilities.test.ts' -print | tr '\n' ' ')
          node --experimental-transform-types --no-warnings --import ./scripts/movviz-test-loader.mjs --test --test-concurrency=1 $FILES
      - name: Production build
        run: npm run build
      - name: Download pause tests
        run: node --test scripts/engine-pause.test.mjs
      - name: SQLite and watched state in the production bundle
        run: node scripts/check-context-production-bundle.mjs
