name: v1.22.56 version correction

on:
  push:
    branches:
      - v12256-release-staging
    paths:
      - .github/workflows/v12256-release-fix.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: v12256-release-staging

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Correct version to 1.22.56
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse -q --verify refs/tags/v1.22.56 >/dev/null; then
            echo 'v1.22.56 already exists'
            exit 1
          fi

          npm version 1.22.56 --no-git-tag-version

          python3 <<'PY'
          from pathlib import Path

          for path in [
              Path('android-tv/app/build.gradle.kts'),
              Path('android-mobile/app/build.gradle.kts'),
          ]:
              text = path.read_text(encoding='utf-8')
              text = text.replace('12254', '12256')
              text = text.replace('"1.22.54"', '"1.22.56"')
              path.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace('Movviz-1.22.54-7c3aed', 'Movviz-1.22.56-7c3aed', 1)
          readme.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          marker = '# Changelog\n\n'
          if not text.startswith(marker):
              raise SystemExit('CHANGELOG header not found')
          entry = '''## v1.22.56 — August 2026\n\n### Correction de version — preview YouTube des cartes\n\nRepublie le correctif de preview YouTube des petites cartes au-dessus de la `v1.22.55` déjà existante. Aucun changement fonctionnel par rapport au patch carte validé précédemment : iframe YouTube conservée, trafic direct YouTube → utilisateur, crop `scale 1.18`, centre à 46 %, masque supérieur proportionnel de 28 %, hero et vidéos de fiche inchangés.\n\n'''
          changelog.write_text(marker + entry + text[len(marker):], encoding='utf-8')
          PY

          rm -f .github/workflows/v12256-release-fix.yml

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Portable tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t TESTS < <(find scripts -maxdepth 1 -name '*.test.ts' ! -name 'server-capabilities.test.ts' -print | sort)
          node --experimental-transform-types --no-warnings --import ./scripts/movviz-test-loader.mjs --test "${TESTS[@]}"

      - name: Production build
        run: npm run build

      - name: Commit and tag v1.22.56
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'v1.22.56 — card YouTube preview version correction'
          git tag -a v1.22.56 -m 'v1.22.56 — card YouTube preview version correction'
          git push origin HEAD:v12256-release-staging
          git push origin v1.22.56
