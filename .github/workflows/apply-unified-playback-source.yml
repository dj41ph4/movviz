name: Apply unified playback source

# validation trigger 2026-08-31b
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-unified-playback-source.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply source/executor migration
        run: |
          python scripts/apply-unified-playback-source.py
          python scripts/fix-unified-playback-session-tests.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Playback tests
        run: |
          node --experimental-transform-types --no-warnings --import ./scripts/movviz-test-loader.mjs --test scripts/decide-playback.test.ts scripts/playback-source-session.test.ts scripts/playback-session-manager.test.ts scripts/webcodecs-policy.test.ts
      - name: Portable tests
        shell: bash
        run: |
          set -euo pipefail
          FILES=$(find scripts -maxdepth 1 -name '*.test.ts' ! -name 'server-capabilities.test.ts' -print | tr '\n' ' ')
          node --experimental-transform-types --no-warnings --import ./scripts/movviz-test-loader.mjs --test $FILES
      - name: Production build
        run: npm run build
      - name: Verify unified source invariants
        shell: bash
        run: |
          set -euo pipefail
          test -f src/lib/playback/engine/transcoderExecutor.ts
          test ! -f src/lib/playback/engine/localExecutor.ts
          grep -q 'type: "plex_raw"' src/lib/playback/engine/sessionManager.ts
          grep -q 'resolvePlexPartUrl' src/app/api/playback/prepare/route.ts
          grep -q 'getOrProbeRemoteMediaDescriptor' src/app/api/playback/session/\[sessionId\]/stream/route.ts
          ! grep -R 'playback/engine/localExecutor' src scripts
          ! grep -q 'resolveLocalFilePath' src/app/api/playback/session/\[sessionId\]/stream/route.ts
          ! grep -q 'plexFallbackUsed, true' scripts/playback-session-manager.test.ts
      - name: Commit validated migration and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f scripts/apply-unified-playback-source.py scripts/fix-unified-playback-session-tests.py .github/workflows/apply-unified-playback-source.yml
          git add -A
          git commit -m 'refactor(playback): unify local and Plex raw sources'
          git push origin HEAD:main
