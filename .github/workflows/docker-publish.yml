name: Publication de l'image Docker

# Construit packaging/docker/Dockerfile et la publie sur Docker Hub à chaque
# mise à jour de main - l'image récupérée par le NAS reste synchronisée
# avec le dépôt automatiquement, sans étape manuelle.
on:
  push:
    branches: [main]
  workflow_dispatch:

# File d'attente — un seul build Docker à la fois. Les pushes rapprochés
# (commit + tag) ne lancent pas deux builds parallèles qui se collisionnent
# sur Docker Hub. Le build en cours s'achève avant que le suivant commence.
concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            latest_tag: latest
          - arch: arm64
            platform: linux/arm64
            latest_tag: latest-arm64
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configuration de QEMU pour ARM
        # Image QEMU figée sur une version antérieure à une régression connue
        # (tonistiigi/binfmt#215, #245) : QEMU v9 plante en "Illegal
        # instruction" sur Node.js émulé en arm64 depuis un hôte amd64 —
        # exactement le blocage récurrent observé sur ce build. v7.0.0-28 est
        # la version documentée comme stable pour ce cas précis.
        uses: docker/setup-qemu-action@v3
        if: matrix.arch == 'arm64'
        with:
          image: tonistiigi/binfmt:qemu-v7.0.0-28

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construction et publication (${{ matrix.platform }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            # Le NAS AMD64 doit pouvoir récupérer la version dès que son
            # propre build est terminé, sans attendre le build ARM ni le
            # manifeste multi-architecture final.
            ${{ secrets.DOCKERHUB_USERNAME }}/movviz:${{ matrix.latest_tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/movviz:latest-${{ matrix.arch }}
            ${{ secrets.DOCKERHUB_USERNAME }}/movviz:sha-${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=movviz-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=movviz-${{ matrix.arch }}
          provenance: false

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Création des manifests multi-architecture
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/movviz
          SHA: ${{ github.sha }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:sha-${SHA}" \
            "$IMAGE:latest-amd64" \
            "$IMAGE:latest-arm64"
