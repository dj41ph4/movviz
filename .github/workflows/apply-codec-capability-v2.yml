name: Apply codec capability v2

# rerun after helper guard fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-codec-capability-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Tighten helper guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-codec-capability-v2.py')
          s = p.read_text(encoding='utf-8')
          old = "if 'silentAudioDetector' in s or \"watchForSilentAudio(\" in s:\n    raise SystemExit(\"silence detector still referenced by VideoPlayer\")"
          new = "if 'from \\\"@/lib/player/silentAudioDetector\\\"' in s or \"watchForSilentAudio(\" in s:\n    raise SystemExit(\"silence detector runtime dependency still referenced by VideoPlayer\")"
          if old not in s:
              raise SystemExit('helper guard anchor missing')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply patch
        run: python scripts/apply-codec-capability-v2.py

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Portable tests
        shell: bash
        run: |
          set -euo pipefail
          FILES=$(find scripts -maxdepth 1 -name '*.test.ts' ! -name 'server-capabilities.test.ts' -print | tr '\n' ' ')
          node --experimental-transform-types --no-warnings --import ./scripts/movviz-test-loader.mjs --test $FILES

      - name: Production build
        run: npm run build

      - name: Commit player capability changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/player/webcodecs.ts src/components/player/VideoPlayer.tsx scripts/webcodecs-policy.test.ts
          git add -u src/lib/player/silentAudioDetector.ts
          git commit -m 'refactor(player): replace silence detector with codec capabilities'
          git push origin HEAD:main

      - name: Remove one-shot patch helpers
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/apply-codec-capability-v2.py .github/workflows/apply-codec-capability-v2.yml
          git commit -m 'chore: remove codec capability patch helpers'
          git push origin HEAD:main
