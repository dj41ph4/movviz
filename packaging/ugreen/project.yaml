spec_version: "2.1"
app_id: com.dj41ph4.movviz
version: 0.0.0
support_arch:
  - amd64
  - arm64
product_series:
  - nasync
is_docker_app: true
only_admin: true
port: 9810
open_type: tab
tag_types:
  - media
  - download
depend_docker_version: 1.7.0.0000
depend_fw_version: 1.13.0.0000
privacy_policy_link:
  - https://movviz.dj41ph4.ovh/privacy
license_agreement_link:
  - https://github.com/dj41ph4/movviz/blob/main/LICENSE
source_code_link:
  - https://github.com/dj41ph4/movviz
technical_support_link:
  - https://github.com/dj41ph4/movviz/issues
parameters:
  - key: CONFIG_PATH
    type: path
    required: true
    changeable: false
    i18n:
      en-US:
        name: Configuration folder
        description: Persistent application state and database.
      fr-FR:
        name: Dossier de configuration
        description: État et base de données conservés lors des mises à jour.
  - key: DATA_PATH
    type: path
    required: true
    changeable: false
    i18n:
      en-US:
        name: Media folder
        description: One shared root for downloads and the media library.
      fr-FR:
        name: Dossier multimédia
        description: Racine unique pour téléchargements et médiathèque.
  - key: PUID
    type: number
    required: true
    changeable: true
    i18n:
      en-US:
        name: User ID
        description: ID of the account allowed to write to the selected folders.
      fr-FR:
        name: ID utilisateur
        description: ID du compte autorisé à écrire dans les dossiers choisis.
  - key: PGID
    type: number
    required: true
    changeable: true
    i18n:
      en-US:
        name: Group ID
        description: Group allowed to write to the selected folders.
      fr-FR:
        name: ID groupe
        description: Groupe autorisé à écrire dans les dossiers choisis.
i18n:
  en-US:
    name: MOVVIZ
    description: >-
      MOVVIZ is a self-hosted media platform for discovering, organizing,
      downloading and playing movies and TV series from a single interface,
      with integrated library management, automation and optional integrations.
    author: dj41ph4
    official: https://github.com/dj41ph4/movviz
    help: https://movviz.dj41ph4.ovh/help
    publisher: dj41ph4
    publisher_link: https://github.com/dj41ph4
  fr-FR:
    name: MOVVIZ
    description: >-
      MOVVIZ est une plateforme multimédia auto-hébergée permettant de découvrir,
      organiser, télécharger et lire films et séries depuis une interface unique,
      avec gestion de bibliothèque, automatisation et intégrations optionnelles.
    author: dj41ph4
    official: https://github.com/dj41ph4/movviz
    help: https://movviz.dj41ph4.ovh/help
    publisher: dj41ph4
    publisher_link: https://github.com/dj41ph4
